- id: q-colored-light-unity-005
  prompt: "Explica con tus palabras qué es la unidad cromática y cómo la crea una luz común sin que todo el cuadro tenga un único matiz."
  model_answer: "La unidad cromática (chromatic unity) aparece cuando todo el cuadro está bañado por una misma luz y todos los colores comparten un matiz común, de modo que el espectador lo lee como una atmósfera. Chevreul describe cómo una luz naranja altera cada color y que el pintor debe ajustar los demás; Leonardo propone, al atardecer, reutilizar en las partes iluminadas el color pintado para el sol. Pero unidad no es un solo matiz: Leonardo pide variedad dentro de una misma naturaleza."
  rubric:
    - "Define la unidad como un matiz o tinte compartido por una luz común que se lee como una atmósfera"
