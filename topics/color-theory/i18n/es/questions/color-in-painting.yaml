- id: q-local-vs-perceived-color-001
  prompt: "Según Gurney, ¿de qué cuatro factores depende el color de un punto de lo que se pinta?"
  options:
    a: "Color local, color de la luz, cantidad de luz y atmósfera intermedia"
    b: "Matiz, valor, croma y temperatura"
    c: "Color local, contraste simultáneo, textura y pincelada"
    d: "Color de la luz, color del fondo, brillo y tamaño del objeto"
  explanation: "Son los cuatro factores que da Gurney para analizar un color. Matiz, valor y croma son dimensiones del color, no causas de lo que llega al ojo; el contraste simultáneo es otro fenómeno que no figura entre sus cuatro factores."
- id: q-local-vs-perceived-color-002
  prompt: "¿Qué es el color local (local color) de un objeto?"
  options:
    a: "El color exacto que sale del tubo de pintura que usamos"
    b: "El color que llega al ojo desde un punto concreto del objeto"
    c: "El color que atribuimos al objeto mismo, con independencia de cómo esté iluminado"
    d: "El color del objeto en su parte más oscura"
  explanation: "El color local es el color que atribuimos a la cosa (la gorra es blanca). El que llega al ojo desde un punto concreto es el color percibido, que añade luz y atmósfera; confundir ambos es el error típico del principiante."
- id: q-local-vs-perceived-color-003
  prompt: "¿Cómo se llama el color que de hecho llega al ojo desde un punto del objeto, como resultado de su superficie, de la luz que recibe y de lo que hay por medio?"
  accepted:
    - "color percibido"
    - "perceived color"
    - "perceived colour"
    - "el color percibido"
- id: q-local-vs-perceived-color-004
  prompt: "Según Leonardo, ¿en qué partes de un objeto se ve más cerca de su verdadero color?"
  options:
    a: "En las partes en sombra, donde el color es más profundo"
    b: "En las partes iluminadas, libres de sombra y de brillo"
    c: "En los brillos, donde la luz es más fuerte"
    d: "En el contorno, junto al fondo"
  explanation: "Leonardo sitúa el color más verdadero en las partes libres de sombra y de brillo; en sombra el color toma el tinte de la sombra y en el brillo se refleja el color de la luz."
- id: q-local-vs-perceived-color-005
  prompt: "¿Por qué los principiantes tienden a ver solo el color local de lo que pintan?"
  options:
    a: "Porque no han aprendido a mezclar los pigmentos con suficiente precisión"
    b: "Porque el ojo es incapaz de registrar las diferencias de luz y de sombra sobre una superficie"
    c: "Porque el color local es en realidad más fiable y más cercano al color físico del objeto"
    d: "Porque la constancia del color, un proceso inconsciente, hace percibir los colores de los objetos como estables aunque cambie la luz"
  explanation: "La constancia del color es inconsciente y difícil de anular, así que filtra luz y sombra. No es una incapacidad del ojo (el color llega, el cerebro lo reinterpreta) ni el color local es más fiable: depende de supuestos sobre luz y material."
- id: q-local-vs-perceived-color-006
  prompt: "Al estimar la claridad de un objeto, ¿dónde fijan la vista los observadores según Witzel y colaboradores?"
  options:
    a: "En sus partes más claras (sin contar los brillos), las menos afectadas por el sombreado"
    b: "En sus partes más oscuras, que concentran la información del material"
    c: "En los brillos, que indican la luz que recibe"
    d: "Por igual en toda la superficie, sin preferencia"
  explanation: "Los observadores miran las zonas más claras sin contar los brillos, porque el sombreado las afecta menos. Los brillos quedan excluidos porque reflejan la luz y no informan del color de la superficie."
- id: q-local-vs-perceived-color-007
  prompt: "Un plátano medido como gris con aparatos se ve ligeramente amarillento. ¿Qué ilustra esto?"
  options:
    a: "Que la luz del taller es siempre más cálida que la del exterior"
    b: "Que lo que sabemos de un objeto (su color de memoria) sesga lo que vemos de él"
    c: "Que el contraste simultáneo tiñe el objeto con el complementario del fondo"
    d: "Que los observadores no distinguen los grises de los amarillos"
  explanation: "Es el efecto de la memoria de color: el conocimiento del objeto sesga la percepción, más en azules y amarillos. No se debe al fondo ni a la luz: se midió el objeto como gris."
- id: q-local-vs-perceived-color-008
  prompt: "Explica con tus palabras por qué la afirmación 'el color local es el que dice el tubo de pintura' es un error."
  model_answer: "El color local no es una medida física sino una idea de percepción: solo se puede asignar una coordenada de color a un objeto con supuestos muy fuertes sobre su forma, material e iluminación (superficie plana y mate bajo luz idealizada). Lo que llega al ojo en cada punto es el color percibido, que mezcla superficie, color y cantidad de luz y atmósfera. El color local solo se acerca al de la pintura en las zonas iluminadas, mates y sin brillo; en sombra o en un brillo el punto se parece más a otro tubo."
  rubric:
    - "Dice que el color local es una idea de percepción y no una medida del objeto"
    - "Menciona que depende de supuestos sobre forma, material o iluminación"
    - "Distingue el color percibido en un punto (superficie + luz + atmósfera) del color local"
    - "Indica que solo en zonas iluminadas, mates y sin brillo se acerca al color real de la pintura"
- id: q-local-vs-perceived-color-009
  prompt: "Explica con tus palabras de qué manera los objetos vecinos modifican el color percibido en un punto del cuadro, mencionando los dos mecanismos distintos que describen Leonardo y Chevreul."
  model_answer: "Leonardo describe un efecto de reflejo: cada superficie opaca toma parte del color de los objetos que la rodean, tanto más cuanto más cercanos y fuertes sean. Chevreul describe el contraste: de dos colores vistos juntos, cada uno aparece con su propio color más el complementario del otro, y el claro se aclara y el oscuro se oscurece. Por eso el color percibido en un punto mezcla luz, vecinos y contraste y no solo la pintura que se pone."
  rubric:
    - "Describe el mecanismo de Leonardo: la superficie toma color de los objetos próximos (reflejo)"
    - "Describe el mecanismo de Chevreul: el contraste, con el complementario del vecino"
    - "Aclara que son efectos distintos (uno es físico, otro del ojo)"
    - "Concluye que el color percibido combina luz, vecinos y contraste"
- id: q-local-vs-perceived-color-010
  prompt: "Vas a pintar del natural un balón de voleibol blanco a contraluz, al sol. Tu primer impulso es mezclar blanco para las partes sombreadas. ¿Cómo decides el color de esas partes y cómo lo justificas?"
  model_answer: "Antes de mezclar analizo ese punto con los cuatro factores de Gurney: el color local (blanco, probable), el color de la luz que cae ahí (en la cara sombreada a contraluz llega luz de cielo y rebote, no sol directo), la cantidad de luz (poca) y la atmósfera que hay en medio. El resultado es un color percibido que no será un blanco puro sino un gris con tinte de cielo o rebote. Lo mezclo comparándolo con los colores vecinos de la escena, no solo, y lo ajusto. La regla es de un autor de práctica (Gurney, fuente C), por eso la valido comparando con lo que veo."
  rubric:
    - "Aplica los cuatro factores: color local, color de la luz, cantidad de luz y atmósfera"
    - "Concluye que la parte sombreada no se pinta con blanco puro sino con el color percibido (tintado por la luz que le llega)"
    - "Propone comparar el color con los vecinos de la escena en lugar de juzgarlo aislado"
    - "No presenta el método como una ley (es práctica de Gurney)"
- id: q-local-vs-perceived-color-011
  prompt: "Pintas un tapiz o un diseño plano con una banda roja junto a una azul. Ves que el borde del rojo junto al azul parece anaranjado y el del azul parece verdoso, y estás tentado de pintar esos tonos en los bordes. ¿Qué haces y por qué?"
  model_answer: "Pinto simplemente rojo y azul y dejo que el contraste simultáneo actúe en el ojo del espectador. Según Chevreul, quien copia el naranja aparente del borde rojo o el verde del azul exagera el efecto, porque el contraste ya lo producirá al mirar la obra y el espectador lo vería dos veces. Hay que copiar el modelo de forma distinta a como se ve. Hay una cautela: el ejemplo de Chevreul se refiere a tintes planos y tapices; en un cuadro con modelado se suman las modificaciones por luz y reflejos."
  rubric:
    - "Decide pintar los colores locales (rojo y azul) sin copiar el tono aparente del borde"
    - "Explica que el contraste simultáneo ya se producirá en el ojo del espectador"
    - "Señala que copiar el efecto lo duplicaría o exageraría"
    - "Matiza que el caso de Chevreul se refiere a tintes planos y que en un cuadro modelado se suman luz y reflejos"
- id: q-local-vs-perceived-color-012
  prompt: "Un alumno pinta una gorra blanca que está a la sombra, bajo un cielo azul y con mucho aire por medio, con blanco casi puro 'porque la gorra es blanca'. Su cuadro parece plano y fuera de la luz. ¿Qué le dices?"
  model_answer: "Le explico que ha pintado el color local, lo que sabe de la gorra, y no el color percibido. Las sombras toman tinte de la luz que reciben (aquí cielo azul) y el aire intermedio también cambia el color; si acerca un tubo azul a la gorra verá que se parece más a él que al blanco. El cerebro lo oculta por constancia del color y pintar exige ver lo que llega al ojo. Le propongo analizar los cuatro factores de Gurney, comparar con otros colores de la escena y reservar el color local casi puro para las partes iluminadas, mates y sin brillo (Leonardo)."
  rubric:
    - "Identifica el error como pintar el color local en vez del percibido"
    - "Explica que la sombra y la luz del cielo (y la atmósfera) cambian el color de la gorra"
    - "Cita la constancia del color o el hecho de que el cerebro filtra esas variaciones"
    - "Propone un método concreto: cuatro factores, comparar con vecinos o reservar el color local para la parte iluminada"
- id: q-local-vs-perceived-color-013
  prompt: "Debes elegir entre un cuadro que copie con fidelidad cómo modifica la luz los colores del modelo y otro que busque una armonía de colores locales sin ser fiel a la escena. Un cliente te pregunta cuál es la opción correcta. ¿Qué le respondes?"
  model_answer: "Le respondo que ninguna es la única correcta: ambos son modelos de la misma realidad y el pintor decide cuál representa. Chevreul distingue entre la fidelidad en copiar cómo la luz modifica los colores del modelo y el agrado de una armonía de colores locales, y señala que quien juzga a un colorista pesa de forma distinta fidelidad, exageración y armonía. Si el cuadro depende de la luz, priorizaría el color percibido y dejaría que el local se infiera; si se busca una armonía decorativa, los colores locales. Lo importante es decidirlo de forma consciente."
  rubric:
    - "Afirma que ambas opciones son defendibles y que la decisión es del pintor"
    - "Menciona la distinción de Chevreul entre fidelidad al modelo y armonía de colores locales"
    - "Asocia el color percibido a cuadros que dependen de la luz"
    - "Evita presentar una opción como regla universal"
- id: q-light-and-shadow-color-001
  prompt: "¿Qué respalda el resultado de Smith sobre la luz del cielo?"
  options:
    a: "Que la luz del cielo cerca del horizonte es más azul que en el cenit"
    b: "Que las sombras al aire libre son siempre azuladas"
    c: "Que el Sol emite luz azul que el aire enrojece"
    d: "Que la luz del cielo en el cenit de un día claro está desplazada hacia el azul respecto a la del Sol (aprox. 1/λ⁴)"
  explanation: "Smith modela el cielo del cenit con un día claro y Sol alto como espectro solar por 1/λ⁴. No trata sombras ni el horizonte; que una sombra sea azulada es una inferencia razonable, no una afirmación de la fuente."
- id: q-light-and-shadow-color-002
  prompt: "La regla 'los planos en sombra que miran hacia arriba son fríos y los que miran hacia abajo, cálidos' es, según el contenido:"
  options:
    a: "Un resultado medido por Yu y Hurlbert en cuadros reales"
    b: "Una regla que solo vale para la hora dorada"
    c: "Una regla de práctica de Gurney, útil como punto de partida y con excepciones"
    d: "Una ley óptica que se cumple siempre que haya cielo azul"
  explanation: "Gurney la presenta como regla de práctica (rebote cálido del suelo, cielo azul arriba) con excepciones: la luz reflejada cálida puede hacer las sombras más cálidas que las luces. No es una ley ni una medida."
- id: q-light-and-shadow-color-003
  prompt: "Según Chevreul, ¿cómo cambia un rojo al pasar de la parte iluminada a la sombreada?"
  options:
    a: "Se vuelve más amarillento"
    b: "Pasa de más anaranjado a más carmesí"
    c: "Pierde matiz y se vuelve gris"
    d: "No cambia de matiz, solo se oscurece"
  explanation: "Chevreul sostiene que la luz cambia el matiz y no solo la claridad: el rojo es más anaranjado al sol y más carmesí en sombra. La opción de que solo se oscurece es justo la idea que rechaza."
- id: q-light-and-shadow-color-004
  prompt: "Según Conway y Livingstone, ¿qué basta para que una sombra pintada se lea como sombra aunque sea físicamente imposible?"
  options:
    a: "Que la región sea relativamente más oscura y más desaturada que su entorno local, con cualquier matiz que lo cumpla"
    b: "Que tenga exactamente el color complementario de la luz"
    c: "Que sea siempre azul, como el cielo"
    d: "Que sea el color del objeto mezclado con negro"
  explanation: "Basta la relación de valor y saturación con el entorno; los fauvistas y Kingdom y colaboradores lo mostraron. Por eso el matiz de la sombra es una decisión de composición, aunque la sombra creíble dependa del resto del cuadro."
- id: q-light-and-shadow-color-005
  prompt: "Yu y Hurlbert dicen que con sol bajo la luz directa se inclina al rojo. ¿Cómo debe entenderse esta afirmación?"
  options:
    a: "Como una prueba de que los pintores eligieron colores cálidos a propósito"
    b: "Como un resultado medido por ellos en las sombras de los cuadros"
    c: "Como su explicación física de la luz natural (más dispersión de Rayleigh y más atmósfera), no un resultado medido por ellos"
    d: "Como una demostración de que las sombras al atardecer son azules"
  explanation: "Es una explicación física que ellos aportan sobre la luz natural. Lo medido es la distribución de color de los cuadros, de forma correlacional; y el contenido avisa de que no hay una medida directa del color de las sombras a esa hora."
- id: q-light-and-shadow-color-006
  prompt: "Explica con tus palabras por qué, según Leonardo, la sombra sobre una pared blanca al ponerse el sol es azul, y qué estatus tiene hoy esa idea."
  model_answer: "Leonardo razona que la parte iluminada de la pared recibe el rojo del sol y la parte sombreada recibe solo la luz azul del cielo. Es coherente con el hecho, respaldado por Smith, de que la luz del cielo está desplazada hacia el azul respecto a la del Sol; pero Smith solo trata el cenit, así que decir que una zona en sombra es más azulada es una inferencia razonable y no una afirmación de la fuente. Lo que Leonardo pide es que el pintor conozca la causa para que el efecto sea verosímil."
  rubric:
    - "Explica que el sol directo da luz rojiza y la sombra solo recibe luz de cielo azul"
    - "Relaciona la idea con que la luz del cielo es más azul que la del Sol (Smith)"
    - "Aclara que la conclusión sobre sombras es inferencia, no algo que Smith afirme"
    - "Menciona que el pintor debe conocer la causa para hacer verosímil el efecto"
- id: q-light-and-shadow-color-007
  prompt: "Explica con tus palabras cómo se forma el color de un reflejo sobre una superficie y en qué se equivocaba Leonardo al razonar sobre él."
  model_answer: "El reflejo toma el color del objeto que lo emite y del objeto sobre el que cae, más cuanto más lisa sea la superficie receptora; nunca es un color simple sino mezcla de todo lo que allí se refleja, y es más débil que la luz directa. Leonardo razonaba como si los colores reflejados se mezclaran como pigmentos (un cuerpo amarillo con reflector azul daría verde). La visión actual, tal como la resume Gurney, lo describe como mezcla de luz y color de superficie, y no se reduce a 'azul más amarillo es verde'."
  rubric:
    - "Dice que el reflejo combina el color del emisor y el de la superficie receptora"
    - "Indica que es más débil que la luz directa o que nunca es un color simple"
    - "Señala que Leonardo lo trataba como mezcla de pigmentos"
    - "Contrapone la idea actual de mezcla de luz y color de superficie"
- id: q-light-and-shadow-color-008
  prompt: "¿Qué idea errónea sobre las sombras corrigen Leonardo y Chevreul?"
  options:
    a: "Que las sombras no se ven en luz de cielo"
    b: "Que la sombra de un color es simplemente ese color más oscuro o con negro"
    c: "Que la sombra es siempre más fría que la luz"
    d: "Que la sombra depende de la luz que recibe"
  explanation: "Leonardo advierte que el color de la sombra no es puro cuando hay vecinos coloreados, y Chevreul que las sombras complementarias salen del contraste con un gris. La receta con negro es solo un punto de partida."
- id: q-light-and-shadow-color-009
  prompt: "Pintas del natural un muro blanco al atardecer, con el sol bajo a un lado. Tienes que decidir el color de tres zonas: la cara soleada, la cara en sombra que mira al cielo y el plano inferior de un voladizo que mira al suelo iluminado. ¿Qué decides y con qué reservas?"
  model_answer: "Empiezo identificando las fuentes y hacia dónde mira cada plano. La cara soleada recibe el color del sol, rojizo cuando está bajo (Leonardo). La cara en sombra que mira al cielo recibe sobre todo luz de cielo, así que la pinto más azulada y fría. El plano que mira abajo recibe rebote del suelo iluminado, así que lo pinto más cálido, incluso con valor casi igual (regla de práctica de Gurney). Mantengo todo con una relación coherente de valor y compruebo comparando con los vecinos. Con reservas: es una regla de práctica con excepciones, y no hay una medida directa del color de las sombras a esa hora, así que decido caso por caso."
  rubric:
    - "Asigna a la cara soleada el color cálido del sol bajo"
    - "Pinta más fría/azulada la sombra que mira al cielo y más cálida la que mira al suelo (rebote)"
    - "Razona a partir de las fuentes de luz y la orientación de cada plano"
    - "Reconoce que la regla de práctica tiene excepciones y se comprueba comparando con el entorno"
- id: q-light-and-shadow-color-010
  prompt: "Retratas a una modelo junto a una pared naranja iluminada por el sol. Aplicas la fórmula 'luz cálida, sombra fría' y la sombra de la mejilla te queda fría y azulada, pero se ve incoherente. ¿Qué ocurre y cómo lo resuelves?"
  model_answer: "La fórmula tiene límites, como avisa Gurney: la luz reflejada cálida de la pared puede hacer las sombras más cálidas que las luces. La sombra de la mejilla recibe rebote naranja de la pared, así que probablemente debe ser cálida y no fría. Identifico las fuentes (sol, cielo, rebote), miro hacia dónde mira el plano, decido la intensidad (un reflejo es más débil que la luz directa) y comparo con los demás colores de la escena. La fórmula solo dice por dónde empezar. Se trata de práctica de Gurney (fuente C), por eso lo compruebo mirando."
  rubric:
    - "Reconoce que la luz reflejada cálida puede hacer la sombra más cálida que la luz"
    - "Identifica la pared naranja como fuente de reflejo y analiza la orientación del plano"
    - "Propone comparar con los colores vecinos y ajustar a lo visto"
    - "Trata la fórmula como punto de partida y no como ley"
- id: q-light-and-shadow-color-011
  prompt: "Un alumno ha hecho estudios de una figura en casa, bajo una lámpara concreta, y quiere usarlos para un cuadro de campo abierto con luz general del cielo. ¿Qué le adviertes y qué le propones?"
  model_answer: "Le advierto, como Leonardo, del error clásico de usar en un cuadro de campo abierto estudios hechos en casa bajo otra luz: aparecen sombras y reflejos oscuros que la naturaleza no daría con luz general de cielo. Propongo elegir la luz del cuadro con intención (los bordes de las sombras dicen qué luz hay: pequeña, sombras nítidas; grande o nubes finas, borrosas) y rehacer los estudios con esa luz, a ser posible del natural, con luz estable (ventana al norte o visillos si hay sol)."
  rubric:
    - "Advierte que el estudio con otra luz introduce sombras y reflejos incoherentes con el campo abierto"
    - "Indica que la luz del cuadro se elige con intención y que los bordes de las sombras delatan el tipo de luz"
    - "Propone rehacer o completar los estudios con la luz del cuadro (o luz estable)"
    - "Se apoya en Leonardo sin presentar sus afirmaciones como leyes ópticas"
- id: q-light-and-shadow-color-012
  prompt: "Un colega afirma: 'Yu y Hurlbert demuestran que los pintores elegían deliberadamente 4692 K para las escenas de tarde'. ¿Cómo valoras esa afirmación y qué usas del estudio para tu propio trabajo?"
  model_answer: "No se sostiene. El estudio es correlacional: mide la distribución de color de reproducciones de cuadros (Europa occidental, siglos XVII-XX, paisaje dominante) y no dice cómo mezclaron los pintores ni qué intención tenían. Además las cifras dependen de cómo se clasifique: por título la CCT media fue 5233 K de mañana y 4692 K de tarde, y por la clasificación de los observadores, 5686 K y 3945 K; no deben mezclarse. Como orientación, no receta: los de mañana se agrupan cerca de un blanco neutro (D50-D55) y los de tarde se reparten hacia lo cálido, y la diferencia de cromaticidad es más clara que la de luminancia."
  rubric:
    - "Rechaza la afirmación por ser un estudio correlacional que no demuestra la intención del pintor"
    - "Mantiene separados los dos conjuntos de cifras (por título 5233/4692 K; por observadores 5686/3945 K)"
    - "Usa el resultado solo como orientación: mañana cerca de neutro, tarde hacia lo cálido"
    - "Menciona alguna limitación (reproducciones, época, títulos o diferencias entre individuos)"
- id: q-atmospheric-perspective-001
  prompt: "Según Narasimhan y Nayar, ¿qué dos efectos de la atmósfera explican el color de un objeto lejano?"
  options:
    a: "La refracción de la luz y el contraste simultáneo"
    b: "La absorción por el vapor de agua y el reflejo del suelo"
    c: "La atenuación de la luz del objeto y la luz del aire (airlight) que dispersan las partículas"
    d: "La atenuación lineal y la saturación creciente"
  explanation: "Son la atenuación (e^(−βd) de la luz del objeto) y el airlight (luz ambiental dispersada hacia el observador, horizonte × (1 − e^(−βd))). La atenuación no es lineal sino exponencial."
- id: q-atmospheric-perspective-002
  prompt: "A medida que aumenta la distancia, ¿hacia qué converge el color de un objeto?"
  options:
    a: "Hacia el negro, porque la luz se pierde"
    b: "Hacia el color del aire del horizonte"
    c: "Hacia un gris neutro fijo, sea cual sea la atmósfera"
    d: "Hacia el complementario de su color original"
  explanation: "El color que llega es el del objeto atenuado más el del horizonte; al crecer la distancia pesa menos lo primero. Converge al color del aire del horizonte, que puede ser azul claro, gris o incluso rojizo según la luz."
- id: q-atmospheric-perspective-003
  prompt: "En niebla o bruma densa (γ casi 0), ¿qué le pasa a lo lejano según el modelo de Narasimhan y Nayar?"
  options:
    a: "Se vuelve más saturado conforme se aleja"
    b: "Pierde por completo la forma, pero conserva el brillo"
    c: "Cambia de brillo pero casi no de matiz, y se acerca a la luz grisácea del aire"
    d: "Se vuelve azul claro de forma muy marcada"
  explanation: "Con γ ≈ 0 la dependencia de la longitud de onda desaparece: la luz transmitida cambia de brillo pero no de matiz, y la luz del aire tiende al gris o al azul claro. 'La atmósfera siempre da azul' es justo el concepto erróneo."
- id: q-atmospheric-perspective-004
  prompt: "¿Por qué no se acepta hoy la explicación de Leonardo del azul del cielo (mezcla de luz y oscuridad), aunque sí se aprovecha su consecuencia práctica?"
  options:
    a: "Porque Leonardo no observó el cielo del horizonte"
    b: "Porque Leonardo creía que el cielo era verde"
    c: "Porque la regla de pintar lo lejano más azul es falsa en todos los casos"
    d: "Porque la óptica moderna lo atribuye a la dispersión de la luz solar por moléculas del aire, no a una mezcla de negro y blanco; lo útil es que lo lejano se ve más azul y pálido"
  explanation: "Smith atribuye el azul del cielo a la dispersión (1/λ⁴) por moléculas del aire. La consecuencia práctica (más azul y más pálido con la distancia) se conserva, pero no su causa; tampoco es cierto que la regla sea falsa siempre, aunque tiene excepciones (niebla, sol bajo)."
- id: q-atmospheric-perspective-005
  prompt: "Según Smith, ¿cómo es el color del cielo en el cenit de un día claro?"
