- id: q-colored-light-unity-006
  prompt: "Pintas un paisaje al ocaso. Los edificios y las copas de los árboles que reciben el sol los has pintado con colores distintos entre sí y el resultado no parece una sola luz. ¿Qué haces?"
  model_answer: "Aplico la receta de unidad de Leonardo: a la puesta del sol todo es de un color excepto lo que el sol alumbra, y en todas las zonas iluminadas se reutiliza el color pintado para el sol (un amarillo-rojo), mientras el resto se funde en una masa general. Dejo que las sombras reciban el color del cielo y ajusto cada color local a esa luz, como en la lista de Chevreul (bajo luz naranja los azules claros van a gris, etc.). Mantengo variedad de matiz y valor sin romper la naturaleza común. Elijo primero el color de la luz y el valor global."
  rubric:
    - "Elige el color de la luz (y el valor global) como señal compartida"
    - "Reutiliza el color del sol en todas las zonas iluminadas, y las sombras reciben el color del cielo"
    - "Ajusta los colores locales a esa luz según Chevreul"
    - "Conserva variedad dentro de la unidad"
- id: q-colored-light-unity-007
  prompt: "Planeas dos versiones del mismo paisaje, una de mañana y otra de tarde. Quieres usar los datos de Yu y Hurlbert para orientar la paleta. ¿Qué tomas de ellos y qué cautelas aplicas?"
  model_answer: "Tomo la orientación: los cuadros de mañana tienen más brillo, contraste y saturación y matices más azules, y se agrupan cerca de un blanco neutro (D50-D55); los de tarde tienen menos brillo, contraste y saturación, matices más amarillos y se reparten hacia lo cálido. Las cifras dependen de la clasificación (por título, 5233 K frente a 4692 K; por observadores, 5686 K frente a 3945 K) y no deben mezclarse. Las cautelas: es evidencia correlacional de reproducciones de Europa occidental, siglos XVII-XX, los títulos antiguos no los eligieron los artistas y las diferencias entre individuos son grandes; es orientación, no receta."
  rubric:
    - "Indica que la mañana lleva más brillo/contraste/saturación y tonos azules o neutros y la tarde, lo contrario y más cálido"
    - "Cita las cifras de CCT sin mezclar los dos conjuntos (título vs observadores)"
    - "Dice que es evidencia correlacional que no muestra la intención del pintor"
    - "Menciona al menos una limitación (reproducciones, época, títulos o variabilidad individual)"
- id: q-colored-light-unity-008
  prompt: "Pintas una escena con luz muy cálida y estás tentado de hacer la lejanía muy azul y fría 'porque lo lejano es azul'. ¿Qué decides y con qué criterio?"
  model_answer: "Hay que decidir qué manda: la luz del cuadro o la regla de la lejanía. Si el cuadro es una unidad de luz cálida, dejo que la luz tiña también el aire: Leonardo describe que, a la puesta del sol, los objetos lejanos azulados recogen el rojo del horizonte, y el aire adopta el color. Por tanto atenúo el azul y lo acerco al color del aire del cuadro, manteniendo la lejanía más pálida y menos definida. Es una regla de taller y un compromiso que se comprueba con bocetos."
  rubric:
    - "Plantea el conflicto luz del cuadro frente a regla de la lejanía"
    - "Decide que el aire se tiñe con la luz cálida (los objetos lejanos recogen el color del horizonte)"
    - "Mantiene la lejanía más pálida o menos definida"
    - "Presenta la decisión como compromiso de oficio y no como ley"
- id: q-colored-light-unity-009
  prompt: "Un cliente pide 'unidad total': todo el cuadro en tonos naranja. Al probarlo, queda plano y artificial. ¿Cómo lo reorientas?"
  model_answer: "Le explico que unidad no es un solo matiz: Leonardo pide variedad dentro de una misma naturaleza (no se pinta todo árbol con el mismo verde, porque estaciones y clima cambian los verdes). Mantengo el color de la luz como señal común, pero hago variar los demás colores en matiz y valor y dejo que las sombras reciban otro color, el del cielo. Aviso de los trade-offs: Chevreul admite que un cuadro puede ser fiel pero exagerado, y que a menudo gusta más; Gurney opina que una clave de una sola familia tiende a parecer fotográfica (opinión suya). Pruebo en bocetos."
  rubric:
    - "Dice que la unidad no equivale a un único matiz"
    - "Propone variar matiz y valor dentro de una naturaleza común y dar a las sombras el color del cielo"
    - "Menciona el equilibrio entre fidelidad y exageración (Chevreul) o la opinión de Gurney, señalada como opinión"
    - "Propone comprobar con bocetos"
- id: q-gamut-planning-001
  prompt: "Vas a ilustrar una serie de láminas que deben tener un color controlado y consistente entre sí. ¿Qué método de planificación de gama eliges y cómo lo aplicas?"
  model_answer: "Usaría el enmascarado de gama (gamut masking) de Gurney: coloco una forma, normalmente un triángulo, sobre la rueda; lo de dentro es la paleta y lo demás se excluye. Premezclo cadenas de color (color strings) a partir de los vértices (primarios subjetivos) y solo uso esas en todas las láminas. Una forma más pequeña da un rango más estrecho. Es un método de práctica (Gurney, fuente C), pensado para trabajos en serie, no una ley; la máscara es un plan, y la gama real se comprueba con muestras secas de mis tubos."
  rubric:
    - "Propone una máscara (triángulo u otra forma) sobre la rueda y usar solo lo que queda dentro"
    - "Menciona premezclar cadenas de color a partir de los vértices"
    - "Relaciona el método con trabajos en serie y control/consistencia"
    - "Presenta el método como práctica de Gurney (fuente C) y comprobable, no como ley"
- id: q-gamut-planning-002
  prompt: "Tu máscara de gama tiene un vértice en un amarillo muy saturado, pero en tu caja solo tienes un ocre amarillo. ¿Qué consecuencia tiene y qué haces?"
  model_answer: "El pigmento elegido fija el vértice: el ocre, menos saturado que un amarillo de cadmio, deja el vértice más dentro del margen de la rueda y reduce la gama. Los datos Munsell de Williamsburg dan una medida: el amarillo de cadmio medio tiene valor 8,45 y croma 16,78, y el ocre amarillo, 5,55 y 8,69; un amarillo de croma alto no sale de un ocre. Por eso elijo pigmentos que cubran los vértices comprobando su croma, o bien acepto una gama más estrecha y rediseño la máscara. Los datos son de una marca concreta."
  rubric:
    - "Explica que el pigmento fija el vértice y que un ocre reduce la gama"
    - "Cita la diferencia de croma (cadmio medio 16,78 frente a ocre 8,69) o de valor"
    - "Propone elegir pigmentos que cubran los vértices o rediseñar la máscara"
    - "Aclara que no es posible mezclar un amarillo de croma alto a partir de un ocre"
- id: q-gamut-planning-003
  prompt: "Dibujas un triángulo de gama con tres pigmentos y supones que cualquier color dentro del triángulo se puede mezclar a partir de ellos. Al probar, un tono interior no sale. ¿Qué ocurre y cómo planificas en adelante?"
  model_answer: "Las mezclas de pintura no siguen líneas rectas: las líneas de mezcla de la pintura son erráticas y suelen curvarse, a diferencia de las luces, que caen sobre rectas en un diagrama de cromaticidad; el modelo de Kubelka-Munk (absorción y dispersión por pigmento) explica la no linealidad. Por eso no todo lo que cae dentro del triángulo es mezclable desde los vértices. Además, pinturas del mismo color visual pueden mezclar de otro modo. Trato la máscara como un plan y fijo la gama real con muestras secas de mis tubos; si hace falta, añado o cambio un pigmento."
  rubric:
    - "Dice que las mezclas de pintura no son lineales y que sus líneas se curvan"
    - "Contrapone con las luces (rectas en un diagrama de cromaticidad) o menciona Kubelka-Munk"
    - "Concluye que no todo lo de dentro del triángulo se mezcla desde los vértices"
    - "Propone verificar con muestras secas de los propios tubos"
- id: q-gamut-planning-004
  prompt: "Tu cuadro está casi todo en un ambiente verde apagado y quieres un punto de atención. ¿Cómo lo resuelves con la lógica del enmascarado de gama?"
  model_answer: "Con un esquema de 'ambiente y acento' de Gurney: casi todo el cuadro en un ambiente de color y un único acento del otro lado de la rueda, sin mezclas intermedias. Como con una máscara la armonía ya está dada, el esfuerzo se va a buscar el acento. Un acento desplazado (no el complemento exacto) parece menos natural y puede llamar más la atención, así que decido si busco naturalidad o impacto. Antes planeo valores en dos o tres grupos, porque el color no salva un mal diseño de valores. Es práctica de Gurney, no ley."
  rubric:
    - "Propone un ambiente dominante y un único acento del lado opuesto de la rueda"
    - "Indica que el acento no lleva mezclas intermedias"
    - "Señala que el acento desplazado parece menos natural o llama más la atención"
    - "Menciona planear antes los valores o presenta la regla como práctica de Gurney"
- id: q-gamut-planning-005
  prompt: "Quieres usar las dos primeras componentes principales de Yu y Hurlbert (luminancia y contraste; cromaticidad) como guion para planificar la gama de un cuadro. ¿Es razonable? ¿Qué cuidado tienes?"
  model_answer: "Es una lectura razonable pero propia: esas dos componentes explican el 71,1 % de la varianza de 30 estadísticas redundantes de 104 cuadros, y sugieren que la gama se puede fijar antes de pintar en dos ejes: cuánto rango de claros, oscuros y contraste, y cuánto de saturación y de qué matices. Pero el estudio es correlacional y no dice cómo planean los pintores la paleta; no es una receta, es una forma de ordenar decisiones que verifico en bocetos."
  rubric:
    - "Identifica los dos ejes: luminancia/contraste y cromaticidad (saturación y matiz)"
    - "Indica que es una lectura propia de datos correlacionales"
    - "Aclara que el estudio no muestra cómo planean los pintores"
    - "Propone usarlo como guía y verificarlo en bocetos"
- id: q-gamut-planning-006
  prompt: "Debes elegir entre una gama pequeña (casi monocroma) o una más amplia para dos encargos: una serie de láminas de ilustración y una escena con muchos objetos de colores locales y luz mixta. ¿Qué decides y por qué?"
  model_answer: "Para la serie de ilustración elijo una gama pequeña: da unidad y consistencia (una forma más pequeña produce un rango más estrecho). Para la escena con muchos colores locales y luz mixta uso una gama más amplia: aporta variedad (Leonardo recomienda variar los verdes y vestir las figuras con colores vivos para que se despeguen). No confundo gama con paleta de tubos: la máscara define lo que se verá, no lo que hay en la caja. Para MacEvoy el estilo y la técnica pesan más y los principiantes eligen demasiados colores saturados; Gurney lo plantea como preferencia, no como ley."
  rubric:
    - "Elige gama pequeña para unidad/consistencia en series y más amplia para variedad"
    - "Explica que más variedad de colores locales o luz mixta pide más gama"
    - "Distingue la gama de la paleta de tubos"
    - "Presenta la decisión como criterio de oficio (preferencias de Gurney, estilo y técnica) y no como ley"
- id: q-judging-color-001
  prompt: "Mezclas un color que, solo en la paleta, parece exactamente el del motivo, pero al ponerlo en el cuadro desentona. ¿Qué haces?"
  model_answer: "Lo comparo con sus vecinos reales: Gurney aconseja comparar siempre ('¡compara, compara!') porque un solo punto de color es casi imposible de juzgar aislado. Antes de mezclar analizo el punto con los cuatro factores (color local, luz, cantidad de luz y atmósfera). Si dudo, aíslo con un agujero en un papel (Gurney y Chevreul lo recogen) para ver el color verdadero sin el contraste del entorno. La técnica del agujero en papel es una sugerencia de práctica, y el contraste simultáneo explica que un color cambie junto a otro."
  rubric:
    - "Propone comparar el color con otros de la escena y no juzgarlo aislado"
    - "Propone aislar el punto (agujero en un papel o papel recortado)"
    - "Explica el cambio por el contraste simultáneo o por un entorno distinto"
    - "Recuerda analizar los cuatro factores antes de mezclar o presenta la técnica como práctica y no ley"
- id: q-judging-color-002
  prompt: "Llevas horas retocando un cuadro y tus colores cada vez te parecen más apagados, aunque no sabes por qué. ¿Qué haces?"
  model_answer: "Reconozco la fatiga: Chevreul describe una mirada fatigada que tiende a ver complementarios y atribuye parte del colorido apagado de algunos pintores cuidadosos al exceso de mirada y retoques repetidos. Me alejo del cuadro y descanso, como recomienda Leonardo, para que el juicio sea más claro al volver; puedo mirarlo en un espejo para que parezca ajeno y muestre los fallos. Aclaro que la explicación de Leonardo para el espejo se apoya en la visión con un ojo y solo concierne en parte al color. Después comparo con los vecinos y juzgo con ojos descansados."
  rubric:
    - "Identifica la fatiga visual (mirada fatigada que ve complementarios) como causa probable"
    - "Propone descansar o alejarse antes de seguir"
    - "Menciona el espejo u otra distancia para ver el cuadro con ojos nuevos"
    - "Matiza que el fundamento del espejo en Leonardo solo concierne en parte al color"
- id: q-judging-color-003
  prompt: "Pintas del natural en un estudio con una ventana al sur, y la luz cambia durante la sesión, alterando tus juicios. ¿Cómo organizas el espacio?"
  model_answer: "Busco una luz constante: Leonardo recomienda una ventana al norte, que evita variaciones, y, con ventana al sur, visillos de papel para que el movimiento del sol no cambie las sombras. Me coloco algo de lado, entre la ventana y el modelo, para verlo en parte en luz y en parte en sombra. Y para ver el cuadro, sobre todo al óleo o barnizado, me alejo del lugar donde la luz de la ventana se refleja en la superficie. Son consejos de taller del siglo XV; su principio (estabilidad de luz) es válido, pero no son leyes."
  rubric:
    - "Busca luz constante: ventana al norte o visillos con ventana al sur"
    - "Se sitúa entre ventana y modelo para ver luz y sombra"
    - "Menciona evitar reflejos de la ventana sobre la superficie al mirar el cuadro"
    - "Reconoce que son consejos históricos de taller y no leyes"
- id: q-judging-color-004
  prompt: "Terminas un cuadro en tu estudio, donde luce muy bien, y va a colgarse en una sala con luz muy distinta y a mayor distancia de visión. ¿Cómo lo juzgas antes de entregarlo?"
  model_answer: "Chevreul indica que hay que juzgar un cuadro considerando la luz de su lugar previsto y la distancia de visión; así que lo miro, si puedo, con esa luz y desde esa distancia. Recuerdo que en un cuadro las modificaciones de color están fijadas desde el punto de vista del pintor, mientras en el modelo cambian con la posición del espectador. Leonardo añade que un paisaje pintado nunca igualará la viveza de uno iluminado por el sol salvo que el cuadro se cuelgue a ese mismo sol. Ajusto lo necesario aceptando que el resultado dependerá de la luz del destino."
  rubric:
    - "Juzga el cuadro con la luz y la distancia del lugar previsto"
    - "Indica que los efectos de color en el cuadro son fijos desde el punto de vista del pintor"
    - "Menciona que la viveza del cuadro no igualará a la natural (Leonardo)"
    - "Ajusta o acepta limitaciones sin presentar una receta única"
- id: q-judging-color-005
  prompt: "Un alumno propone igualar colores con el cuentagotas digital sobre una foto del motivo y mezclar el valor que da. ¿Qué le recomiendas?"
  model_answer: "Le recomiendo prudencia: Gurney menciona el cuentagotas, pero es una sugerencia de lectores, y avisa de que las cámaras captan el color de la sombra peor que el ojo y de que en escenas de alto contraste queman las luces o aplastan las sombras. Le propongo mezclar desde un objetivo claro (matiz, valor y croma), dejar secar antes de juzgar porque las pinturas cambian al secar (MacEvoy), y comparar siempre la mezcla con sus vecinos reales en lugar de un valor aislado."
  rubric:
    - "Advierte que las fotos captan mal el color de las sombras y alteran luces y sombras en alto contraste"
    - "Indica que el cuentagotas es una sugerencia de lectores, no una regla firme"
    - "Recomienda dejar secar antes de juzgar"
    - "Propone comparar con vecinos o mezclar desde un objetivo de matiz, valor y croma"
- id: q-judging-color-006
  prompt: "Un colega defiende el truco del espejo de Leonardo con el argumento de que 'así se ve el color real del cuadro'. ¿Cómo evalúas ese argumento?"
  model_answer: "Leonardo propone comparar el cuadro con el modelo reflejado mirando con un solo ojo, y dice que mirar el propio trabajo en un espejo lo hace parecer ajeno y muestra los fallos. Pero su fundamento es que dos ojos muestran más relieve que una pintura puede dar; la idea de aplanar la escena es útil, pero la explicación solo concierne en parte al color. Por tanto el argumento es incompleto: el espejo ayuda a ver con ojos nuevos, no muestra un color más 'real'. Lo combino con comparación y descanso."
  rubric:
    - "Describe la propuesta de Leonardo (espejo, un solo ojo, el trabajo parece ajeno)"
    - "Indica que su fundamento es la diferencia entre dos ojos y la pintura (relieve)"
    - "Concluye que la explicación solo concierne en parte al color y que no revela un color 'real'"
    - "Propone usarlo como una ayuda junto a comparar o descansar"
