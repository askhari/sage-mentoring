- id: q-atmospheric-perspective-006
  prompt: "Explica con tus palabras por qué la regla 'lo lejano es más oscuro' es un concepto erróneo o incompleto y qué ocurre en realidad con el valor al aumentar la distancia."
  model_answer: "Para Leonardo, muchos pintores lo hacen así y solo es cierto de los objetos blancos: con la distancia lo oscuro se aclara y lo más claro que el aire se oscurece, ambos 'descoloridos' hacia el valor del aire. Es coherente con el modelo de Narasimhan y Nayar: la luz del objeto se atenúa y la del aire crece hasta el brillo del horizonte, así que todo converge a él. Hay un matiz de Leonardo: a distancia media las caras y objetos con detalle se oscurecen porque se pierden las luces pequeñas; luego el aire los aclara. Gurney propone aclarar los oscuros en proporción fija por capa de aire, de forma provisional."
  rubric:
    - "Dice que lo oscuro se aclara y lo muy claro se oscurece hacia el valor del aire/horizonte"
    - "Relaciona la convergencia con atenuación más luz del aire"
    - "Menciona el matiz de la distancia media (se pierden luces pequeñas) o el caso de objetos blancos"
    - "No presenta el modelo geométrico de Gurney como un hecho establecido"
- id: q-atmospheric-perspective-007
  prompt: "Explica con tus palabras el orden en que, según Leonardo, se pierden las cualidades de un objeto con la distancia y qué consecuencia tiene para pintar lo lejano."
  model_answer: "Con la distancia se pierde primero el brillo, luego las luces, luego las sombras principales hasta dejar una penumbra media; lo pequeño desaparece antes y después las líneas que cierran las formas. Por eso lo lejano se pinta con detalle inacabado y contornos suaves, y los contornos fuertes en objetos lejanos los hacen parecer cercanos. Es una ordenación de práctica de Leonardo; el artículo de Narasimhan y Nayar no da fórmula para la pérdida de contraste."
  rubric:
    - "Enumera el orden: brillo, luces, sombras principales, detalle pequeño y líneas de contorno"
    - "Concluye que lo lejano lleva detalle inacabado y contornos suaves"
    - "Indica que los contornos duros acercan visualmente el objeto"
    - "Reconoce que es práctica de taller y no una fórmula física"
- id: q-atmospheric-perspective-008
  prompt: "Pintas un paisaje de una mañana de niebla densa. La receta que conoces es 'lo lejano, más azul y pálido'. ¿La aplicas? ¿Cómo planeas los planos?"
  model_answer: "No la aplico a ciegas. En niebla densa γ es casi 0: lo lejano cambia de brillo, no de matiz, y converge a gris o blanco, con el matiz del objeto casi sin cambiar. Decido primero el aire del cuadro: fijo color y valor del horizonte (gris claro) como destino y, para cada plano, acerco el color del objeto a él más cuanto más lejos, reduciendo croma y contraste local y manteniendo el detalle en primer término. Leonardo añade que en niebla las partes iluminadas son más nítidas y las no iluminadas casi del color de la niebla. Compruebo con muestras secas, porque la mezcla de pigmentos no es lineal."
  rubric:
    - "Reconoce que en niebla el matiz no cambia y la lejanía converge a gris/blanco, no a azul"
    - "Propone fijar color y valor del horizonte y acercar cada plano a él según la distancia"
    - "Reduce croma/contraste con la distancia y conserva detalle delante"
    - "Menciona comprobar con muestras secas o que la mezcla de pigmentos no es lineal"
- id: q-atmospheric-perspective-009
  prompt: "Pintas un valle al ponerse el sol, con nubes enrojecidas en el horizonte y colinas lejanas. Tu primer boceto las tiene en azul frío. ¿Qué cambias y qué decisión de fondo debes tomar?"
  model_answer: "Según Leonardo, cuando el sol enrojece las nubes del horizonte los objetos lejanos azulados toman el rojo y dan una mezcla agradable de azul y rojo; el propio aire adopta el color. Así que dejo que el aire del cuadro tiña las colinas con el rojo del horizonte y no pinto un azul frío independiente. La decisión de fondo es qué manda: la luz del cuadro o la regla de la lejanía. Aquí elijo la luz coherente, aun sin que exista una explicación física completa en las fuentes del azul del paisaje lejano. La regla de Leonardo es de taller, no una ley."
  rubric:
    - "Propone que las colinas lejanas recojan el rojo del horizonte (mezcla azul-rojo) en vez de un azul frío"
    - "Identifica el conflicto entre la regla de la lejanía y la luz del cuadro"
    - "Elige la coherencia con la luz del cuadro"
    - "No atribuye la causa del azul del paisaje lejano a una teoría concreta ni presenta la regla como ley"
- id: q-atmospheric-perspective-010
  prompt: "Un colega propone calcular los colores de cada plano con la fórmula del modelo físico (atenuación más luz del aire) para un cuadro de un día de sol intenso. ¿Qué le respondes?"
  model_answer: "Que sirva como modelo de tendencia, no como cálculo exacto. El modelo supone atmósfera homogénea, trayectorias horizontales, cielo cubierto y sin lluvia ni dispersión múltiple, y se validó con fotos de niebla y bruma bajo cielo cubierto; con sol fuerte la luz del aire depende de la dirección de la mirada. Además la fórmula describe luz y la mezcla de pigmentos no es lineal, por lo que hay que comprobar con muestras secas. Para el contraste no hay fórmula en el artículo: se compara y se sigue la práctica (Leonardo, Gurney). Gurney avisa incluso de que el modelo homogéneo es poco realista."
  rubric:
    - "Señala los supuestos del modelo (atmósfera homogénea, cielo cubierto, validación con niebla/bruma)"
    - "Indica que con sol fuerte la luz del aire depende de la dirección"
    - "Dice que mezclar pigmentos no es lineal, por lo que se comprueba con muestras"
    - "Concluye que se usa la tendencia y la comparación, no el cálculo exacto"
- id: q-atmospheric-perspective-011
  prompt: "Un alumno pinta una montaña lejana más oscura que el primer plano, con un contorno bien marcado y todos los detalles. Se ve cercana. ¿Cómo lo corriges?"
  model_answer: "Aplico la práctica descrita por Leonardo: lo lejano se pinta más pálido, con el color moviéndose hacia el del horizonte, con menos croma y contraste local, con detalle inacabado y contornos suaves, porque los contornos fuertes hacen parecer cercano a lo lejano. La base de la montaña va más pálida que la cima, pues el aire es más espeso y claro cerca del suelo. Aclaro un matiz: 'lo lejano es más oscuro' solo es cierto de objetos blancos, y a distancia media lo oscuro con detalle puede oscurecerse al perderse las luces pequeñas, pero luego el aire lo aclara."
  rubric:
    - "Aclara el valor y acerca el color al del horizonte"
    - "Suaviza contornos y reduce detalle y contraste en lo lejano"
    - "Menciona que la base de las montañas lejanas es más pálida que la cima, o el orden de pérdida"
    - "Explica que el contorno fuerte hace parecer cercano al objeto"
- id: q-colored-light-unity-001
  prompt: "Según Chevreul, ¿qué ocurre con un azul claro y con un índigo oscuro bajo luz naranja?"
