    croma (un complementario o un neutro del mismo valor). Probaría con pequeñas cantidades y compararía
    con el objetivo.'
  rubric:
  - Dice que el blanco solo da pasteles y no los colores oscuros y apagados
  - Propone el negro, un gris o un complementario para llegar a ocres y marrones
  - Distingue qué dimensión cambia cada opción (valor, valor y croma, croma)
  - Decide el pigmento según la dimensión que se quiere corregir
- id: q-primary-colors-001
  prompt: ¿Por qué ningún trío de pinturas puede mezclar todos los colores?
  options:
    a: Porque solo existen tres colores primarios en la naturaleza
    b: Porque los primarios "ideales" son imaginarios y los pigmentos reales son siempre imperfectos
    c: Porque la pintura no se puede mezclar
    d: Porque el ojo solo distingue tres colores
  explanation: Los pigmentos reales son imperfectos, así que ningún conjunto de tres primarios materiales
    cubre todo el gamut (Sochorova lo confirma con sus pigmentos). La opción a reproduce el mito de que
    los primarios son un hecho de la naturaleza.
- id: q-primary-colors-002
  prompt: Un alumno afirma que rojo, amarillo y azul son los primarios "de la naturaleza". ¿Cuál de estas
    respuestas se ajusta mejor a las fuentes?
  options:
    a: 'Es cierto: todos los demás colores salen de ellos'
    b: Es cierto solo para las luces
    c: Es una elección histórica limitada por los pigmentos de cada época; Munsell ya criticaba el modelo
      RYB
    d: Es falso porque los primarios son el verde, el naranja y el violeta
  explanation: 'El trío RYB es una elección histórica ligada a los pigmentos disponibles; Munsell decía
    que el amarillo no es primario porque se produce con luz roja y verde. La opción b invierte la realidad:
    para luces el conjunto tampoco es único.'
- id: q-primary-colors-003
  prompt: Explica con tus palabras la diferencia entre un primario en la visión (luces) y un primario
    en la pintura.
  model_answer: En la visión, los primarios corresponden a los tres tipos de cono y el conjunto no es
    único (rojo, verde y azul sirven, pero también amarillo, verde y azul); se definen por la fisiología
    y la luz. En la pintura, un primario es un pigmento concreto, y como los pigmentos son imperfectos,
    ningún trío mezcla todos los colores. Según Macevoy, los primarios de la pintura son una elección.
  rubric:
  - Dice que en la visión los primarios se relacionan con los tres tipos de cono
  - Dice que el conjunto de primarios de luz no es único
  - Dice que en pintura un primario es un pigmento concreto
  - Indica que el trío de pintura tiene límites (no mezcla todo) o es una elección
- id: q-primary-colors-004
  prompt: Según Macevoy, ¿cómo se ve el gamut de una paleta?
  options:
    a: Contando cuántos tubos tiene
    b: Sumando la claridad de cada pintura
    c: Mirando solo el matiz de la pintura más saturada
    d: 'Dibujando los pigmentos en un diagrama y uniéndolos: cuanta más área encierren, más mezclas'
  explanation: El gamut se ve uniendo los pigmentos en un diagrama; cuanta más área, más mezclas posibles.
    La opción a es tentadora pero tener más tubos no garantiza más área.
- id: q-primary-colors-005
  prompt: Eres acuarelista y dudas entre una paleta de seis pinturas (tríada más tres secundarias) y una
    de primarios divididos. Quieres el mayor croma por pintura. ¿Qué escoges y qué límites conoces?
  model_answer: Según Macevoy, seis pinturas (la tríada más tres secundarias) dan el mayor croma por pintura,
    y casi todo el potencial de mezcla de las acuarelas se alcanza con seis; la paleta de primarios divididos
    da un gamut menor y mezclas más incómodas. Como límite, una tríada puede no mezclar un oscuro neutro
    igual al negro. Es un criterio de fiabilidad C y basado en acuarela, así que probaría con muestras
    propias.
  rubric:
  - Escoge la paleta de seis, atribuyendo el criterio a Macevoy
  - Justifica con el mayor croma por pintura o el gamut mayor
  - Dice que los primarios divididos dan un gamut menor y mezclas incómodas
  - Menciona un límite (una tríada puede no dar un oscuro neutro igual al negro) o que son datos de acuarela
- id: q-primary-colors-006
  prompt: Enseñas pintura a un grupo que aprendió que "rojo, amarillo y azul lo mezclan todo". Un alumno
    no consigue un violeta vivo ni un verde vivo con sus tres tubos. ¿Cómo lo explicas y qué le propones?
  model_answer: 'Le explicaría que RYB es una elección histórica y que ningún trío de pigmentos mezcla
    todo: los pigmentos son impuros, y Munsell ya decía que la práctica de los pintores no valida el RYB.
    Mezclar colores separados en la rueda cuesta croma. Le propondría escoger primarios más próximos a
    los ideales sustractivos (un rojo violáceo, un amarillo y un azul verdoso) o añadir una pintura que
    amplíe el gamut, y comprobarlo con muestras secas.'
  rubric:
  - Explica que RYB es una elección histórica y no una ley de la naturaleza
  - Dice que los pigmentos son impuros, así que ningún trío mezcla todo
  - Propone primarios más cercanos a los ideales (magenta, amarillo, cian) o añadir otra pintura
  - Relaciona el problema con la pérdida de croma al mezclar colores lejanos o recomienda muestras
- id: q-primary-colors-007
  prompt: Un pintor usa un ultramar (azul cálido) como único azul y observa que casi todas sus mezclas
    azuladas salen "cálidas". ¿Qué decisión le recomiendas respecto a su paleta y cómo la justificas?
  model_answer: 'Según Sochorova y colaboradores, los primarios elegidos marcan el comportamiento de todas
    las mezclas: con un azul cálido como el ultramar, la mayoría de los colores azulados heredan su carácter
    cálido. Le recomendaría decidir cuál de las versiones cálida y fría de cada primario sesga menos sus
    mezclas, escoger primarios según los colores más difíciles de alcanzar de su tema y comprobar las
    mezclas secundarias con muestras secas.'
  rubric:
  - Dice que el primario elegido marca el carácter de todas las mezclas
  - Relaciona el ultramar cálido con mezclas azuladas cálidas
  - Propone considerar versiones cálida y fría de cada primario
  - Recomienda elegir según los colores difíciles de su tema y comprobar con muestras
- id: q-pigment-mixing-behavior-001
  prompt: En el modelo de mezcla de pigmentos basado en Kubelka-Munk que usan Sochorova y colaboradores,
    ¿sobre qué magnitudes se hace el promedio ponderado por concentración?
  options:
    a: Sobre los valores RGB de cada pigmento
    b: Sobre la reflectancia de cada pigmento
    c: Sobre los coeficientes de absorción K y de dispersión S de cada pigmento
    d: Sobre los matices de cada pigmento
  explanation: El promedio lineal se hace en K y S (regla atribuida allí a Duncan, 1940), no en la reflectancia
    ni en RGB. Promediar RGB (opción a) sería el error de tratar la pintura como luz.
- id: q-pigment-mixing-behavior-002
  prompt: Según Kubelka y Munk, para una capa gruesa de pintura acromática, ¿de qué depende su aspecto?
  options:
    a: Solo de la razón entre absorción y dispersión, no de sus valores absolutos
    b: Solo del espesor de la capa
    c: Solo de la dispersión
    d: Del valor absoluto de la absorción únicamente
  explanation: 'Para una capa gruesa el aspecto depende de la razón s/r entre absorción y dispersión.
    La opción b es errónea: el espesor deja de importar cuando la capa es lo bastante gruesa.'
- id: q-pigment-mixing-behavior-003
  prompt: Explica con tus palabras por qué mezclar pinturas no es promediar sus colores.
  model_answer: En una pintura, las partículas absorben y dispersan la luz varias veces, y el resultado
    de mezclar es muy poco lineal. El modelo de Kubelka-Munk promedia los coeficientes de absorción y
    dispersión, no la reflectancia ni el RGB, así que el color resultante no es el promedio de los colores.
    Por eso las líneas de mezcla de pintura se curvan y pasan por matices secundarios, mientras que en
    RGB la trayectoria es una recta.
  rubric:
  - Dice que la mezcla de pigmentos es poco lineal (absorción y dispersión)
  - Indica que el promedio se hace en K y S y no en el color
  - Menciona que las trayectorias de mezcla de pintura se curvan, a diferencia de RGB
  - Concluye que el color de la mezcla no es el promedio de los colores
- id: q-pigment-mixing-behavior-004
  prompt: Quieres implementar en una aplicación de pintura un modelo de mezcla basado en Kubelka-Munk
    para que el azul y el amarillo den verde como en la realidad. Tu jefe cree que servirá igual para
    acuarela con veladuras. ¿Qué le adviertes?
  model_answer: 'Le advertiría de los límites que reconocen Sochorova y colaboradores: el modelo supone
    una capa gruesa que oculta el fondo y una mezcla homogénea de pintura opaca, y las capas translúcidas
    como las veladuras de acuarela quedan como trabajo futuro. Además, los coeficientes proceden de acrílicos
    brillantes y el brillo enriquece los colores, así que el método puede sobrestimar la saturación en
    un medio más mate. Y necesita muchos más canales que tres y costosas integrales espectrales por píxel.'
  rubric:
  - Dice que el modelo supone capa gruesa y opaca y que las veladuras translúcidas no están cubiertas
  - Indica que los coeficientes son de acrílicos brillantes y que puede sobrestimar la saturación en medios
    más mates
  - Menciona el coste computacional (muchos canales, integrales espectrales)
  - Concluye que no sirve tal cual para acuarela con veladuras
- id: q-pigment-mixing-behavior-005
  prompt: Tienes dos tubos de amarillo que en el tubo se ven casi idénticos, pero al mezclarlos con el
    mismo azul dan verdes distintos. Tu compañera cree que uno de los tubos está defectuoso. ¿Qué piensas
    y qué decides?
  model_answer: 'No creería que esté defectuoso: según Macevoy, pinturas con el mismo color visual pueden
    tener curvas de reflectancia distintas y mezclar de otra forma, y dos amarillos de reflectancia casi
    idéntica pueden mezclar distinto por su índice de refracción. Por eso el aspecto del tubo no predice
    la mezcla. Decidiría hacer muestras de mezcla con mis propios tubos y juzgarlas secas, porque la reflectancia
    cambia al secar y con el espesor.'
  rubric:
  - Rechaza que sea un defecto y explica que el mismo color visual no implica la misma mezcla
  - Menciona curvas de reflectancia distintas o el índice de refracción
  - Indica que la reflectancia cambia al secar o con el espesor
  - Decide hacer muestras con los propios tubos y secarlas antes de juzgar
- id: q-pigment-mixing-behavior-006
  prompt: 'Para armar tu paleta de acuarelas comparas dos opciones: un trío de primarios sustractivos
    y otro de tipo aditivo (naranja, verde, violeta). ¿Qué te sugiere la observación de Macevoy sobre
    el coste de mezclar, y con qué cautela la aplicas?'
  model_answer: Según Macevoy, mezclar pinturas muy separadas en la rueda cuesta saturación. Las líneas
    de mezcla de primarios sustractivos se curvan hacia fuera (menos pérdida de croma de la esperada),
    mientras que las de tipo aditivo se curvan hacia dentro, con mayores pérdidas de croma y de claridad.
    Me inclinaría por el trío sustractivo para mezclas vivas. Lo aplicaría con cautela porque es una observación
    de taller sobre acuarelas, no una regla universal, y lo comprobaría con muestras propias.
  rubric:
  - Dice que mezclar colores muy separados en la rueda cuesta saturación
  - Contrasta primarios sustractivos (curva hacia fuera) y de tipo aditivo (hacia dentro, más pérdidas)
  - Elige el trío sustractivo para mezclas vivas
  - Aclara que es una observación sobre acuarelas y no una regla universal
- id: q-optical-mixing-001
  prompt: Pequeños puntos de tinta roja y de tinta verde, vistos desde lejos, se funden visualmente. ¿Cómo
    se ven según Macevoy y de qué tipo de mezcla se trata?
  options:
    a: Amarillos y brillantes, por mezcla aditiva
    b: 'Apagados y oscuros, porque el ojo promedia la reflectancia: no es aditiva ni sustractiva'
    c: Verdes, por mezcla sustractiva
    d: Blancos, porque se suman las luces
  explanation: En la mezcla partitiva el ojo promedia la reflectancia, no suma luz, y los puntos rojo
    y verde se ven apagados. La opción a es la confusión de Fénéon que recoge Gómez Sánchez, según su
    interpretación.
- id: q-optical-mixing-002
  prompt: Según Koenderink y colaboradores, ¿qué caracteriza la mezcla óptica?
  options:
    a: Es una mezcla física de pigmentos en el lienzo
    b: Exige que los puntos desaparezcan por completo
    c: Es una mezcla de la mente y no de la luz, y los puntos deben seguir siendo visibles
    d: Siempre da colores más luminosos que la mezcla en la paleta
  explanation: Los autores la describen como una mezcla de la mente, con efecto de asimilación, y los
    puntos deben seguir visibles. La opción d es la creencia común que discute Gómez Sánchez.
- id: q-optical-mixing-003
  prompt: Según Gómez Sánchez, ¿qué se suele creer sobre la luminosidad de la mezcla óptica y qué sostiene
    él sobre los impresionistas? Distingue lo que afirma de lo que es su interpretación.
  model_answer: La creencia común es que las mezclas en la retina se comportan como rayos de luz y por
    eso son más intensas y luminosas que la mezcla física de pigmentos. Gómez Sánchez la discute y, como
    tesis suya (no como resultado experimental), sostiene que los impresionistas no usaron conscientemente
    la mezcla óptica y que el vínculo se crea tras 1886, mientras que los divisionistas sí la buscaron.
    Añade que la fusión anula el contraste.
  rubric:
  - Expone la creencia común de mayor luminosidad
  - Dice que el autor la discute
  - Presenta su tesis sobre los impresionistas como interpretación del autor
  - Menciona que los divisionistas sí la buscaron o que la fusión anula el contraste
- id: q-optical-mixing-004
  prompt: Un pintor quiere dividir el color en pequeños toques en un paisaje grande, convencido de que
    ganará luminosidad automáticamente. ¿Qué le aconsejas?
  model_answer: 'No contaría con un extra de luminosidad automático: la evidencia es contradictoria y
    depende de la distancia, del tamaño del toque y de si el espectador sigue viendo los puntos. Gómez
    Sánchez recoge que, a partir de cierta distancia, los toques se funden y el cuadro se ve más apagado,
    y Koenderink y colaboradores notan que los primeros Seurat parecían apagados de lejos, lo que llevó
    a separar más los puntos. Su experimento se hizo a una sola distancia, así que las fuentes no dan
    una distancia correcta.'
  rubric:
  - Rechaza la promesa de luminosidad automática
  - Dice que el efecto depende de la distancia y del tamaño del toque
  - Cita que de lejos los toques se funden y el cuadro se ve más apagado (Seurat o Gómez Sánchez)
  - Reconoce que las fuentes no fijan una distancia correcta
- id: q-optical-mixing-005
  prompt: Un pintor duda entre mezclar un rojo y un verde en la paleta o colocarlos como toques separados
    para evitar el gris. ¿Qué ventajas e inconvenientes plantearías?
  model_answer: Según Signac, las prisas del impresionismo fundían físicamente colores opuestos en un
    gris pigmentario apagado, y los neoimpresionistas evitan ensuciar la pureza del color manteniendo
    los toques separados en la paleta y el lienzo. Dividir ahorra esa pérdida de croma, pero a cambio
    hay una dependencia de la distancia. Además, Signac era consciente de que un toque muy atomizado era
    más un inconveniente que una virtud, y Francastel observa que Monet mezclaba mucho en la paleta. Todo
    esto es, en parte, interpretación del autor.
  rubric:
  - Explica que mezclar complementarios en la superficie da un gris y pierde croma (Signac)
  - Dice que dividir evita esa pérdida pero depende de la distancia
  - Menciona un inconveniente del toque muy atomizado o que los maestros también mezclaban en la paleta
  - Indica que lo dicho de pintores concretos es interpretación del autor
- id: q-target-color-mixing-001
  prompt: Debes reproducir con tus acuarelas un verde oliva apagado que ves en un objeto. Describe, paso
    a paso, cómo lo harías y qué precauciones tomas.
  model_answer: Primero describiría el objetivo en matiz, valor y croma; según Macevoy, localizaría el
    matiz y el croma en la rueda y trataría la claridad aparte, y no me fiaría solo del ojo, porque Munsell
    mostró que juzgar un gris a ojo es poco fiable. Después elegiría dos pinturas cuya línea de mezcla
    pase cerca del objetivo (pares que desplazan el croma para colores apagados) y un color de ajuste.
    Mezclaría por pasos, empezando más saturado porque las pinturas se apagan al secar, y probaría sobre
    papel. Juzgaría con una muestra seca, no con la mancha húmeda.
  rubric:
  - Describe el objetivo en matiz, valor y croma
  - Advierte de que juzgar a ojo es poco fiable o recomienda una referencia medida
  - Elige pinturas según la línea de mezcla y un color de ajuste
  - Menciona empezar más saturado, mezclar por pasos y juzgar una muestra seca
- id: q-target-color-mixing-002
  prompt: El objetivo es un amarillo muy saturado y solo dispones de un ocre amarillo y de un amarillo
    de cadmio medio. Un compañero dice que con ocre y un poco de blanco basta. ¿Qué decides y por qué?
  model_answer: 'Comprobaría primero si la paleta puede llegar: en las tablas, el amarillo de cadmio medio
    de Williamsburg mide 8,45 / 16,78 y el ocre amarillo 5,55 / 8,69, de modo que un amarillo de croma
    alto no sale del ocre. Si el objetivo cae fuera del gamut, lo máximo es el color mezclable más cercano,
    y otra pintura puede alargar el gamut. Usaría el cadmio como base, mezclaría por pasos y compararía
    con una muestra seca, ya que las pinturas se apagan al secar.'
  rubric:
  - Compara el croma del cadmio medio y del ocre con datos de las tablas
  - Concluye que un amarillo de croma alto no sale de un ocre
  - Explica que fuera del gamut solo se logra el color mezclable más cercano o que otra pintura puede
    ampliarlo
  - Menciona mezclar por pasos y juzgar una muestra seca
