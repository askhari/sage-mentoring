- id: q-complementary-colors-003
  prompt: Una alumna mezcla a partes iguales los dos pigmentos de un par complementario y no obtiene un
    gris, sino un color que tira a uno de ellos. ¿Cuál es la explicación más razonable según Munsell?
  options:
    a: El par no era realmente complementario
    b: La mezcla de pigmentos nunca puede dar gris
    c: El ojo se equivoca siempre con los grises
    d: Los dos pigmentos tienen distinto croma, y la proporción que neutraliza no suele ser mitad y mitad
  explanation: Munsell señala que el óxido de cromo tiene aproximadamente la mitad de croma que su complementario,
    el sulfuro de mercurio, así que no basta la misma cantidad de cada uno. La opción a es tentadora,
    pero el desequilibrio se explica por el croma, no por que el par sea falso.
- id: q-complementary-colors-004
  prompt: Explica con tus palabras por qué un color no tiene un único complementario "correcto".
  model_answer: Según Macevoy, hay complementarios visuales, de mezcla y de posimagen, que a menudo no
    coinciden. Además, un matiz puede tener varios complementarios de mezcla, así que no caben todos en
    un único punto de la rueda. A eso se suma que los pares cambian según la rueda utilizada (por ejemplo,
    RYB frente a Munsell, que eligió los suyos porque se neutralizaban en discos giratorios).
  rubric:
  - Distingue al menos dos tipos de complementarios (visual, de mezcla, de posimagen)
  - Dice que esos tipos a menudo no coinciden
  - Indica que un matiz puede tener varios complementarios de mezcla o que los pares dependen de la rueda
  - Concluye que no hay un único complementario fijo
- id: q-complementary-colors-005
  prompt: Estás pintando a la acuarela un rojo muy saturado que resulta demasiado chillón. Quieres apagarlo
    hacia un gris coloreado, más vivo que uno de tubo. ¿Qué haces y qué precauciones tomas?
  model_answer: 'Usaría un complementario de mezcla para apagarlo de forma controlada y obtener un gris
    coloreado. La rueda indica la dirección, pero no la cantidad ni el pigmento concreto: según Macevoy,
    los pares que neutralizan dependen de cada pigmento y los neutralizantes habituales, como la siena
    tostada o el rojo veneciano, funcionan bien. Añadiría poco a poco, probaría con muestras y las juzgaría
    secas. Sus resultados son de acuarela y pueden diferir en otros medios.'
  rubric:
  - Propone apagar con un complementario de mezcla para obtener un gris coloreado
  - Aclara que la rueda da la dirección, no la cantidad ni el pigmento exacto
  - Menciona que el complementario eficaz depende del pigmento concreto (por ejemplo un neutralizante
    como la siena tostada)
  - Indica que hay que comprobar con muestras secas o que los datos son de acuarela
- id: q-complementary-colors-006
  prompt: Una alumna prepara un par de pigmentos complementarios y quiere comprobar si están equilibrados,
    pero al mezclarlos obtiene un gris con un matiz residual. ¿Cómo procederías, según el método de Munsell,
    para decidir qué corregir?
  model_answer: Munsell igualaba antes el valor y el croma de los dos pigmentos y los pintaba en discos
    giratorios (discos de Maxwell). Si la mezcla se veía gris, el par estaba equilibrado; si quedaba un
    matiz residual, ese matiz indicaba cuál de los dos sobraba. Corregiría reduciendo el pigmento sobrante
    y recordaría que la proporción no suele ser mitad y mitad, porque los pigmentos tienen distinto croma.
  rubric:
  - Propone igualar valor y croma de los pigmentos antes de comparar
  - Describe la mezcla en discos giratorios o la comprobación de que el resultado sea gris
  - Dice que el matiz residual indica cuál sobra
  - Señala que la proporción no tiene por qué ser mitad y mitad
- id: q-tints-shades-tones-001
  prompt: ¿Qué efecto práctico tiene añadir negro a un color de pintura, según Macevoy?
  options:
    a: Solo baja el valor y deja el croma intacto
    b: Sube el valor y el croma a la vez
    c: Baja a la vez la claridad y el croma, y es un camino hacia los colores oscuros y apagados
    d: No cambia nada si se añade poco
  explanation: El negro baja la claridad y el croma al mismo tiempo. La opción a es tentadora, pero se
    corrige con la observación de que el negro apaga la mezcla además de oscurecerla.
- id: q-tints-shades-tones-002
  prompt: Quieres conseguir un marrón o un ocre a partir de un amarillo. Según Macevoy, ¿qué ocurre si
    solo le añades blanco?
  options:
    a: Obtienes pasteles, pero nunca los colores oscuros y apagados como el marrón o el ocre
