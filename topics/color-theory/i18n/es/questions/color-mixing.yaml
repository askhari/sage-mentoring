- id: q-tints-shades-tones-003
  prompt: En pintura real, ¿qué ocurre al mezclar azul ftalo con cantidades crecientes de blanco, en comparación
    con un degradado RGB?
  options:
    a: En ambos casos el color pierde saturación de forma directa
    b: En la pintura el croma puede subir un poco al principio y el matiz se desplaza hacia el turquesa,
      mientras que el degradado RGB se ve gris y apagado
    c: En la pintura el matiz no cambia nunca
    d: En el RGB el matiz se desplaza y en la pintura no
  explanation: Sochorova y colaboradores muestran que el modelo de pigmentos reproduce la ganancia de
    croma y el desplazamiento del matiz, mientras que los degradados RGB se ven grises y apagados. La
