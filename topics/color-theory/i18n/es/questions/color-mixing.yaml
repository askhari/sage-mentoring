- id: q-additive-mixing-001
  prompt: Se proyectan sobre una pantalla blanca una luz roja y una luz verde, solapadas. ¿Qué color se
    ve en la zona de solape?
  options:
    a: Marrón oscuro, porque se mezclan como pinturas
    b: Amarillo
    c: Gris, porque los dos colores se neutralizan
    d: Naranja rojizo, porque domina la luz roja
  explanation: 'Con luces los colores se suman: rojo más verde se ve amarillo, y las tres luces primarias
    juntas se ven blancas. El marrón o el gris (opciones a y c) serían la intuición de la pintura, que
    sigue otras reglas.'
- id: q-additive-mixing-002
  prompt: ¿Cómo se llama la mezcla que resulta de superponer luces de colores, como la de los puntos rojos,
    verdes y azules de un televisor?
  accepted:
  - mezcla aditiva
  - aditiva
  - síntesis aditiva
  - additive mixing
  - additive
