- id: q-subtractive-mixing-004
  prompt: ¿Por qué un modelo sustractivo puro (que solo considera absorción) no predice bien una mezcla
    real de azul cobalto y amarillo Hansa?
  options:
    a: Porque en una pintura las partículas también dispersan la luz, y el modelo puro ignora esa dispersión
    b: Porque la pintura no absorbe luz, solo la refleja
    c: Porque el modelo puro suma luces en lugar de restarlas
    d: Porque el azul y el amarillo no son pigmentos reales
  explanation: Los autores muestran que el modelo sustractivo puro da un resultado más oscuro, menos saturado
    y de otro matiz que la pintura real, porque no incluye la dispersión. La opción c describe el modelo
    aditivo, no el sustractivo.
- id: q-subtractive-mixing-005
  prompt: Explica con tus palabras la diferencia entre absorber y dispersar la luz en una capa de pintura,
    y por qué importa para mezclar.
  model_answer: Absorber elimina luz de forma permanente; dispersar solo la redirige, por ejemplo devolviéndola
    hacia arriba, sin quitarla. Kubelka y Munk basan su modelo de una capa de pintura en esa distinción,
    que la visión anterior no hacía. Una teoría de filtros apilados solo tiene absorción, pero una pintura
    tiene las dos, y por eso las mezclas de pintura no se comportan como filtros.
  rubric:
  - Dice que la absorción quita luz de forma permanente
  - Dice que la dispersión solo redirige la luz
  - Indica que una pintura real tiene absorción y dispersión, mientras que un modelo de filtros solo tiene
    absorción
  - Relaciona la distinción con el modelo de Kubelka y Munk o con que la regla simple falle
- id: q-subtractive-mixing-006
  prompt: Según Macevoy, dos pinturas que se ven con el mismo color en el tubo, ¿pueden dar la misma mezcla
    con un tercer color?
  options:
    a: 'Sí, siempre: el mismo aspecto implica la misma mezcla'
    b: Sí, si se usa la misma cantidad de cada una
    c: 'No necesariamente: pueden tener curvas de reflectancia distintas y mezclar de otra forma'
    d: No, porque dos pinturas nunca pueden verse igual
  explanation: 'Pinturas con el mismo color visual pueden tener curvas de reflectancia distintas y mezclar
    diferente. La opción a es el error que se corrige: el color visual del tubo no basta para predecir
    la mezcla.'
- id: q-subtractive-mixing-007
  prompt: Das un taller de acuarela. Una alumna quiere calcular, con la fórmula sustractiva que le explicaron,
    qué mezcla exacta de un azul y un amarillo dará su verde objetivo. ¿Qué le aconsejas?
  model_answer: 'Le diría que la pintura solo es aproximadamente sustractiva: el modelo sirve de brújula
    para anticipar la dirección (mezclar siempre cuesta luz y croma, y más cuanto más separados están
    los colores en la rueda), pero no para calcular el resultado exacto. Según Macevoy, la rueda es una
    guía direccional y no una calculadora. Haría muestras con sus propias pinturas y las juzgaría secas,
    porque las mezclas cambian al secar.'
  rubric:
  - Dice que la pintura solo es aproximadamente sustractiva
  - Explica que el modelo sirve para la dirección (mezclar cuesta luz y croma) pero no para calcular el
    resultado
  - Recomienda usar la rueda como guía y no como calculadora
  - Recomienda comprobar con una muestra seca
- id: q-subtractive-mixing-008
  prompt: 'Un compañero afirma: "La pintura es cian, magenta y amarillo y punto; con la fórmula sustractiva
    y el color visual de cada tubo puedo predecir cualquier mezcla". ¿Qué le respondes?'
  model_answer: Es una simplificación. En impresión las tintas cian, amarillo y magenta se superponen
    sustractivamente dentro de cada punto, pero eso no hace predecible cada mezcla de tubos. El modelo
    sustractivo puro ignora la dispersión y da resultados más oscuros y de otro matiz que la pintura real;
    además pinturas con el mismo color visual pueden mezclar distinto. Para predecir bien hay que usar
    un modelo con absorción y dispersión, o muestras reales de los propios tubos.
  rubric:
  - Rechaza que la fórmula sustractiva pura predique cualquier mezcla
  - Menciona que la pintura también dispersa luz y el modelo puro no lo incluye
  - Indica que el color visual del tubo no basta (misma apariencia, distinta mezcla)
  - Propone un modelo con absorción y dispersión o muestras reales
- id: q-subtractive-mixing-009
  prompt: Un estudio de restauración debe igualar con precisión una mezcla de pinturas para retocar una
    obra. ¿Cómo plantearías la decisión entre calcular la mezcla y hacerla por muestras, y qué pasos darías?
  model_answer: Cuando importa la precisión, se miden los coeficientes de absorción y dispersión de cada
    pigmento y se calcula la mezcla (suma ponderada por concentración de esos coeficientes, con la ecuación
    de Kubelka-Munk), lo que exige datos medidos de los propios materiales. Esos modelos tienen límites,
    como suponer una capa gruesa que oculta el fondo. Por eso en la práctica se comprueba siempre con
    una muestra seca, porque las mezclas cambian al secar. Combinaría el cálculo, si hay datos de los
    pigmentos, con la verificación física.
  rubric:
  - Dice que la precisión exige medir absorción y dispersión de cada pigmento
  - Describe que el cálculo usa esos coeficientes ponderados por concentración
  - Menciona al menos un límite del modelo (capa gruesa que oculta el fondo, o datos de un medio concreto)
  - Indica que siempre se verifica con una muestra seca
- id: q-complementary-colors-001
  prompt: ¿Qué ocurre, según Munsell, al mezclar en la proporción adecuada dos pinturas de matices opuestos
    en la rueda?
  options:
    a: Dan un color más vivo que cada uno por separado
    b: Se neutralizan y dan un gris
    c: Dan siempre un blanco
    d: Dan un color intermedio de croma máximo
  explanation: Los matices opuestos mezclan en un gris neutro. Con luces el resultado sería blanco, no
    con pigmentos (opción c).
- id: q-complementary-colors-002
  prompt: ¿Qué color se obtiene al mezclar con pintura, en la proporción adecuada, dos colores complementarios?
  accepted:
