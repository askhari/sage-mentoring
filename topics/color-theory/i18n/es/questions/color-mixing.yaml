- id: q-tints-shades-tones-004
  prompt: Explica con tus palabras por qué el blanco y el negro de tubo no son ideales, con algún dato.
  model_answer: Un blanco ideal sería valor 10 y croma 0, y un negro ideal valor 0, pero en las tablas
    de acrílicos el blanco de titanio mide valor 10 y croma 1,1 y el negro de carbón valor 1 y croma 0,3,
    así que el negro de tubo no llega a valor 0. Según Macevoy, los negros de carbón son en realidad grises
    oscuros con una reflectancia de unos 20.
  rubric:
  - Dice que el negro de tubo no llega a valor 0 (por ejemplo valor 1)
  - Dice que el blanco de tubo no es perfectamente acromático (croma distinto de 0)
  - Aporta algún dato de las tablas (blanco de titanio 10 / 1,1 o negro de carbón 1 / 0,3)
  - Concluye que ambos son aproximaciones y no extremos ideales
- id: q-tints-shades-tones-005
  prompt: Quieres entender cómo se comportan tus acrílicos al mezclarlos con blanco para poder predecir
    mezclas. Un colega propone hacer una escalera completa de muchas mezclas de cada pigmento; otro dice
    que bastan dos muestras. ¿Qué decides y por qué?
  model_answer: 'La escalera de tinte (el pigmento con blanco en concentraciones crecientes) es la práctica
    habitual para construir una base de datos de colorantes, ajustando por mínimos cuadrados un coeficiente
    de absorción y otro de dispersión por colorante. Según el resumen de Zhao y Berns, para acrílicos
    y óleos de artista bastan dos muestras: la pintura pura y una mezcla con blanco, con mejor resultado
    hacia un 40-60 % de pigmento. Para un uso de taller, hacer la escalera de cada pigmento con mi propio
    blanco muestra su naturaleza (cómo cambia el matiz y el croma).'
  rubric:
  - Explica que la escalera de tinte sirve para caracterizar absorción y dispersión de cada colorante
  - Indica que, según el resumen de Zhao y Berns, bastan dos muestras (pura y mezcla con blanco) en acrílico
    y óleo
  - Menciona la proporción de pigmento de la mezcla (hacia un 40-60 %)
  - Justifica la elección o el valor de la escalera con el blanco propio
- id: q-tints-shades-tones-006
  prompt: Pintas un paisaje y necesitas un verde dorado y un ocre oscuro. Tu primer intento es añadir
    blanco a un amarillo y un verde, pero salen pasteles. ¿Qué cambias y cómo decides qué añadir?
  model_answer: 'Cambiaría de estrategia: el blanco sube el valor y da pasteles, pero para llegar a marrones,
