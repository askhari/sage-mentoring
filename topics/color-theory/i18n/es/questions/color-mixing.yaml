- id: q-additive-mixing-003
  prompt: Un amarillo de pantalla puede venir de luz amarilla, de rojo más verde o de luz blanca sin su
    parte violeta, y los tres se ven igual. ¿Por qué?
  options:
    a: Porque las tres luces tienen la misma longitud de onda
    b: Porque la pantalla convierte siempre la luz en amarillo puro
    c: Porque el color depende del patrón de estimulación de los tres tipos de cono, y luces distintas
      pueden producir el mismo patrón
    d: Porque el ojo mide la luminosidad y no el matiz
  explanation: 'El color resultante depende de cómo se estimulan los conos L, M y S; luces distintas que
    los estimulan igual dan el mismo color. La opción a es falsa: las tres luces tienen espectros distintos,
    justo lo que hace posible el efecto.'
- id: q-additive-mixing-004
  prompt: Un programa de dibujo basado en RGB mezcla azul y amarillo en un gris, pero la pintura real
    da verde. Explica con tus palabras a qué se debe la diferencia.
  model_answer: 'El programa calcula de forma aditiva: los espectros de las luces se suman linealmente,
    y con luces azul más amarillo dan un tono neutro o blanco. En una pintura real las partículas de pigmento
    absorben y dispersan la luz y el resultado no es lineal, de modo que la mezcla da verde. El modelo
    aditivo describe la pantalla, no el tubo de pintura.'
  rubric:
  - Dice que el programa RGB suma luces (mezcla aditiva) de forma lineal
  - Indica que la pintura no sigue esa regla porque sus pigmentos absorben (y dispersan) luz
  - Concluye que RGB describe pantallas y no predice la mezcla de pintura real
  - Menciona que en la pintura el resultado es verde
- id: q-additive-mixing-005
  prompt: Una pintora quiere igualar con acrílicos un turquesa muy saturado que ve en la pantalla de su
    portátil, mezclando ftalo azul y blanco. Después de varias muestras secas, ninguna se parece a lo
    que ve. ¿Cómo interpretas el problema y qué le recomiendas?
  model_answer: 'La pantalla trabaja de forma aditiva y tiene un gamut propio: un monitor sRGB habitual
    no puede mostrar el turquesa más saturado que da el azul ftalo con blanco, y a la inversa hay colores
    de pantalla que ningún pigmento conocido logra. Por tanto la pantalla recorta ese color y no es un
    patrón fiable. Le recomendaría no usar la pantalla como referencia final, partir de una muestra física
    o del propio pigmento, y juzgar siempre con una muestra seca.'
  rubric:
  - Explica que la pantalla es aditiva (luz) y la pintura no, así que no coinciden
  - Indica que un monitor sRGB no puede mostrar el turquesa más saturado de ftalo con blanco (la pantalla
    recorta el color)
  - Señala que también hay colores de pantalla que ningún pigmento conocido logra mezclar
  - Recomienda no depender de la pantalla y comparar con una referencia física o muestra seca
- id: q-additive-mixing-006
  prompt: 'Un ilustrador planifica sus mezclas de óleo con una aplicación que mezcla en RGB: ve en pantalla
    que un azul y un amarillo dan un gris intermedio, con una línea recta entre ambos. Al pintar, la mezcla
    real pasa por verdes. Su colega dice que la aplicación está rota. ¿Qué decisión tomas y cómo lo justificas?'
  model_answer: 'La aplicación no está rota: hace lo que dice, mezclar de forma aditiva, y en RGB las
    mezclas siguen líneas rectas mientras que la pintura sigue trayectorias curvas que se alejan del gris
    y conservan saturación. Decidiría no usar esa aplicación para predecir mezclas de pintura, sino solo
    como referencia de luces y pantallas, y hacer las mezclas con muestras de los propios tubos. Si se
    necesita simulación, haría falta un modelo de pigmentos y no un promedio de RGB.'
  rubric:
  - Dice que la aplicación mezcla de forma aditiva y por eso no está rota
  - Contrasta línea recta en RGB frente a trayectoria curva de la pintura
  - Concluye que no sirve para predecir mezclas de pintura
  - Propone una alternativa (muestras reales o un modelo de pigmentos)
- id: q-subtractive-mixing-001
  prompt: Mezclas varias pinturas de colores distintos en la paleta. ¿Qué tiende a pasar con el resultado,
    y por qué?
  options:
    a: Se vuelve más claro, porque cada pintura añade luz
    b: Se vuelve más oscuro y apagado, porque cada material añadido absorbe más luz
    c: Se vuelve más brillante, porque los colores se suman como luces
    d: Queda igual, porque el ojo promedia los colores
  explanation: En la mezcla sustractiva cada material absorbe más luz, así que la mezcla absorbe más que
    cualquiera de sus componentes y tiende a oscurecerse y apagarse. La opción c confunde la pintura con
    la mezcla aditiva de luces.
- id: q-subtractive-mixing-002
  prompt: Un objeto azul se ilumina solo con luz roja. ¿Cómo se ve y por qué?
  options:
    a: Azul, porque su color es una propiedad fija
    b: Rojo, porque refleja la luz que recibe
    c: Morado, porque se mezclan la luz y el color del objeto
    d: Negro, porque absorbe la luz roja y no tiene luz azul que reflejar
  explanation: Un objeto azul absorbe el rojo; con luz solo roja no refleja nada y se ve negro. La opción
    a ignora que el color depende de la luz que llega y de lo que el objeto absorbe.
