    - "Concluye que la decisión es de criterio o que se prueba en bocetos"
- id: q-dominance-and-accent-008
  prompt: "Quieres equilibrar un amarillo Y 7/9 con un morado-azul P-B 3/4. Según el cálculo de Cleland, ¿cómo repartirías las áreas y con qué cautelas lo usarías?"
  model_answer: "El producto valor por croma es 63 para el amarillo y 12 para el morado-azul; las áreas van en proporción inversa, así que salen unas 12 partes de amarillo por 63 de morado-azul: mucho morado y poco amarillo. Lo usaría como punto de partida de un boceto y no como medida: es una prescripción de 1921, sin contrastar, con valores y límites de croma de un sistema Munsell de entonces y en pigmentos. Munsell advertía además que el equilibrio resiste las reglas simples (el amarillo fuerte atrae más atención). Comprobaría el croma y valor reales de mis mezclas y ajustaría a ojo."
  rubric:
    - "Calcula 63 (amarillo) y 12 (morado-azul) y reparte inversamente, con mucho morado-azul y poco amarillo"
    - "Indica que es una prescripción de 1921 no comprobada"
    - "Advierte que los valores y límites de croma son de un sistema antiguo, no del actual"
    - "Propone usarlo como punto de partida y ajustar con los valores y croma reales"
- id: q-dominance-and-accent-009
