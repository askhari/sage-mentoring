- id: q-color-meaning-006
  prompt: "Un cliente te pide un cuadro para un público internacional con un rojo dominante que 'signifique amor' sin lugar a dudas. ¿Qué le adviertes y cómo decides?"
  model_answer: "Le advierto que el rojo es ambivalente: se asocia con amor y también con ira, según Jonauskaite. Los datos muestran una base global fuerte pero con variación nacional medible, con la lengua pesando más que la geografía. Además se midieron palabras de color, no manchas, y la muestra era en línea y alfabetizada, así que no extiendo los resultados a sociedades de pequeña escala. Por eso el contexto es lo que orienta la lectura: el sujeto, los valores, las proporciones y los colores vecinos. Defino el significado por el público concreto y no por un diccionario."
  rubric:
