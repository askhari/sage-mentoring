- id: q-color-temperature-007
  prompt: "Entre adultos estadounidenses y británicos, ¿qué tendencia de preferencia recoge Palmer respecto a la temperatura?"
  options:
    a: "Se prefieren los cálidos porque son más activos"
    b: "Se prefieren, en general, los colores fríos a los cálidos"
    c: "No hay ninguna diferencia de preferencia"
    d: "Se prefiere el rojo saturado en objetos grandes como paredes o sofás"
  explanation: "Palmer recoge preferencia por lo frío, con el azul más querido. Los objetos grandes en rojo (paredes, sofás) se rechazan."
- id: q-color-temperature-008
  prompt: "¿Dónde sitúa Munsell el verde respecto a cálidos y fríos?"
  options:
    a: "Claramente entre los cálidos"
