- id: q-color-temperature-009
  prompt: "Explica qué demuestra y qué no demuestra el estudio de Ho sobre los colores cálidos y fríos."
  model_answer: "El estudio demuestra que existe una asociación medible entre rojo y calor y entre azul y frío: la gente responde más deprisa cuando rojo va con 'cálido' y azul con 'frío'. No demuestra el reparto completo de la rueda, porque solo probó rojo y azul con muestras pequeñas (el verde frío se infiere del bosque, no se midió). Tampoco demuestra que sea innata, ya que los autores la explican por aprendizaje de correlaciones del entorno y hay países con el mapa invertido. Además el efecto va en una dirección: el color acelera el juicio de temperatura, no al revés."
  rubric:
    - "Indica que la asociación rojo–cálido y azul–frío se midió (respuestas más rápidas cuando coinciden)"
    - "Indica que solo se probaron rojo y azul con muestras pequeñas"
    - "Indica que el origen se atribuye al aprendizaje y no es universal"
    - "Menciona que el resto de la rueda (amarillo, verde, etc.) no se apoya en esa fuente"
- id: q-color-temperature-010
  prompt: "Pintas un paisaje al aire libre. Un compañero te dice que 'la luz es cálida y la sombra es fría, siempre'. En tu sombra, el suelo cálido refleja luz hacia arriba. ¿Cómo decides el color de la sombra?"
  model_answer: "Trato la fórmula 'luz cálida, sombra fría' como regla con excepciones, no como ley. Según Gurney, la luz reflejada cálida puede hacer las sombras más cálidas que las luces. Aplico su regla más precisa: los planos en sombra que miran hacia arriba son fríos (cielo) y los que miran hacia abajo, cálidos (rebote del suelo), con excepciones como una luz cálida fuerte desde arriba. Compruebo comparando pares concretos de colores en mi escena ('comparar, comparar') y trato mi decisión como hipótesis que verifico pintando."
  rubric:
    - "Rechaza 'luz cálida, sombra fría' como ley fija"
    - "Menciona que la luz reflejada cálida puede calentar la sombra o la regla de planos hacia arriba (fríos) y hacia abajo (cálidos)"
    - "Decide comparando colores concretos en la escena"
    - "Trata la temperatura como hipótesis que se comprueba al pintar"
- id: q-color-temperature-011
  prompt: "Te encargan un mural para un vestíbulo de uso internacional y piensas en rojo para 'calidez de acogida' y azul para 'frialdad profesional'. ¿Qué dicen las fuentes que deberías tener en cuenta antes de decidir?"
  model_answer: "Que la asociación rojo–cálido no es universal: Ho describe una norma cultural poco rígida y países con el mapa invertido, así que no puedo asumir que todo el público la lea igual. En preferencia, de media gustan más los colores fríos y los pares más azulados, y el rojo saturado produce pares particularmente desagradables; además Palmer recoge que se rechazan los objetos grandes en rojo, como paredes o sofás. Pero son tendencias de grupo con grandes diferencias individuales. Por tanto probaría la gama en un boceto con el contexto real y no daría por segura la lectura 'rojo = acogida'."
  rubric:
    - "Señala que la asociación rojo–cálido no es universal"
    - "Menciona que de media se prefieren los colores fríos o que el rojo saturado desagrada en pares"
    - "Señala que son tendencias de grupo con diferencias individuales"
    - "Concluye con una decisión prudente (probar o ajustar al público) y no una regla fija"
- id: q-color-temperature-012
  prompt: "Según Witzel, la luz natural del día varía sobre todo a lo largo del eje azul–amarillo. ¿Qué consecuencia práctica se saca para juzgar la temperatura de luces y sombras?"
  options:
    a: "Que los juicios azul–amarillo son los más inciertos, así que conviene juzgar por comparación y no por nombre"
    b: "Que el azul siempre es la sombra y el amarillo la luz"
    c: "Que la luz del día no cambia de color, solo de intensidad"
    d: "Que los juicios azul–amarillo son los más fiables"
  explanation: "Como la variación natural de la luz ocupa ese eje, los juicios en él son los más inciertos. Por eso refuerza juzgar por comparación."
- id: q-value-structure-001
  prompt: "¿Qué es la estructura de valores (value structure) de un cuadro?"
  options:
    a: "La manera en que las zonas claras y oscuras se agrupan y se reparten, con independencia del matiz"
    b: "La lista de los pigmentos usados, ordenados de claro a oscuro"
    c: "El contraste entre colores cálidos y fríos"
    d: "La cantidad total de blanco que lleva el cuadro"
  explanation: "Se trata de cómo se reparten los valores (claridad). El matiz y la temperatura son otras dimensiones."
- id: q-value-structure-002
  prompt: "Según Gurney (que cita a Rockwell, Cornwell y Lovell), ¿qué relación hay entre el color y el diseño de valores?"
  options:
    a: "Un buen color corrige siempre un valor flojo"
    b: "El color añade mucho, pero no puede salvar un mal diseño de valores"
    c: "El valor solo importa en cuadros monocromos"
    d: "El valor y el color no se influyen"
  explanation: "Es la opinión de un practicante, atribuida a Gurney y a los ilustradores que cita. La opción opuesta es el error que él señala."
- id: q-value-structure-003
  prompt: "Según la reseña de Livingstone (fuente secundaria), ¿por qué importa la luminancia para dar sensación de volumen?"
  options:
    a: "Porque el color no puede percibirse sin luminancia en ningún caso"
    b: "Porque la luminancia solo importa en blanco y negro"
    c: "Una forma sombreada solo por cambio de color parece plana; con un gradiente de luminancia da sensación de volumen"
    d: "Porque el volumen solo se percibe con colores cálidos"
  explanation: "La reseña lo cuenta así y añade que los artistas construyen la forma con contraste de luminancia desde el siglo XIII."
- id: q-value-structure-004
  prompt: "En los experimentos de Schloss y Palmer con pares de colores, ¿qué papel tuvo el contraste de claridad?"
  options:
    a: "Los pares más armoniosos son siempre los de mayor contraste de valor"
    b: "Los pares más preferidos tienen el menor contraste de valor"
    c: "No influyó en nada"
    d: "Los pares más preferidos tienen más contraste de valor, pero la armonía depende poco de él"
  explanation: "La diferencia de claridad aporta un 4,5 % de la preferencia más allá de la armonía; los pares más armoniosos que preferidos tienen poco contraste de claridad."
- id: q-value-structure-005
  prompt: "Explica con tus palabras por qué conviene mirar un estudio en grises o desaturado antes de dar por buena su estructura de valores, y qué relación tiene con el contraste simultáneo."
  model_answer: "Cuando dos zonas difieren mucho en croma (un naranja intenso junto a un azul gris apagado), el color altera el valor percibido, de modo que a ojo en color el valor puede engañar. Desaturar la imagen muestra cómo se lee realmente el valor, y permite comprobar si el diseño de valores funciona antes de fiarse del color. Es la misma sensibilidad del contraste simultáneo: el valor de una zona se juzga contra sus vecinas."
  rubric:
    - "Afirma que el croma/color puede alterar el valor percibido"
    - "Explica que desaturar muestra el valor real o cómo se lee el valor"
    - "Relaciona la idea con el contraste simultáneo: el valor se juzga contra los vecinos"
- id: q-value-structure-006
  prompt: "¿Qué encontró Schloss y Palmer (Exp. 4) sobre la preferencia por el color de una figura según su claridad respecto al fondo?"
  options:
    a: "Se prefieren figuras claras sobre fondos oscuros y figuras oscuras sobre fondos claros"
    b: "Se prefieren figuras de igual claridad que el fondo"
    c: "Solo se prefieren figuras oscuras sobre cualquier fondo"
    d: "No hubo ninguna relación con la claridad"
  explanation: "Es decir, gusta el contraste de claridad entre figura y fondo. Los autores especulan que podría deberse a la fluidez de procesamiento o al rechazo de bordes casi isoluminantes, sin probarlo."
- id: q-value-structure-007
  prompt: "Vas a pintar una escena exterior de gran contraste. Un compañero dice que 'el pigmento llega a todo'. ¿Qué le respondes y cómo planificas los valores?"
  model_answer: "El pigmento solo cubre un rango de contraste de unos 20:1, mientras que una escena exterior puede rondar 1000:1 (Livingstone), así que no llega a todo. Hay que decidir qué parte de la escala se sacrifica y agrupar los valores en pocos escalones para que la composición lea. Siguiendo a Gurney, haría antes un diseño tonal en dos o tres valores, comprobaría el estudio en grises o desaturado, y después encajaría el color con una paleta limitada reservando los oscuros más profundos."
  rubric:
    - "Indica la diferencia de rango entre pigmento (~20:1) y escena (~1000:1)"
    - "Concluye que hay que comprimir y decidir qué parte de la escala sacrificar"
    - "Propone agrupar los valores en pocos grupos (dos o tres) o un diseño tonal previo"
    - "Propone comprobar en grises o desaturado antes de añadir el color"
- id: q-value-structure-008
  prompt: "En tu cuadro, el punto de interés es un sol rojo-anaranjado sobre un cielo del mismo valor. En la foto en blanco y negro desaparece. ¿Qué haces y por qué?"
  model_answer: "Es el fenómeno de la equiluminancia: cuando dos colores en contacto tienen el mismo valor, el sistema visual que organiza el espacio y la profundidad apenas registra el límite. Livingstone cuenta que en Impresión, sol naciente de Monet el sol tiene la misma luminancia que el cielo, parece vibrar y desaparece en una reproducción en grises. Primero lo detectaría con la prueba en grises, como aconseja Gurney. Después decidiría según la intención: si quiero esa vibración o ambiente lo dejo; si el sol debe ser un punto de interés firme, cambio el valor de uno de los dos para que el borde lea."
  rubric:
    - "Identifica el problema como igualdad de luminancia entre colores en contacto"
    - "Explica el efecto (el límite apenas se registra, vibra o desaparece en grises), citando a Monet"
    - "Usa la prueba en grises como diagnóstico"
    - "Toma una decisión razonada según la intención (mantener la vibración o cambiar el valor)"
- id: q-value-structure-009
