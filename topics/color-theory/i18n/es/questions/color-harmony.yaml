- id: q-color-meaning-007
  prompt: "Un alumno te enseña una lista de 'significados de colores' encontrada en internet, sin fuentes, y quiere seguirla al pie de la letra en sus cuadros. ¿Qué le recomiendas?"
  model_answer: "Le recomiendo desconfiar de las listas sin fuente: en lo medido, las asociaciones se cuentan como probabilidades y con excepciones, no como definiciones (Jonauskaite). Debe distinguir lo que un color significa de lo que gusta, porque la preferencia depende de objetos y asociaciones y varía con género, edad y cultura (Palmer). El contexto manda sobre el color suelto: por ejemplo, las berlinas de lujo se prefieren en acromáticos y los VW Beetle en colores vivos. Que defina el significado según el público y contexto de su obra."
  rubric:
    - "Recomienda desconfiar de listas sin fuente"
    - "Explica que las asociaciones son probabilidades con excepciones"
    - "Distingue significado de preferencia"
    - "Subraya el papel del contexto o del público"
