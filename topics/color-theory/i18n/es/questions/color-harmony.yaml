- id: q-color-schemes-001
  prompt: "¿Qué describe un esquema complementario (complementary scheme)?"
  options:
    a: "Dos matices opuestos en la rueda de color, con el neutro en el centro"
    b: "Tres matices repartidos a igual distancia en la rueda"
    c: "Varios matices vecinos en la rueda, con variaciones de valor"
    d: "Un solo matiz variado en valor y croma"
  explanation: "Es la definición que da Gurney: dos matices opuestos con el neutro entre ellos. La opción de tres matices equidistantes es la tríada, y la de matices vecinos es el esquema análogo."
- id: q-color-schemes-002
  prompt: "¿Qué caracteriza a un esquema análogo (analogous scheme)?"
  options:
    a: "Usa un matiz y los dos vecinos de su opuesto"
    b: "Usa dos matices opuestos para realzarse mutuamente"
    c: "Usa matices próximos en la rueda, que se llevan bien por cercanía y no por contraste"
    d: "Usa tres matices, uno por cada primario"
  explanation: "Chevreul lo llama armonía de analogía y Cleland dice que los matices próximos se llevan bien por cercanía. La opción que menciona los vecinos del opuesto es el complementario dividido."
- id: q-color-schemes-003
  prompt: "¿Cómo se llama el esquema formado por un matiz más los dos vecinos de su opuesto en la rueda?"
  accepted:
    - "complementario dividido"
    - "split complementary"
    - "split-complementary"
    - "complementarios divididos"
    - "complementario partido"
- id: q-color-schemes-004
  prompt: "En un esquema monocromático se varían el valor y el croma, pero se mantiene fijo un mismo... ¿qué dimensión del color?"
  accepted:
    - "matiz"
    - "hue"
    - "tono"
    - "el matiz"
- id: q-color-schemes-005
  prompt: "¿Qué estatus tienen los esquemas clásicos de color según las fuentes del tema?"
  options:
    a: "Son leyes de la percepción comprobadas desde el siglo XIX"
    b: "Son convenciones útiles para decidir, no leyes demostradas"
    c: "Son reglas que garantizan armonía si se aplican con exactitud"
    d: "Son resultados de experimentos con pintores profesionales"
  explanation: "Las teorías clásicas se formularon sin mediciones estéticas (Palmer) y Gurney las presenta como herramientas de decisión. Ninguna de las otras opciones tiene respaldo en las fuentes."
- id: q-color-schemes-006
  prompt: "En el método de la máscara de gama (gamut masking) de Gurney, ¿qué ocurre con los colores que quedan fuera de la forma dibujada sobre la rueda?"
  options:
    a: "Se usan solo para los acentos, mezclados al final"
    b: "Se mezclan con los de dentro para neutralizarlos"
    c: "Se reservan para las sombras"
    d: "Se descartan: lo que queda dentro de la forma es la paleta del cuadro"
  explanation: "La máscara define la paleta y el resto se descarta. La idea de acentos fuera de la gama es un recurso posterior, no parte del método básico."
- id: q-color-schemes-007
  prompt: "Según Chevreul, ¿es siempre preferible la armonía de contraste a la de analogía?"
  options:
    a: "No: con dos colores cercanos puede ser preferible avanzar hacia la armonía de escala o de matiz"
    b: "Sí: el contraste siempre mejora los colores"
    c: "Sí, pero solo con colores puros sin gris"
    d: "No: la armonía de analogía solo funciona en grises"
  explanation: "Chevreul admite que con dos colores próximos puede convenir la armonía de escala o de matiz. Sí defiende que los complementarios se mejoran mutuamente, pero no que el contraste sea siempre mejor."
- id: q-color-schemes-008
  prompt: "¿Por qué no se puede decir que los esquemas clásicos estén demostrados?"
  options:
    a: "Porque los experimentos modernos los refutaron todos por igual"
    b: "Porque se formularon sin mediciones estéticas y las teorías discrepan tanto entre sí que casi cualquier par resultaría armonioso"
    c: "Porque solo valen para pigmentos y no para luz"
    d: "Porque solo se han probado con tres colores"
  explanation: "Palmer señala que las teorías se formularon sin mediciones y Schloss y Palmer que, juntas, casi cualquier par sería armonioso. No es cierto que todas fueran refutadas: los datos las matizan."
- id: q-color-schemes-009
  prompt: "Dos pintores hablan de colores complementarios y discrepan sobre cuál es el opuesto del rojo. ¿Qué explicación apoyan las fuentes?"
  options:
    a: "Uno de los dos se equivoca: solo hay una rueda correcta"
    b: "Los complementarios solo existen en la luz, no en el pigmento"
    c: "Lo que es complementario depende de la rueda: la tradicional RYB y la digital no coinciden"
    d: "El opuesto cambia según la hora del día"
  explanation: "Gurney reconoce que su preferencia por la rueda RYB es una preferencia, y que la digital (cian, magenta, amarillo) da otros opuestos. No hay una rueda única correcta."
- id: q-color-schemes-010
  prompt: "Explica con tus palabras por qué la afirmación 'los colores complementarios son los más armoniosos' no está respaldada por los datos experimentales con pares de colores."
  model_answer: "En los experimentos de Schloss y Palmer con pares de colores, tanto la preferencia como la armonía bajan de forma monótona al aumentar la diferencia de matiz, y no hay repunte para los pares complementarios (ni perceptuales ni de pintura). Los complementarios de pintura se puntuaron incluso menos armoniosos que los mismos matices junto a los vecinos de su complementario. Su valor no es la armonía del par: el contraste de matiz mejora cómo se ve el color de la figura sobre el fondo."
  rubric:
    - "Dice que la armonía y la preferencia del par disminuyen al aumentar la diferencia de matiz"
    - "Dice que no hay aumento (repunte) para los pares complementarios"
    - "Distingue la armonía del par del efecto del contraste sobre la figura sobre el fondo"
    - "No presenta la afirmación como un hecho medido ni como una ley"
- id: q-color-schemes-011
  prompt: "Vas a ilustrar una serie de ocho láminas que deben sentirse del mismo mundo cromático. Un compañero propone elegir un esquema triádico y garantizar así la armonía. ¿Qué decides y cómo lo justificas?"
  model_answer: "Usaría el esquema como herramienta de control, no como garantía: dibujo una forma de máscara de gama sobre la rueda, premezclo las cadenas de color de esa gama y uso solo esas en todas las láminas, que es lo que da coherencia en trabajos secuenciales según Gurney. No prometo armonía por el nombre del esquema: los experimentos de Schloss y Palmer solo probaron pares de colores y no tríadas ni paletas, y solo hay resultados preliminares para tríos. Por eso valoro la gama por cómo se comporta en los bocetos de las láminas y la ajusto."
  rubric:
    - "Propone usar el esquema para limitar opciones (por ejemplo, una máscara de gama con colores premezclados)"
    - "Relaciona la gama cerrada con la coherencia en trabajos secuenciales"
    - "Indica que la evidencia experimental se basa en pares y no prueba tríadas ni paletas completas"
    - "Concluye que el resultado se juzga probando en bocetos y no por el nombre de la regla"
- id: q-color-schemes-012
  prompt: "Un cliente exige un cuadro en naranja y azul 'porque los complementarios son por ciencia lo más armonioso'. ¿Cómo respondes, y qué alternativa o matiz le ofreces?"
  model_answer: "Le explico que la afirmación no se sostiene: en los datos de Schloss y Palmer la armonía y la preferencia de los pares bajan al aumentar la diferencia de matiz y no hay repunte para los complementarios (una excepción fue la preferencia por naranja-azul, y los autores atribuyen un repunte azul-amarillo quizá a los colores de la universidad). Las teorías clásicas no salieron de mediciones. Aun así, el naranja y el azul pueden ser una buena elección por su contraste, que mejora la figura sobre el fondo; si busca cohesión y calma, matices próximos funcionan mejor de media. Propongo probar ambas gamas en bocetos."
  rubric:
    - "Rechaza que haya respaldo experimental para 'complementario = más armonioso'"
    - "Cita que la armonía baja al aumentar la diferencia de matiz o que no hay repunte para complementarios"
    - "Ofrece una razón válida para usar el contraste (mejora la figura sobre el fondo) sin llamarlo armonía"
    - "Propone probar o comparar en bocetos en lugar de decidir por regla"
- id: q-color-schemes-013
  prompt: "Pintas un retrato por encargo. La tez y el pelo del modelo vienen dados, pero la ropa y el fondo son libres. Según Chevreul, ¿cómo elegirías esos colores libres, y con qué cautela tomas su consejo?"
  model_answer: "Chevreul distingue colores fijados por el tema (carne, pelo) y colores libres (ropajes, fondo). Buscaría el color dominante de la tez y escogería accesorios y fondo que lo hagan resaltar; si quiero atraer la mirada, usaría armonía de contraste con colores puros o rotos con gris, y si quiero menos diversidad, armonía de escala o de matiz. Son consejos de un colorista del siglo XIX, sin contrastar experimentalmente, así que los tomo como hipótesis de partida y las compruebo en el cuadro."
  rubric:
    - "Distingue colores fijados por el tema y colores libres"
    - "Busca el color dominante de la tez para elegir lo que lo haga resaltar"
    - "Asocia contraste con atraer la mirada y escala o matiz con menos diversidad"
    - "Señala que son consejos históricos usados como hipótesis, no como ley"
- id: q-color-schemes-014
  prompt: "Quieres basar la paleta de un cuadro en una tríada y te preguntas qué dice la evidencia sobre tríos de colores. ¿Cuál es la respuesta más fiel a las fuentes?"
  options:
    a: "Los experimentos usan pares; los autores solo mencionan resultados preliminares, sin publicar, de que un trío se predice a partir de sus pares"
    b: "Se ha demostrado que las tríadas equilátero son más armoniosas que los pares"
    c: "Se ha demostrado que las tríadas son menos armoniosas que los pares"
    d: "Los experimentos probaron tríadas, complementarios divididos y tetradas con resultados concluyentes"
  explanation: "Los estudios de Schloss y Palmer usan pares de dos colores; Palmer tampoco aporta datos sobre tríadas. Las otras opciones afirman resultados que no existen."
- id: q-color-temperature-001
  prompt: "En la práctica corriente, ¿qué colores se consideran cálidos (warm)?"
  options:
    a: "Rojo, naranja y amarillo"
    b: "Verde, cian y azul"
    c: "Rojo, verde y azul"
    d: "Amarillo, verde y violeta"
  explanation: "Palmer recoge que los cálidos son rojo, naranja y amarillo, y los fríos verde, cian y azul. El verde no se considera cálido."
- id: q-color-temperature-002
  prompt: "¿Qué significa que un color sea 'cálido' o 'frío'?"
  options:
    a: "Es la temperatura física real que emite la pintura"
    b: "Es una propiedad del pigmento que no depende del cuadro"
    c: "Es una asociación entre un matiz y una sensación de calor o frío, que se puede medir"
    d: "Es una ilusión sin efecto medible"
  explanation: "Ho y colaboradores midieron que la gente responde más deprisa cuando rojo va con 'cálido' y azul con 'frío'. No es temperatura física, pero tampoco es una ilusión sin efecto."
- id: q-color-temperature-003
  prompt: "Un rojo anaranjado, ¿es cálido o frío?"
  options:
    a: "Siempre cálido, porque contiene naranja"
    b: "Depende de sus vecinos: es cálido junto a un rojo violáceo y frío junto a un naranja"
    c: "Siempre frío, porque el rojo se aleja"
    d: "Ni cálido ni frío: solo los azules y los amarillos tienen temperatura"
  explanation: "Gurney insiste en juzgar la temperatura siempre por comparación y en desconfiar de reglas fijas. Es relativa a los colores vecinos."
- id: q-color-temperature-004
  prompt: "En la convención de los grifos, ¿qué dos colores marcan el agua caliente y la fría, respectivamente? (responde con los dos colores)"
