    - "rojo, azul"
- id: q-color-temperature-005
  prompt: "¿Qué sugieren Ho y colaboradores sobre el origen de la asociación rojo–cálido y azul–frío?"
  options:
    a: "Que se aprende de correlaciones del entorno, y no parece innata: en algunos países africanos el mapa está invertido"
