- id: q-harmony-research-006
  prompt: "Eres pintor con mucha formación y lees que 'los pares armoniosos gustan más'. Tu paleta, armoniosa por las reglas, te resulta aburrida. Un colega concluye que la investigación sobre armonía no sirve. ¿Qué respondes?"
  model_answer: "Que los datos no son inútiles pero tampoco sirven como certificado. La correlación entre gustar y armonía varió entre personas de +,75 a −,03, y Palmer y Griscom describen la preferencia por la armonía como un rasgo individual: a algunas personas les disgusta lo armonioso, y la formación artística específica la baja. Los autores especulan que los expertos aprenden a ir más allá de las reglas (interpretación sin probar). Además los estímulos eran pares de cuadrados, no cuadros. Por tanto uso los esquemas para reducir opciones y decido probando en bocetos, sabiendo que Cleland aceptaba el desequilibrio deliberado."
  rubric:
    - "Cita la variación individual en la relación entre gustar y armonía"
    - "Menciona que la preferencia por la armonía es un rasgo individual o que la formación experta la reduce (marcando que la interpretación no está probada)"
    - "Recuerda que los estímulos eran pares de cuadrados y no cuadros"
    - "Concluye usar los esquemas para reducir opciones o probar en bocetos, sin descartar la investigación"
- id: q-harmony-research-007
  prompt: "Preparas una sesión de taller sobre qué decir de los esquemas clásicos y qué calidad de evidencia tiene cada afirmación. Resume tu mensaje y las cautelas que incluirías."
  model_answer: "Mensaje: los esquemas son herramientas de oficio para reducir opciones; no son certificados de armonía. Las teorías clásicas (Chevreul, Itten, Munsell, Ostwald) se formularon sin mediciones estéticas y discrepan tanto que casi cualquier par sería armonioso. En los datos de Schloss y Palmer gana la similitud de matiz, no hay repunte complementario, y el contraste de matiz mejora sobre todo el aspecto de la figura sobre el fondo. Cautelas: se probaron solo pares de cuadrados en monitor con estudiantes de Berkeley y ocho matices; no hay datos sobre tríadas, complementarios divididos o tetradas; las causas no se conocen; los promedios ocultan diferencias individuales. Y animaría a probar gamas en bocetos, como hace Gurney."
  rubric:
    - "Dice que las teorías clásicas no salieron de mediciones estéticas"
    - "Resume al menos dos resultados (gana la similitud de matiz, sin repunte complementario, contraste de matiz y figura)"
    - "Menciona al menos dos límites (pares, monitor, estudiantes, sin tríadas, causas desconocidas)"
    - "Presenta los esquemas como herramienta para reducir opciones y propone probar en bocetos"
