- id: q-dominance-and-accent-007
  prompt: "Un amigo te pide 'la proporción correcta' de color dominante y acento. Explica con tus palabras qué ofrecen realmente las fuentes y qué no."
  model_answer: "No hay una proporción contrastada. Cleland ofrece una prescripción de 1921 (áreas en proporción inversa a valor por croma, con el área mayor más oscura y débil) que no se comprobó con observadores, y Munsell solo da la idea de que un croma débil necesita más área y que manchas pequeñas fuertes equilibran campos grandes débiles. Palmer solo recoge estudios de peso visual y figura/fondo, no de proporciones de acento, y reglas numéricas populares como 60-30-10 no aparecen en las fuentes. Gurney expresa la proporción por el tamaño de la máscara, sin cifras. La decisión es de criterio y se prueba en bocetos."
  rubric:
    - "Dice que no hay proporción matemática contrastada"
    - "Describe la idea de Cleland o Munsell (croma fuerte necesita menos área) como prescripción histórica sin comprobar"
