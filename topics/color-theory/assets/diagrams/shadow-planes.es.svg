<text x="480" y="80" text-anchor="middle" fill="#7a5a00" font-size="13" font-style="italic">☀ sol detrás del muro</text>
<line x1="560" y1="130" x2="590" y2="36" stroke="#222" stroke-width="1"/><circle cx="560" cy="130" r="3" fill="#222"/><text x="590" y="40" text-anchor="middle" fill="#111" font-size="14" stroke="#fff" stroke-width="4" stroke-opacity="0.85" paint-order="stroke">parte inferior del voladizo (mira abajo): rebote del suelo → cálida</text>
<line x1="480" y1="260" x2="700" y2="246" stroke="#222" stroke-width="1"/><circle cx="480" cy="260" r="3" fill="#222"/><text x="700" y="250" text-anchor="start" fill="#111" font-size="14" stroke="#fff" stroke-width="4" stroke-opacity="0.85" paint-order="stroke">muro en sombra (vertical): cielo + suelo</text>
