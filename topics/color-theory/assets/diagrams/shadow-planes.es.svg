<line x1="850" y1="420" x2="940" y2="516" stroke="#222" stroke-width="1"/><circle cx="850" cy="420" r="3" fill="#222"/><text x="940" y="520" text-anchor="end" fill="#111" font-size="14" stroke="#fff" stroke-width="4" stroke-opacity="0.85" paint-order="stroke">suelo al sol: sol + cielo</text>
