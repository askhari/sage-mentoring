<text x="410.0" y="207" text-anchor="middle" fill="#222" font-weight="bold">película fina sobre blanco</text>
<text x="410.0" y="226" text-anchor="middle" fill="#555" font-size="12">subtono, sentido Golden</text>
<rect x="550.0" y="55" width="200" height="130" fill="#c1cce3" stroke="#ccc"/>
