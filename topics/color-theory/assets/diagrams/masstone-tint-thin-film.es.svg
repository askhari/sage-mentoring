<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="sans-serif" font-size="14">
<rect width="820" height="470" fill="#fff"/>
<text x="410.0" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Un mismo azul transparente visto de tres maneras (modelo ilustrativo)</text>
<rect x="70.0" y="55" width="200" height="130" fill="#00255b" stroke="#ccc"/>
<text x="170.0" y="207" text-anchor="middle" fill="#222" font-weight="bold">tono de masa</text>
