- id: q-quantum-noise-channels-011
  prompt: Vas a simular un código para (a) entender cómo funciona, (b) estimar un umbral y un coste en qubits, y (c) juzgar un dispositivo real. ¿Qué modelo de ruido eliges en cada caso y por qué? Apóyate en lo que dicen las fuentes sobre el ruido a nivel de circuito.
  model_answer: '(a) Para entender un código: errores de Pauli independientes sobre los qubits de datos y síndrome perfecto, como en los modelos de repetición y de Shor. (b) Para estimar un umbral o un coste: ruido a nivel de circuito (cada operación falla con probabilidad p, una CNOT defectuosa añade uno de los 15 Paulis de dos qubits, una medida defectuosa voltea el resultado, una espera añade X, Y o Z), porque incluye los errores de la propia extracción del síndrome; las cifras salen más bajas que con el modelo ingenuo, como en el 0,57 % de Fowler. (c) Para juzgar un dispositivo: medir también si hay correlaciones, no solo el error medio por puerta, porque un Λ bueno con ráfagas sin explicar no garantiza el régimen que necesita un algoritmo.'
  rubric:
  - Asigna a (a) errores de Pauli independientes con síndrome perfecto.
  - Asigna a (b) ruido a nivel de circuito e indica que incluye los errores de la extracción del síndrome.
  - Señala que el modelo de circuito da cifras (umbral) más bajas que el ingenuo.
  - Para (c) pide medir correlaciones, no solo el error medio por puerta.

- id: q-quantum-noise-channels-012
  prompt: Tu equipo observa que los errores de sus puertas son sobre todo coherentes (rotaciones unitarias sistemáticas) y teme que arruinen la corrección de errores. ¿Qué sabes sobre cómo se acumulan y qué técnica puedes usar para tratarlos?
  model_answer: 'Los errores coherentes se acumulan más rápido que los errores de Pauli estocásticos. Una de las formas más eficaces de tratarlos es convertirlos en ruido de Pauli mediante el twirling de Pauli: se insertan Paulis aleatorios que eliminan los términos fuera de la diagonal y convierten cualquier canal en un canal de Pauli, a menudo con poco coste porque los Paulis insertados se absorben en puertas existentes. Además, Bluvstein y colaboradores dicen que su circuito lógico es más tolerante a errores coherentes y se comporta de forma inherentemente digital, de acuerdo con la teoría.'
  rubric:
  - Afirma que los errores coherentes se acumulan más rápido que los de Pauli.
  - Propone el twirling de Pauli y explica que convierte el canal en uno de Pauli insertando Paulis aleatorios.
  - Menciona que el coste suele ser bajo porque los Paulis se absorben en puertas existentes.
  - Puede añadir que el circuito lógico de Bluvstein se comporta de forma digital y tolera mejor los coherentes.

- id: q-quantum-noise-channels-013
  prompt: En la simulación de Fowler (2012) el umbral por paso es de 1,25 % si solo fallan las CNOT, de 4,3 % si solo fallan las esperas de los qubits de datos y de alrededor del 12 % si solo fallan la inicialización, la medida y la Hadamard de los qubits de medida. ¿Qué indica eso?
  options:
    a: Que las esperas son la operación más peligrosa, porque su umbral es el que más se acerca al 5 %
    b: 'Que las CNOT son la fuente de error que más pesa: el código tolera mucho menos error en ellas que en las demás operaciones'
    c: Que los errores de medida se pueden ignorar, porque su umbral del 12 % supera al de todo el circuito
    d: Que el umbral del código de superficie es 12 %, y los otros valores son errores de simulación
  explanation: 'Un umbral más bajo para un tipo de operación significa que esa operación es la que hay que mantener más limpia: son las CNOT. Un umbral de 12 % para una operación aislada no se puede leer como umbral global; el global (0,57 % por paso) es menor porque suma todos los tipos de error.'

