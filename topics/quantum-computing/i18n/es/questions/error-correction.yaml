- id: q-threshold-theorem-009
  prompt: Explica con tus palabras por qué por debajo del umbral añadir más codificación reduce el error y por encima lo empeora. Apóyate en la concatenación.
  model_answer: 'Con un código que corrige un error, el fallo exige que coincidan dos fallos, así que el error lógico es como mucho C·p² por lugar y el umbral es p_th = 1/C. Al concatenar k niveles el error acotado es (Cp)^(2ᵏ−1)·p. Si Cp < 1, la base se hace menor que 1 y el error cae de forma doblemente exponencial en k, mientras que el tamaño crece solo exponencialmente. Si Cp > 1, la base es mayor que 1 y cada nivel multiplica el error en vez de reducirlo: codificar empeora. Por eso existe un umbral p_th = 1/C.'
