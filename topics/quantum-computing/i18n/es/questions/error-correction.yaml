- id: q-surface-code-012
  prompt: 'Un proveedor de hardware presenta una diapositiva: "los códigos bicicleta de IBM guardan 12 qubits lógicos con 288 físicos frente a casi 3000 de la superficie: ahorro de 15×". Evalúa el titular con lo que dicen los autores y las condiciones del artículo.'
  model_answer: 'El titular es de autores de IBM y es una comparación de memoria, no de computación. Los propios autores hablan de un ahorro de "más de 10 veces" en la introducción y de "casi 15 veces" en la conclusión, por lo que hay que citar el intervalo y no una sola cifra. Condiciones: necesita conectividad de grado 6 (4 enlaces cortos y 2 de largo alcance), con un segundo nivel de acopladores de bajas pérdidas y sintonizables; las estimaciones de viabilidad son proyecciones de los autores, sin hardware en el artículo; no ofrece un conjunto universal de puertas lógicas (solo memoria); y para leer y escribir cada qubit hacen falta ancillas de acceso: 1380 más para [[144,12,12]], que los autores creen reducibles. Con ellas, 288 + 1380 = 1668 y el ahorro frente a 3000 baja a unas 1,8 veces. Además el decodificador es BP-OSD, que puede no ser lo bastante rápido para tiempo real. Conclusión: es una buena promesa para memoria densa con largo alcance, no una ventaja demostrada para computar.'
  rubric:
  - Indica que el ahorro se enuncia como más de 10× / casi 15× por los autores (IBM), no como una cifra única.
  - Señala que es solo memoria (sin conjunto universal de puertas) y proyección sin demostración de hardware.
  - Menciona las ancillas de acceso (1380 más; 288 + 1380 = 1668, ahorro ≈ 1,8×).
  - Menciona la conectividad de largo alcance (grado 6) o el decodificador BP-OSD no probado en tiempo real.

- id: q-surface-code-013
  prompt: Si se suman las 1380 ancillas de acceso a los 288 qubits del código [[144,12,12]], ¿qué ahorro queda frente a los casi 3000 de 12 parches de superficie?
  options:
    a: Unas 10 veces, porque las ancillas de acceso se reutilizan sin coste
    b: Unas 15 veces, porque las ancillas están ya incluidas en los 288
    c: 'Ninguno: con las ancillas el qLDPC cuesta más que la superficie'
    d: Unas 1,8 veces (3000/1668), muy por debajo del 15× del titular
  explanation: 288 + 1380 = 1668 y 3000/1668 ≈ 1,8. Los autores creen que las ancillas son reducibles, así que el ahorro real queda entre 1,8× y el titular; el cálculo no lo hace desaparecer, pero sí lo recorta mucho.

- id: q-surface-code-014
  prompt: Necesitas 1000 qubits lógicos pasivos y tu hardware es un chip de transmones. Estima el coste con parches rotados de d = 25 y propón cómo reducirlo con lo que hace Gidney, indicando las cautelas.
  model_answer: 'Con parches rotados de d = 25, 2·25² − 1 = 1249 qubits por qubit lógico y 1000 · 1249 ≈ 1,2 millones de qubits. Gidney (2025, preprint) reduce el coste repartiendo el chip en una región de cómputo, un almacenamiento caliente (2(d+1)² = 1352 por qubit con holgura) y otro frío con códigos yoked (430 por qubit a 10⁻¹⁵ por ronda): unas 3 veces menos por qubit pasivo. Cautelas: es un preprint con sus hipótesis (rejilla de vecinos próximos, ruido depolarizante uniforme); el rendimiento del almacenamiento frío bajo trabajo en flujo no se simuló en detalle y deja unos 100 000 qubits de holgura. Además, esto es solo memoria: no incluye las fábricas de estados mágicos ni las operaciones.'
  rubric:
  - Calcula 2·25² − 1 = 1249 y unos 1,2 millones para 1000 qubits.
  - Propone almacenamiento frío (430 frente a 1352 en caliente, ≈ 3× menos).
  - 'Cita la cautela: preprint y rendimiento bajo flujo de trabajo no simulado en detalle.'
  - Aclara que la cifra no incluye fábricas de estados mágicos ni operaciones.

- id: q-surface-code-015
  prompt: Tu equipo duda entre superconductores y átomos neutros para un código de superficie. ¿Qué diferencias de ciclo y de conectividad pesan, y qué han demostrado hasta ahora los autores de cada plataforma?
  model_answer: 'Los transmones encajan con las comprobaciones de peso 4 sobre una rejilla de vecinos próximos y tienen un ciclo muy rápido: Google ejecutó un parche de d = 7 (101 qubits) con un ciclo de 1,1 µs, pero solo como memoria. En átomos neutros, la conectividad flexible permite puertas transversales entre parches: Bluvstein y colaboradores hicieron una CNOT lógica entre parches de superficie de d = 3, 5 y 7 con una sola ronda de medida de estabilizadores, y la preparación del estado no es tolerante a fallos más allá de d = 3. Pero el ciclo lógico es órdenes de magnitud más lento (Saffman estima unos 1 kHz para 100 qubits lógicos), con medida lenta, lo que limita el reloj lógico. La elección depende de si prima la velocidad y la rejilla plana o la conectividad flexible.'
  rubric:
  - Asocia los transmones a rejilla 2D de vecinos próximos y ciclo rápido (1,1 µs en Google), solo memoria.
  - Asocia los átomos a conectividad flexible y puertas transversales (CNOT entre parches, d = 3-7).
  - Indica que los átomos tienen un ciclo mucho más lento (≈ 1 kHz o medida lenta).
  - 'Matiza lo demostrado: una sola ronda de síndrome en átomos o memoria sin puertas en Google.'

- id: q-decoding-001
  prompt: ¿Cuándo se considera que un decodificador ha tenido éxito?
  options:
    a: Cuando su estimación coincide con el error real salvo un producto de estabilizadores, aunque no sea el error exacto
    b: Cuando identifica exactamente el error físico que ocurrió, qubit por qubit
    c: Cuando devuelve siempre el error de menor peso, con independencia del síndrome
    d: Cuando el síndrome tras la corrección es todo +1, sin más condición
  explanation: Basta con un error equivalente, que difiera del real en un estabilizador; falla si difieren en un operador lógico no trivial. Un síndrome limpio tras corregir no garantiza que no se haya introducido un operador lógico.

