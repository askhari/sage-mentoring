- id: q-resource-estimation-007
  prompt: Dispones de un hardware con el mismo error físico que en Fowler (2012) pero con un ciclo de código de superficie de 2 ms, y otro equipo tiene un ciclo de 1 µs con tiempo de reacción de control de 10 µs. ¿Qué supuestos de una estimación de recursos mueven más el resultado y qué ocurre con cada hardware?
  model_answer: 'Una estimación es función de sus hipótesis. El error físico: en Fowler, pasar de 10⁻³ a 10⁻⁴ baja las distancias a 16 y 8 y el total a ≈ 130 millones de qubits con el mismo tiempo. El tiempo de ciclo: con un ciclo de 2 ms sin añadir qubits, la factorización de Fowler tardaría ≈ 30 años (frente a 26,7 h con 200 ns), de modo que el hardware de 2 ms no sirve para esa tarea sin más. El tiempo de reacción del control: Gidney lo fija en 10 µs y la latencia del decodificador lo determina. Otros: conectividad (con largo alcance los qLDPC podrían recortar el coste), modelo de ruido (Gidney supone depolarizante uniforme; el dispositivo de Google muestra correlaciones) y las heurísticas del algoritmo no demostradas. El equipo de 1 µs necesita comprobar que su decodificador cabe en los 10 µs.'
  rubric:
  - Cita el efecto del tiempo de ciclo (2 ms ≈ 30 años) o del error físico (130 millones de qubits).
  - Cita el tiempo de reacción del control (10 µs) y su relación con la latencia del decodificador.
  - Menciona al menos otro supuesto (conectividad, modelo de ruido o heurísticas del algoritmo).
  - Aplica el razonamiento a los dos hardwares planteados.

- id: q-resource-estimation-008
  prompt: Para 10⁻¹⁵ por ciclo con p = 10⁻³, el ajuste de Fowler (0,03·(p/0,57 %)^((d+1)/2)) da d = 35. ¿Cuántos qubits tiene un parche rotado de esa distancia (2d² − 1)? Responde con un número.
  accepted:
  - '2449'
  - '2.449'
  - 2 449

- id: q-resource-estimation-009
  prompt: Un directivo de seguridad te pregunta si el resultado de Gidney (RSA-2048 con menos de un millón de qubits ruidosos en menos de una semana) significa que RSA caerá pronto y qué debe hacer la empresa. Responde con las hipótesis y límites de la estimación.
  model_answer: 'No es una predicción de fecha. Es un preprint v1 sin revista en el momento de consultarlo. Sus hipótesis: error físico del 0,1 % (ruido depolarizante uniforme), ciclo de 1 µs, tiempo de reacción del control de 10 µs, rejilla cuadrada de vecinos próximos, y algunas heurísticas del algoritmo no demostradas. Además el cálculo requiere fábricas de estados mágicos y un decodificador a velocidad, y el dispositivo real de Google muestra correlaciones y fugas que el modelo no incluye; el mayor qubit lógico de Google usa 101 físicos y es una memoria. Gidney la presenta como una señal de referencia del estado del arte, recuerda que los ataques siempre mejoran, y respalda los plazos de NIST (deprecar tras 2030 y prohibir tras 2035) no porque espere la máquina en 2030, sino porque la seguridad no debería depender de que el progreso sea lento. Recomendación: planificar la migración a criptografía poscuántica según los plazos de NIST, sin fijarse en una fecha concreta del ordenador.'
  rubric:
  - Dice que no es una predicción de fecha y que es un preprint.
  - Enumera hipótesis clave (p = 0,1 %, ciclo 1 µs, reacción 10 µs, ruido depolarizante, rejilla 2D).
  - Menciona la distancia con el hardware real (correlaciones, solo memoria) o el aviso de que los ataques mejoran.
  - Recomienda planificar la migración con los plazos de NIST (2030 / 2035).

- id: q-resource-estimation-010
  prompt: 'Recibes una estimación que dice "se necesitan 10⁹ qubits físicos". Aplica el checklist de lectura: ¿qué preguntas haces antes de fiarte de la cifra?'
  model_answer: 'Preguntaría: (1) hardware supuesto: error físico, ciclo, tiempo de reacción y conectividad; si cambia uno, cambia la cifra. (2) Qué cuenta como qubit: si incluye fábricas de estados mágicos, almacenamiento pasivo y holguras; en la estimación de Fowler de 2012 las fábricas son más del 94 % de los qubits y los 4000 qubits lógicos de cálculo son menos del 6 %. (3) Qué se compara: tiempo o volumen espacio-tiempo, porque un recorte de qubits puede ser un cambio de tiempo. (4) Error lógico objetivo y probabilidad de éxito (10⁻¹⁵ por ronda frente a 93,3 % de éxito en Gidney). (5) Aproximaciones del algoritmo y heurísticas sin demostrar. (6) Si es preprint o publicado y si los supuestos son de hace años (ciclo de 200 ns de Fowler frente a 1 µs de Gidney). (7) Qué dice el propio autor sobre sus límites.'
  rubric:
  - Pregunta por el hardware supuesto (p, ciclo, reacción, conectividad).
  - Pregunta qué cuenta como qubit (fábricas, almacenamiento) citando el >94 % en fábricas de Fowler.
  - Pregunta qué se compara (tiempo, volumen espacio-tiempo) o el objetivo de error y la probabilidad de éxito.
  - Pregunta por la procedencia (preprint/publicado) o las heurísticas del algoritmo.
