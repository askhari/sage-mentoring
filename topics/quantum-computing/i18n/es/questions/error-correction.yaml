- id: q-threshold-theorem-010
  prompt: 'Alguien dice: "nuestro hardware está por debajo del umbral, así que ya tenemos qubits útiles". Explica con tus palabras qué falla en esa frase.'
  model_answer: 'Estar por debajo del umbral solo significa que añadir distancia ayuda: el error lógico cae exponencialmente con d. No dice cuánto cuesta ni qué distancia hace falta, y eso depende de cuánto por debajo se esté: cerca del umbral hacen falta muchísimos qubits (con p/p_th = 0,877, pasar de d = 3 a 11 apenas baja el error de 2,3·10⁻² a 1,4·10⁻²). Además, el umbral es propiedad del conjunto código-decodificador-modelo de ruido, no del hardware, y el teorema es un resultado teórico que no da por sí mismo un método práctico.'
  rubric:
  - Aclara que por debajo del umbral solo significa que aumentar d reduce el error lógico.
  - Explica que el tamaño necesario depende de cuánto por debajo se esté (cerca del umbral, el coste crece).
  - Dice que el umbral depende de código, decodificador y modelo de ruido, no solo del hardware.
  - Puede añadir que el teorema es teórico y no da el coste práctico.

