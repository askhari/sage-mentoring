- id: q-quantum-noise-channels-001
  prompt: ¿Por qué basta con que un código corrija los errores X y Z de un qubit para corregir cualquier error unitario sobre ese qubit?
  options:
    a: Porque I, X, Y y Z generan todas las matrices 2×2, así que el error es una combinación lineal de Paulis y la medida del síndrome lo colapsa a uno de ellos
    b: Porque en la práctica los errores reales son siempre volteos de bit o de fase y nunca rotaciones intermedias
    c: Porque el síndrome mide el ángulo de la rotación y el decodificador aplica la rotación inversa con precisión analógica
    d: Porque los errores pequeños se promedian entre sí y su suma se anula antes de afectar al qubit lógico
  explanation: 'Al escribir E = a₀I + a₁X + a₂Y + a₃Z, medir el síndrome colapsa el estado a uno en el que ocurrió un Pauli concreto (o ninguno), y entonces se deshace. La tentación de pensar que solo existen volteos discretos es falsa: los errores son continuos, y es la medida la que los discretiza.'

