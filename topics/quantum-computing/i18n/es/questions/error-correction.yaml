- id: q-threshold-theorem-013
  prompt: 'Con los datos de Google (según los autores: error por ciclo ε₇ = 1,43·10⁻³ y Λ = 2,14 con decodificador de red neuronal), tu jefe quiere saber qué distancia y cuántos qubits físicos por qubit lógico harían falta para un error lógico de 10⁻⁹ por ciclo, y con qué cautela dar la cifra.'
  model_answer: 'Se necesita Λ^((d−7)/2) ≥ 1,43·10⁻³/10⁻⁹ = 1,43·10⁶. (d−7)/2 ≥ ln(1,43·10⁶)/ln 2,14 = 14,17/0,761 = 18,6, es decir 19 pasos, d = 45. Con un parche rotado, 2·45² − 1 = 4049 qubits físicos por qubit lógico. Cautelas: Λ se midió hasta d = 7 y se simuló hasta d = 11; la fórmula supone que el exponente se mantiene a distancias mayores, pero Google ajustó la inyección de errores a solo el 80 % del exponente ideal (correlaciones) y en el código de repetición aparece un suelo de unos 10⁻¹⁰ por ciclo desde d ≥ 15. Además Λ depende del decodificador (con emparejamiento es 2,04). La cifra es una extrapolación y debe darse con ese margen.'
  rubric:
  - Plantea Λ^((d−7)/2) ≥ ε₇/objetivo y obtiene d = 45 (19 pasos).
  - Calcula 2d² − 1 = 4049 qubits físicos.
  - Cita que Λ se midió solo hasta d = 7 (simulado hasta 11) y la extrapolación es arriesgada.
  - Menciona al menos una razón para dudar (exponente del 80 %, suelo por ráfagas o dependencia del decodificador).

- id: q-threshold-theorem-014
  prompt: Dos candidatos de tu equipo estiman el coste de un qubit lógico para 10⁻¹² con los datos de Google (según los autores). Uno usa Λ = 2,14 (decodificador de red neuronal, ε₇ = 1,43·10⁻³) y otro Λ = 2,04 (decodificador de emparejamiento, ε₇ = 1,71·10⁻³). ¿Qué distancias y qubits salen y qué lección sacas sobre el decodificador?
  model_answer: 'Con Λ = 2,14: (d−7)/2 ≥ ln(1,43·10⁹)/ln 2,14 = 27,7, es decir 28 pasos y d = 63, con 2·63² − 1 = 7937 qubits. Con Λ = 2,04 y ε₇ = 1,71·10⁻³: ln(1,71·10⁹)/ln 2,04 = 29,8, es decir 30 pasos y d = 67, con 2·67² − 1 = 8977 qubits: un 13 % más. La lección es que el decodificador forma parte del presupuesto: uno más preciso reduce la distancia necesaria, pero ha de funcionar a velocidad de reloj, y la cifra de Λ debe leerse con su decodificador y su incertidumbre.'
  rubric:
  - Obtiene d = 63 y 7937 qubits con Λ = 2,14.
  - Obtiene d = 67 y 8977 qubits con Λ = 2,04.
  - Señala la diferencia (~13 % más qubits).
  - Concluye que el decodificador forma parte del coste o que Λ debe citarse con su decodificador.

- id: q-threshold-theorem-015
  prompt: Con ruido p = 0,5 % y p_th = 0,57 % (ajuste de Fowler), un responsable propone duplicar la distancia para mejorar el error lógico. ¿Qué le dices? Usa los números del ajuste P_L ≈ 0,03·(p/p_th)^((d+1)/2).
  model_answer: 'Con p/p_th = 0,877, el error cae muy poco al subir d: de d = 3 a d = 11 pasa de unos 2,3·10⁻² a 1,4·10⁻² (0,03·0,877² ≈ 0,023 y 0,03·0,877⁶ ≈ 0,014). Cerca del umbral los códigos grandes casi no compensan, porque el coste en qubits crece con d² y el error apenas baja. Primero hay que bajar p bien por debajo del umbral; por ejemplo, con p = 0,1 % la razón es 0,175 (Λ = 5,7) y los errores por ciclo de d = 3, 5, 7 son unos 9·10⁻⁴, 1,6·10⁻⁴ y 2,8·10⁻⁵.'
  rubric:
  - Calcula o cita p/p_th ≈ 0,877 e indica que el error baja muy poco con d (≈2,3·10⁻² a 1,4·10⁻² de d = 3 a 11).
  - Concluye que cerca del umbral aumentar la distancia no compensa el coste en qubits.
  - Recomienda reducir el error físico p primero.
  - Puede contrastar con p = 0,1 % (Λ ≈ 5,7).

- id: q-threshold-theorem-016
  prompt: Un ingeniero compara el 0,8 % de umbral que IBM da en el resumen de su artículo de códigos bicicleta con el 0,57 % por paso del código de superficie de Fowler y concluye que IBM "tiene mejor umbral". ¿Qué reparos pones?
  model_answer: Las cantidades no son comparables sin comprobar su definición. El umbral es una propiedad del conjunto código-circuito-decodificador-modelo de ruido. El resumen de IBM da 0,8 %, pero las tablas dan pseudo-umbrales de 0,0065 y 0,0069 para los códigos de 144 y 288 qubits; el pseudo-umbral (donde p_L(p) = kp) es otra cantidad que un umbral asintótico. Fowler usa otro modelo de ruido de circuito (0,57 % por paso, aproximadamente un 4 % por ciclo completo) y otro decodificador. Hay que fijarse en qué cantidad se informa, con qué decodificador y con qué modelo, antes de comparar.
  rubric:
  - Dice que el umbral depende de código, circuito, decodificador y modelo de ruido.
  - Cita la diferencia entre 0,8 % (resumen) y los pseudo-umbrales ~0,0065/0,0069 de las tablas.
  - Explica que pseudo-umbral y umbral asintótico son cantidades distintas.
  - Concluye que no se pueden comparar sin la misma definición (modelo y decodificador).

