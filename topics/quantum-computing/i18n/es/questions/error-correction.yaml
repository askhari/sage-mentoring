- id: q-stabilizer-formalism-009
  prompt: Explica con tus palabras qué es un código estabilizador y cómo el formalismo convierte la detección de errores en un cálculo de commutación.
  model_answer: Un código estabilizador se define por unos generadores de Pauli que conmutan entre sí, forman un conjunto mínimo y fijan algún estado (−I no está en el grupo). El espacio de código son los estados con valor propio +1 de todos ellos, de dimensión 2^(n−r). Los generadores se miden como observables y los resultados forman el síndrome. Un error de Pauli E que conmuta con un generador no cambia su signo y uno que anticonmuta lo voltea, así que detectar errores es calcular qué generadores anticonmutan con E. Los errores que conmutan con todos pero no están en el estabilizador pasan sin ser vistos (errores lógicos).
  rubric:
  - Define el código por generadores de Pauli que conmutan (espacio de código = autoespacio +1; dimensión 2^(n−r)).
  - Explica que el síndrome son las medidas de los generadores.
  - Explica que un error anticonmutante voltea el signo de un generador (se detecta) y uno conmutante no.
  - Menciona que los errores que conmutan con todos y no son estabilizadores son indetectables.

- id: q-stabilizer-formalism-010
