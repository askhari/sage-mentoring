- id: q-quantum-noise-channels-008
  prompt: Un compañero propone usar la probabilidad de detección de eventos como indicador único de lo bueno que será Λ al escalar la distancia. En el procesador de 72 qubits de Google (según los autores), quitar la fuga de los qubits de datos apenas cambia el código de distancia 3, pero sube Λ un 35 % en el de distancia 5, mientras la probabilidad de detección baja solo un 12 %. ¿Qué le respondes y qué medirías además?
  model_answer: 'El indicador solo sirve si los errores no están correlacionados. Aquí la fuga (y los acoplamientos residuales durante las CZ) es un error correlacionado que apenas se nota en la probabilidad de detección, pero que penaliza a las distancias mayores: Λ subió un 35 % con una bajada del 12 % en la detección. Los autores concluyen que la probabilidad de detección es un buen indicador de Λ solo en ausencia de correlaciones. Además del error medio por puerta, mediría la presencia de correlaciones (fuga, interacciones residuales, ráfagas) y, sobre todo, Λ con varias distancias, porque es lo que fija el coste.'
  rubric:
  - Indica que la probabilidad de detección predice Λ solo si los errores no están correlacionados.
  - 'Cita el efecto de eliminar la fuga: Λ sube un 35 % en d = 5 con solo un 12 % menos de detección (o que apenas cambia en d = 3).'
  - Identifica fuga o interacciones residuales como errores correlacionados.
  - Propone medir correlaciones y Λ a varias distancias, no solo el error medio por puerta.

- id: q-quantum-noise-channels-009
  prompt: En el código de repetición de distancia 29 de Google (2·10¹⁰ ciclos), la supresión del error deja de ser exponencial a partir de d ≥ 15 y aparece un suelo cercano a 10⁻¹⁰ por ciclo. ¿Qué conclusión es la correcta?
  options:
    a: Que el código de repetición no sirve para sondear el ruido, porque sus resultados no se parecen a los del código de superficie
    b: Que el suelo se debe a que el decodificador de emparejamiento es subóptimo y desaparecerá con una red neuronal
    c: Que los errores del dispositivo son independientes y el suelo es un efecto estadístico de la muestra
    d: Un Λ bueno con un suelo cuyo origen no se entiende no basta para extrapolar a los errores muy bajos que necesita un algoritmo
  explanation: 'Los autores atribuyen el suelo a ráfagas raras y localizadas de errores correlacionados (unos 30 qubits, aproximadamente una por hora) cuyo origen no entienden. Justo por eso el código de repetición a gran distancia es una buena sonda: revela fallos que no aparecen en códigos pequeños. No se atribuye al decodificador ni a la estadística.'

