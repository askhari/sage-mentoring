- id: q-quantum-noise-channels-003
  prompt: De Wolf da tres motivos por los que corregir errores cuánticos es más difícil que corregir los clásicos. ¿Cuál de estos es uno de ellos?
  options:
    a: Las puertas cuánticas no son reversibles, así que un error no se puede deshacer
    b: Mirar el estado para comprobar si hay un error puede colapsarlo
    c: Los qubits no se pueden medir nunca sin destruir toda la información
    d: Los errores cuánticos son siempre más probables que los de un bit clásico
  explanation: 'Los tres motivos son: no clonación, un continuo de errores posibles y que medir puede colapsar el estado. Las puertas cuánticas sí son unitarias (reversibles) y los qubits sí se miden; el problema es qué se mide.'

