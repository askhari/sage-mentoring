- id: q-decoding-003
  prompt: Tu estimación de recursos supone un tiempo de reacción del control de 10 µs (como en Gidney, 2025) y un ciclo de 1,1 µs. Los autores de Google (según su artículo) dan un decodificador de emparejamiento en tiempo real con latencia media de 63 ± 17 µs en d = 5 y una red neuronal más precisa que tarda unos 24 µs por ciclo. ¿Qué concluyes de cada uno para tu presupuesto?
  model_answer: 'El decodificador de emparejamiento va al ritmo del ciclo (su latencia se mantiene constante hasta 10⁶ ciclos), pero 63 µs son unos 57 ciclos y superan los 10 µs de tu hipótesis, además es una media en d = 5: el presupuesto de reacción de 10 µs no está cubierto por esta cifra. La red neuronal es más precisa (0,269 % frente a 0,35 % de error lógico), pero con 24 µs por ciclo es unas 22 veces demasiado lenta para consumir el síndrome a 1,1 µs, por lo que el atasco crece sin límite. Habría que comprobar throughput y latencia sostenida, no solo la media, y recordar que la cifra de Google aún no incluye la realimentación al circuito lógico ni se hizo en d = 7.'
  rubric:
  - Calcula que 63 µs ≈ 57 ciclos y es mayor que los 10 µs supuestos.
  - Calcula que 24 µs frente a 1,1 µs es unas 22 veces demasiado lento (throughput).
  - Explica que si el decodificador no sigue el ritmo el atasco crece sin límite (o que el precisión no basta).
  - Señala que hay que mirar latencia sostenida, no solo media, o que son resultados de d = 5.

- id: q-decoding-004
  prompt: ¿Por qué un decodificador que va retrasado no solo es lento, sino que puede dejar de ser viable?
  options:
    a: Porque un decodificador lento aumenta el error físico de las puertas
    b: Porque el síndrome se pierde si no se procesa en el ciclo en que se mide
    c: Porque algunas operaciones lógicas son no deterministas y dependen de resultados de medidas lógicas; si el decodificador va retrasado, el atasco hace crecer exponencialmente el tiempo de cálculo
    d: Porque la latencia solo importa en las memorias y no en la computación
  explanation: La acumulación de síndromes sin procesar bloquea las operaciones que esperan una medida lógica. El síndrome no se pierde (se puede guardar) y el error físico no depende del decodificador; el problema es el tiempo.

- id: q-decoding-005
  prompt: En una CNOT transversal entre dos parches de superficie, un equipo decodifica cada parche por separado con emparejamiento independiente y el error de Bell crece con la distancia. ¿Qué ocurre y qué harías?
  model_answer: 'La CNOT transversal propaga errores físicos de forma determinista de un parche al otro, así que los síndromes de ambos quedan correlacionados y la decodificación independiente pierde información. Bluvstein y colaboradores decodifican los dos qubits lógicos a la vez con un grafo de decodificación con aristas extra e hiperaristas que unen los estabilizadores de ambos bloques: con decodificación correlacionada el error de Bell cae con la distancia. Haría lo mismo, usar un grafo conjunto, y vigilaría que además corra en tiempo real (ellos usan una FPGA).'
  rubric:
  - Explica que la CNOT transversal propaga errores entre parches y correlaciona los síndromes.
  - Propone decodificar conjuntamente con un grafo de decodificación con aristas extra/hiperaristas.
  - Indica que con decodificación correlacionada el error de Bell cae con la distancia.

- id: q-decoding-006
  prompt: ¿Por qué los códigos bicicleta de IBM no se decodifican con emparejamiento de peso mínimo y qué usan los autores?
  options:
    a: Porque son códigos no CSS y X y Z no se pueden separar; usan una red neuronal
    b: No tienen estructura de emparejamiento; usan BP-OSD (propagación de creencias con postprocesado de estadísticas ordenadas), que puede no ser lo bastante rápido para tiempo real
    c: Porque su distancia es demasiado pequeña para emparejar; usan una tabla de síndromes
    d: Porque el emparejamiento es NP-difícil; usan fuerza bruta sobre todos los errores
  explanation: Son CSS y X y Z se decodifican por separado con matrices dispersas; lo que falta es la estructura de emparejamiento de los extremos de cadenas. El problema de peso mínimo de un código lineal es NP-difícil, de ahí BP seguido de OSD, no fuerza bruta.

