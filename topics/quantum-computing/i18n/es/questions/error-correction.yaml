- id: q-quantum-noise-channels-005
  prompt: Una CNOT perfecta recibe una X en su qubit de control justo antes de aplicarse. ¿Qué error hay después de la puerta?
  options:
    a: Una X solo en el qubit objetivo
    b: Una Z en el qubit de control
    c: Una X en el control y otra X en el objetivo
    d: Ninguno, porque la puerta es perfecta y no propaga errores
  explanation: 'Las puertas de dos qubits copian errores de un qubit a otro: la X del control se propaga al objetivo. Que la puerta sea perfecta no impide que propague el error ya existente; por eso hay que contar todos los lugares donde algo puede fallar.'

- id: q-quantum-noise-channels-006
  prompt: Explica con tus palabras por qué no hacen falta correcciones analógicas para un error que es una rotación pequeña y continua, y qué papel tiene la medida del síndrome.
  model_answer: 'Cualquier error de un qubit se escribe como combinación de I, X, Y y Z. Al medir el síndrome, el estado colapsa a una situación en la que ocurrió un error de Pauli concreto, con probabilidad igual al módulo al cuadrado de su coeficiente, o ningún error. Entonces basta aplicar la corrección discreta de ese Pauli. Por eso un código que corrige X y Z corrige cualquier error de un qubit, y el error pequeño no se acumula hasta alterar el estado lógico: o se proyecta a I o a un Pauli que se corrige.'
  rubric:
  - Dice que el error se escribe como combinación lineal de I, X, Y y Z (discretización).
  - Explica que medir el síndrome colapsa el estado a un error de Pauli concreto (o ninguno).
  - 'Concluye que la corrección es discreta: se deshace ese Pauli, sin ajustes continuos.'
  - Menciona que corregir X y Z (y por tanto Y) basta para cualquier error de un qubit.

