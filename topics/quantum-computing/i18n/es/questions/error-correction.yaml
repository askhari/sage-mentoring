- id: q-repetition-codes-017
  prompt: En un experimento de código de repetición con medidas de paridad repetidas, ves que un bit de síndrome cambia en un ciclo y vuelve a su valor en el siguiente, mientras que otro cambia y se mantiene así. ¿Qué interpretas en cada caso y por qué hay que repetir la ronda de síndrome?
  model_answer: 'El cambio aislado que desaparece en el ciclo siguiente es típico de un error de medida: la propia medida de paridad pudo fallar. El cambio que persiste indica un error de datos, que sigue ahí en los ciclos posteriores. Esa diferencia espacio-temporal permite distinguirlos, y por eso la medida de paridades se repite muchos ciclos: el voto se hace también en el tiempo. El código de superficie hace lo mismo con comprobaciones locales de tipo X y Z.'
  rubric:
