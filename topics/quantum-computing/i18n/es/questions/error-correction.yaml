- id: q-surface-code-005
  prompt: En el código de superficie, un error X en un qubit de datos de la zona central…
  options:
    a: Voltea los cuatro qubits de medida vecinos, X y Z a la vez
    b: Voltea los dos qubits de medida Z adyacentes
    c: No voltea ninguno, porque X conmuta con los estabilizadores Z
    d: Voltea los dos qubits de medida X adyacentes
  explanation: Un error X anticonmuta con los estabilizadores Z de sus vecinos (dos). Los qubits de medida X no lo ven, y un Y sí voltearía ambos tipos.

- id: q-surface-code-006
  prompt: En el código de superficie, una cadena de errores adyacentes deja síndrome −1 solo en sus dos extremos. ¿Qué determina si el error es dañino?
  options:
    a: 'La longitud de la cadena: las cadenas largas siempre son dañinas'
    b: El número de qubits de medida que quedan en −1, que debe ser cero
    c: Si la cadena, junto con la corrección, forma un lazo contraíble (inofensivo) o uno que cruza el toro o va de borde a borde (error lógico)
    d: El orden en que se miden los qubits de medida durante el ciclo
  explanation: 'El código es degenerado: muchos errores dan el mismo síndrome y lo que importa es la topología de la cadena más la corrección. Una cadena larga contraíble es un producto de estabilizadores y no hace daño.'

- id: q-surface-code-007
  prompt: ¿Por qué anticonmutan X_L y Z_L en el código de superficie plano?
  options:
    a: Porque están en bordes opuestos de la malla y nunca se tocan
    b: Porque cada una es un estabilizador de peso 4
    c: Porque se aplican en ciclos distintos y se miden por separado
    d: Porque las cadenas de X (entre bordes X) y de Z (entre bordes Z) comparten un único qubit de datos
  explanation: Las cadenas se cruzan en un solo qubit de datos, y un solo cruce de X con Z da anticonmutación. Si fueran estabilizadores conmutarían con todo.

- id: q-surface-code-008
  prompt: Explica con tus palabras qué es un operador lógico en el código de superficie plano, por qué la distancia d es el menor número de volteos que forman uno, y por qué ningún qubit de datos guarda por sí solo la información lógica.
  model_answer: 'Un operador lógico conmuta con todos los estabilizadores pero no es producto de ellos: es una cadena de X que atraviesa la matriz entre los dos bordes X (X_L) o una de Z entre los dos bordes Z (Z_L). Esas cadenas no se detectan en el interior, porque solo dejan síndrome en los extremos, que están en los bordes. La distancia d es el menor número de volteos físicos que forman uno, es decir, la longitud de la cadena más corta de borde a borde. La información lógica está repartida en el estado conjunto de todos los qubits y se lee a través de una cadena de operadores, así que ningún qubit de datos guarda por sí solo la información lógica.'
  rubric:
  - Define el operador lógico como cadena que conmuta con los estabilizadores y no es producto de ellos (X_L entre bordes X, Z_L entre bordes Z).
  - Explica que d es la longitud de la cadena más corta de borde a borde.
  - Explica que la información lógica está repartida y se lee mediante una cadena, no en un qubit.

- id: q-surface-code-009
  prompt: Más allá de repetir la medida de síndrome, ¿cuánto debe durar el establecimiento de un valor de estabilizador en un parche de distancia d?
  options:
    a: Unos d ciclos, de modo que el parche protege por d tanto en el espacio como en el tiempo
    b: Un solo ciclo, porque el tiempo no entra en la distancia
    c: Unos 2d² ciclos, uno por cada qubit del parche
    d: Un número de ciclos independiente de d, fijado por el hardware
  explanation: 'Los errores de medida obligan a repetir: los valores de los estabilizadores deben establecerse durante unos d ciclos y las operaciones que activan o desactivan estabilizadores deben espaciarse d ciclos.'

