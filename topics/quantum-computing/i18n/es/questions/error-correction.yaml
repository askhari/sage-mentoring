- id: q-shor-code-001
  prompt: ¿Cómo se construye el código de Shor de 9 qubits?
  options:
    a: 'Se codifica el qubit con el código de phase-flip (externo) y cada uno de esos tres con el de bit-flip (interno): tres bloques de tres qubits'
    b: Se codifica el qubit con el de bit-flip (externo) y luego cada uno de esos tres con el de phase-flip (interno), con los bloques repartidos por tipo de error
    c: Se repiten nueve veces el qubit original y se decide por mayoría entre las nueve copias
    d: Se usan tres bloques de tres qubits que se miden por separado en la base X y en la base Z
  explanation: El código de Shor concatena ambos códigos de repetición. La opción de las nueve copias no es posible por la no clonación, y la de medir los bloques en X y Z destruiría el estado.

