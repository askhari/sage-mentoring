  model_answer: 'Comparo cuatro cosas. La tasa k/n: la superficie tiene n = d² datos para k = 1 (tasa asintóticamente cero y distancia √n), mientras que los buenos qLDPC tienen tasa constante y distancia lineal. La distancia d, que fija cuántos errores se aguantan. El peso y la geometría de los generadores: la superficie usa comprobaciones de peso 4 locales en 2D; los bicicleta tienen peso 6 y conexiones no locales. Y la complejidad del decodificador: hallar el error de peso mínimo es difícil en general, así que se eligen códigos con corrección eficiente (emparejamiento para la superficie, BP-OSD para los bicicleta).'
  rubric:
  - 'Compara la tasa k/n: superficie n = d² para k = 1 frente a tasa constante de los qLDPC.'
  - 'Compara el peso y la geometría: peso 4 local en 2D frente a peso 6 con conexiones no locales.'
  - Menciona la distancia (cuántos errores aguanta).
  - Menciona la complejidad del decodificador.

