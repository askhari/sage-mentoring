- id: q-photonic-qubits-005
  prompt: ¿Qué mostraron Knill, Laflamme y Milburn (2001)?
  options:
    a: Que basta óptica lineal, detección de fotones individuales y realimentación clásica para computar, con puertas no deterministas que se repiten hasta tener éxito
    b: Que hace falta un medio no lineal fuerte para cualquier puerta de dos fotones
    c: Que un ordenador fotónico tolerante a fallos es construible con tecnología de 2001
    d: Que los fotones pueden almacenarse indefinidamente en cavidades
  explanation: KLM demostró que el procesado óptico es escalable, pero la sobrecarga de fotones auxiliares es grande, y una máquina completa con corrección de errores no era construible entonces.

- id: q-photonic-qubits-006
  prompt: En la computación basada en fusión (PsiQuantum), una fusión de Bell por óptica lineal puede fallar. ¿Qué ocurre cuando falla y cómo lo trata el esquema?
  options:
    a: Corrompe el estado de recurso y hay que reiniciar todo el cálculo
    b: Se repite la fusión hasta tener éxito, igual que en KLM
    c: El fallo se anuncia, no crea entrelazamiento ni añade ruido, y da solo medidas de un qubit; el código de corrección trata el no determinismo junto con los demás errores
    d: Se detecta solo al final del cálculo y se descarta toda la ejecución
  explanation: 'Bartolucci y colaboradores no repiten hasta tener éxito: el fallo anunciado se incorpora al código. Son resultados de simulación de un fabricante.'

- id: q-photonic-qubits-007
  prompt: Alguien dice que la fotónica «no necesita criogenia porque funciona con óptica a temperatura ambiente». ¿Qué matiz es correcto?
  options:
    a: Todos los detectores fotónicos eficientes funcionan a temperatura ambiente
    b: Los detectores de nanohilos superconductores (SNSPD) funcionan a 0,8-3 K, así que la óptica puede ser ambiente pero los detectores no
    c: Solo las fuentes de fotones necesitan criogenia, no los detectores
    d: La fotónica necesita 10 mK, como los superconductores
  explanation: Los SNSPD, con eficiencias ~0,93-0,95, se operan a 0,8-3 K; los fotodiodos de avalancha de Si trabajan a temperatura ambiente pero con ~65 % de eficiencia.

- id: q-photonic-qubits-008
  prompt: Explica con tus palabras la diferencia entre un ordenador fotónico universal por puertas y una máquina de muestreo de bosones como Jiuzhang (2020), y por qué importa al leer un anuncio.
  model_answer: 'Un ordenador universal por puertas ejecutaría circuitos programables arbitrarios y todavía no existe a escala. Jiuzhang es una máquina de muestreo de bosones gaussianos de propósito especial: usa estados comprimidos, un interferómetro fijo de 100 modos y detectores, y no ejecuta circuitos programables. Importa porque un resultado de muestreo no implica que haya un ordenador fotónico universal ni que sirva para otras tareas; hay que preguntar si el anuncio es de propósito especial o universal.'
  rubric:
  - Dice que el universal ejecutaría circuitos programables y no existe aún a escala
  - Dice que Jiuzhang es de propósito especial con un interferómetro fijo
  - Concluye que muestreo de bosones no es lo mismo que ordenador cuántico fotónico
  - Indica que al leer un anuncio hay que preguntar si es de propósito especial o universal

- id: q-photonic-qubits-009
  prompt: PsiQuantum publica que su esquema de computación basada en fusión tolera ~2,7 % de pérdida por fotón. ¿Cómo evalúas ese resultado y qué le preguntarías a la empresa?
  model_answer: El resultado es de simulaciones Monte Carlo con emparejamiento de peso mínimo y de un fabricante, no de hardware. Los propios autores subrayan que los esquemas son pedagógicos y no están optimizados. Le preguntaría cuál es la pérdida total medida en un chip real y cómo se reparte entre fuentes, enrutado y detección, la pureza e indistinguibilidad de las fuentes, las especificaciones de los detectores y si hay réplica independiente. En las fuentes no hay una demostración experimental de un qubit lógico fotónico.
  rubric:
  - Dice que el resultado es de simulación y de un fabricante, no de hardware
  - Menciona que los autores lo describen como pedagógico/no optimizado
  - Pide un presupuesto de pérdida medido y desglosado
  - Dice que no hay demostración experimental de un qubit lógico fotónico en las fuentes

- id: q-photonic-qubits-010
  prompt: En Jiuzhang (2020) la colección de la fuente es ~0,628, la transmisión del interferómetro 0,977, el acoplo de salida ~0,90 y la eficiencia de detección 0,81. Suponiendo factores independientes, calcula la probabilidad de que un fotón sobreviva y compárala con la tolerancia de ~2,7 % de pérdida por fotón de la simulación de PsiQuantum. ¿Qué cautelas pones?
  model_answer: '0,628 × 0,977 × 0,90 × 0,81 ≈ 0,45: sobrevive aproximadamente el 45 % de los fotones, es decir, una pérdida de ~55 % por fotón frente a ~2,7 % de la simulación, unas 20 veces más. La comparación solo es orientativa porque las tareas y los modelos de pérdida son distintos (muestreo de 2020 frente a tolerancia a fallos), y el cálculo supone independencia. Sirve para ver el orden de magnitud entre un experimento de muestreo y los requisitos de una simulación tolerante a fallos.'
  rubric:
  - Calcula ≈0,45 de supervivencia
  - Compara con ~2,7 % de pérdida por fotón y concluye que la distancia es grande
  - 'Pone cautelas: tareas y modelos de pérdida distintos, factores supuestamente independientes'
  - Indica que sirve como orden de magnitud

- id: q-photonic-qubits-011
  prompt: Tu empresa quiere conectar procesadores cuánticos de distintos laboratorios. ¿Por qué la fotónica aparece en la decisión, aunque no sea tu plataforma de cálculo?
  model_answer: 'Porque el fotón es el portador natural de enlace entre nodos: viaja a la velocidad de la luz y casi no interactúa con el entorno, y un procesador fotónico no necesita convertir qubits estacionarios en voladores. Las demás plataformas necesitan interconversión y quizá ajuste de longitud de onda; por ejemplo, los iones usan enlaces fotónicos, aunque en 2019 la tasa era de ~5 Hz por la baja eficiencia de colección (~0,005). La pérdida de fotones sigue siendo el problema principal, de modo que pediría el presupuesto de pérdida del enlace.'
  rubric:
  - Dice que el fotón es el portador natural de enlace (redes, computación distribuida)
  - Dice que otras plataformas necesitan interconversión, por ejemplo con enlaces fotónicos en iones
  - Da el límite de la tasa de enlace (≈5 Hz, eficiencia de colección) o la pérdida
  - Pide un presupuesto de pérdida

- id: q-photonic-qubits-012
  prompt: Un grupo anuncia una máquina de muestreo de bosones gaussianos con 76 clics y dice que simularla clásicamente tardaría 2500 millones de años. ¿Qué puede y qué no puede validarse, y cómo tratas la cifra?
  model_answer: Los autores (USTC, 2020) estiman que Sunway TaihuLight tardaría ~8·10¹⁶ s (2500 millones de años) en generar lo que su máquina obtuvo en 200 s; es una estimación a partir de benchmarks de un torontoniano, no una ejecución. La salida completa de un GBS grande no se puede certificar (se conjetura intratable); los métodos de validación dejan de ser viables por encima de ~30 clics (la versión revisada llegó a 40), de modo que con 76 clics solo hay evidencia circunstancial al descartar hipótesis alternativas. Es además una máquina de propósito especial, y las notas no incluyen refutaciones clásicas posteriores, así que no se puede decir cómo ha evolucionado la cifra.
  rubric:
  - Dice que los 2500 millones de años son una estimación de los autores
  - Dice que la validación completa es intratable por encima de ~30-40 clics
  - Menciona que hay evidencia circunstancial (descartar hipótesis alternativas)
  - Menciona que es de propósito especial o que no hay refutaciones posteriores en las notas

- id: q-spin-qubits-001
  prompt: ¿Por qué el silicio es un material atractivo para los qubits de espín, frente al GaAs?
  options:
    a: Porque está formado mayoritariamente por isótopos sin espín nuclear (28Si, 30Si) y se puede enriquecer, mientras que todos los isótopos del GaAs tienen espín nuclear y dan un ruido hiperfino fuerte
    b: Porque no tiene valles de banda de conducción, a diferencia del GaAs
    c: Porque su acoplamiento espín-órbita es mucho mayor que el del GaAs
    d: Porque el silicio no sufre ruido de carga 1/f
  explanation: El ruido hiperfino de los espines nucleares se puede eliminar con enriquecimiento isotópico en silicio. Al contrario de la tercera opción, el silicio tiene seis valles; es el germanio el que no los tiene. El ruido de carga 1/f no se puede eliminar por completo en dispositivos semiconductores.

- id: q-spin-qubits-002
  prompt: ¿Cómo se lee casi siempre el estado de un qubit de espín en un semiconductor?
  options:
    a: Contando los fotones que dispersa el electrón al iluminarlo con un láser
    b: Midiendo directamente el momento magnético del espín con un SQUID
    c: Convirtiendo el espín en carga (espín a carga) y detectando una sola carga elemental con un sensor
    d: Interfiriendo el electrón consigo mismo en un interferómetro de Mach-Zehnder
  explanation: 'La medida del espín es indirecta: pasa por detectar una carga, lo que tarda ~100 ns con la sensibilidad típica y marca el límite inferior del tiempo de medida.'

- id: q-spin-qubits-003
  prompt: ¿Qué indica el factor de calidad Q = f_R · T2* en los qubits de espín y por qué se usa?
  options:
    a: La temperatura a la que puede operar el qubit sin perder la coherencia
    b: La fidelidad de lectura de espín a carga en porcentaje
    c: El número de espines nucleares que rodean al electrón
    d: 'El número de oscilaciones discernibles: un qubit rápido no es automáticamente bueno, y T2* aislado dice poco, así que se compara con la frecuencia de Rabi'
  explanation: Q combina velocidad y coherencia; los valores están sobre todo entre unas pocas unidades y ~100, con 558 como máximo (ST en 28Si/SiGe, 2024). No es una temperatura ni una lectura.

- id: q-spin-qubits-004
  prompt: Alguien afirma que «los qubits de espín ya compiten en tamaño de procesador con los superconductores». Según la clasificación de Stano y colaboradores, ¿qué es correcto?
  options:
    a: Hay procesadores de espín de cientos de qubits, solo que menos fieles
    b: Los mayores arreglos son de nivel de dispositivo (hasta 12 qubits en 2024); solo hay operación a nivel de procesador con 3 qubits
    c: Un «procesador» de espín es cualquier arreglo con sensado de carga, sin importar el tamaño
    d: Los espines ya ejecutan algoritmos de decenas de qubits, pero no se publican
  explanation: Stano clasifica en dispositivo, simulador y procesador; este último exige control en dos ejes, lectura, interacción ajustable y poder ejecutar algoritmos de N qubits, y solo se muestran 3 qubits.

- id: q-spin-qubits-005
  prompt: Explica con tus palabras en qué se diferencian los qubits de un espín (Loss-DiVincenzo), de dos espines (singlete-triplete) y de tres espines (exchange-only) en cómo se controlan y se leen.
  model_answer: El qubit de un espín usa un campo magnético alterno transversal para girar el espín y el intercambio J entre puntos vecinos para las puertas de dos qubits; se lee por tunelamiento selectivo del espín a un depósito. El singlete-triplete codifica el qubit en dos electrones de un doble punto y se controla con pulsos de tensión en banda base (J), con un gradiente de campo para el segundo eje; se lee por bloqueo de espín de Pauli, que convierte singlete/triplete en una configuración de carga. El exchange-only usa tres espines con espín total 1/2 y solo el intercambio da control universal, con dos ejes a 120°, sin campos oscilantes ni micromagnetos; se lee como el ST, aunque el bloqueo de espín no distingue el estado fugado S = 3/2 del |1⟩.
  rubric:
  - Describe el control del qubit de un espín (campo alterno, intercambio J) y su lectura (tunelamiento selectivo)
  - Describe el singlete-triplete (pulsos de tensión en banda base) y su lectura (bloqueo de espín de Pauli)
  - Describe el exchange-only (solo intercambio, sin campos oscilantes)
  - Indica una ventaja o limitación de al menos dos tipos

- id: q-spin-qubits-006
  prompt: 'Un artículo presenta «el récord de fidelidad de un qubit de espín: 99,992 %». Lees la tabla de Stano y colaboradores: 1Q 99,992 % (hueco en Ge/SiGe, 2023) y 2Q 99,3 % (julio de 2024), además de entradas de 2Q de 83-93 % en otros dispositivos. ¿Cómo lo interpretas?'
  model_answer: 99,992 % es la fidelidad de una puerta de un qubit, la mejor de la tabla; la de dos qubits en ese mismo material es 99,3 %, y como regla las infidelidades de dos qubits están al menos un orden de magnitud por encima de las de uno. Además son los mejores valores de una compilación donde los autores eligen un valor «representativo» por experimento (algo reconocidamente subjetivo), no medianas de dispositivo, y otras entradas de 2Q de la misma tabla están en 83-93 %. No debe compararse con medianas de Google (2019) o promedios de Quantinuum (2023) sin decir que son otro tipo de dato.
  rubric:
  - Identifica 99,992 % como puerta de un qubit y contrasta con la de dos qubits (99,3 %)
  - Dice que las infidelidades de dos qubits suelen ser al menos un orden de magnitud mayores
  - Dice que son mejores valores seleccionados, no medianas
  - Advierte contra compararlos directamente con medianas o promedios de otras plataformas

- id: q-spin-qubits-007
  prompt: Un compañero propone usar qubits de espín en la nube para tu algoritmo de 15 qubits la próxima semana. ¿Qué le respondes con lo que sabes de la escala y de la madurez de la plataforma?
  model_answer: Las notas del tema no describen acceso en la nube a dispositivos de espín, y los resultados citados son experimentos de laboratorio. Según Stano y colaboradores, los mayores arreglos (hasta 12 qubits en Si/SiO₂ en 2024) son de nivel de dispositivo y solo hay operación a nivel de procesador con 3 qubits (un GHZ y una Toffoli); escalar es «el mayor reto actual». Para una carga práctica son una plataforma que seguir, no una que usar hoy. Los resultados de Burkard son de una revisión de preprint de diciembre de 2021, sin los resultados de 2022-24.
  rubric:
  - Dice que no consta acceso en la nube y los resultados son de laboratorio
  - 'Da la escala: hasta 12 qubits a nivel de dispositivo y 3 a nivel de procesador'
  - Menciona que el escalado es el mayor reto o que las matrices 2D son necesarias
  - Concluye que hoy es plataforma que seguir, no que usar

- id: q-spin-qubits-008
  prompt: 'Un artículo informa para un qubit de espín de silicio: frecuencia de Rabi f_R = 5 MHz y T2* = 20 µs. Calcula el factor de calidad Q, la infidelidad que da el modelo simple 1 − F ≈ 1/(4Q) y di cómo debes interpretar el resultado.'
  model_answer: 'Q = f_R · T2* = 5·10⁶ Hz × 20·10⁻⁶ s = 100. La infidelidad estimada es 1/(4 × 100) = 0,25 %. El resultado es solo una cota inferior en un modelo sencillo de desfase exponencial: los propios autores avisan de que los errores unitarios bajan la fidelidad sin cambiar Q, y además el T2* con ruido 1/f no es una propiedad intrínseca (depende del tiempo de promediado). Debe acompañarse de la secuencia (Ramsey, eco, desacoplamiento) y de la fidelidad medida por RB.'
  rubric:
  - Calcula Q = 100
  - Calcula una infidelidad de ≈0,25 %
  - Dice que es una cota o modelo sencillo (errores unitarios no aparecen)
  - Menciona que T2* con ruido 1/f no es intrínseco o que hay que dar la secuencia

- id: q-spin-qubits-009
  prompt: Lees una nota de prensa que dice que un «procesador de espín de silicio» logra «lectura del 99,975 %». ¿Qué comprobarías, según las señales de alarma que conoces?
  model_answer: Comprobaría si la fidelidad de lectura incluye o excluye la preparación (la de 99,975 % para un qubit EO incluye ambas, según la tabla de Stano), si la fidelidad de dos qubits es de un par seleccionado, si T2* se cita con su secuencia y tiempo de promediado, y si el «procesador» lo es según la clasificación de Stano (control en dos ejes, lectura, interacción por pares ajustable y capaz de ejecutar algoritmos de N qubits) o es un dispositivo. También si la cifra es una de las mejores entradas de una compilación y de qué fecha.
  rubric:
  - Pregunta si la lectura incluye o excluye la preparación
  - Pregunta si la cifra es de un par/dispositivo seleccionado o un valor mejor
  - Cuestiona si es un procesador o un dispositivo según la clasificación
  - Pide la secuencia y el tiempo de promediado de T2* o la fecha

- id: q-topological-qubits-001
  prompt: ¿Por qué los anyones solo aparecen en sistemas bidimensionales?
  options:
    a: Porque en 3D los anyones son inestables y se desintegran en fermiones
    b: Porque las partículas bidimensionales no tienen espín
    c: Porque en 2D dar una vuelta completa de una partícula alrededor de otra no se puede deshacer, así que intercambiar partículas idénticas puede dar una fase arbitraria
    d: Porque en 2D los electrones se comportan como bosones
  explanation: En tres dimensiones esa vuelta se puede deshacer y solo hay bosones y fermiones. Los anyones son cuasipartículas emergentes de un sistema de muchos cuerpos 2D; los electrones siguen siendo fermiones.

- id: q-topological-qubits-002
  prompt: Según Nayak y colaboradores, ¿por qué un qubit topológico ideal tendría menos errores?
  options:
    a: Porque se almacena en un solo átomo aislado a temperatura cero
    b: Porque la información se guarda de forma no local en cuasipartículas lejanas, y el ruido local no tiene elementos de matriz dentro del espacio de estados fundamentales degenerado
    c: Porque las puertas son rotaciones continuas que se corrigen por software
    d: Porque se fabrica con superconductores sin impurezas
  explanation: 'Es el caso ideal: protección frente al ruido local y puertas que dependen solo de la clase topológica de la trenza. Quedan errores por cuasipartículas térmicas o atrapadas, y los autores llaman demasiado optimista su estimación sencilla.'

- id: q-topological-qubits-003
  prompt: Con anyones de Ising, ¿es suficiente trenzar para realizar cualquier computación cuántica?
  options:
    a: 'No: el trenzado solo genera un conjunto finito de rotaciones de tipo 90°, y hace falta una puerta de fase π/8 no topológica y una medida de paridad de dos qubits'
    b: 'Sí: el trenzado de Majoranas es universal si se hace con suficiente precisión'
    c: Sí, pero solo si la temperatura es mayor que el gap del sistema
    d: No, porque el trenzado no puede realizar ninguna puerta, solo medidas
  explanation: La puerta de fase π/8 se obtiene acercando cuasipartículas, una operación no topológica y no exacta que requiere cierta corrección de errores. Los anyones de Fibonacci sí serían universales por trenzado.

- id: q-topological-qubits-004
  prompt: ¿Qué midió el artículo de Aghaee y colaboradores (Microsoft, versión de 2024 del preprint)?
  options:
    a: La coherencia de un qubit topológico con un tiempo T2 de milisegundos
    b: El trenzado de dos pares de modos de Majorana con una puerta de fase
    c: La corrección de errores de un qubit lógico topológico
    d: La paridad fermiónica de un estado de energía casi cero en un nanohilo de InAs-Al, mediante un interferómetro de puntos cuánticos; no muestran operaciones de qubit
  explanation: Lo medido es una lectura de paridad, no una operación de qubit. Los propios autores dicen que la medida por sí sola no separa sin ambigüedad los MZM de los estados de Andreev finamente sintonizados de la fase trivial.

- id: q-topological-qubits-005
  prompt: Explica con tus palabras qué se puede decir con honestidad hoy sobre el experimento de Microsoft (paridad en un nanohilo) y la crítica de Legg, sin afirmar que exista ni que esté refutado un qubit topológico.
  model_answer: El artículo de Aghaee y colaboradores (todos de Microsoft) reporta una medida de paridad en un dispositivo prototipo, con señal bimodal periódica en flujo y un tiempo de permanencia de ~2 ms; no reporta control coherente, trenzado, coherencia de qubit ni corrección de errores. Los propios autores dicen que la medida por sí sola no distingue sin ambigüedad los modos de Majorana de estados de Andreev ligados en la fase trivial. Legg, en un comentario de arXiv no revisado por pares, reanaliza los datos públicos y sostiene que el protocolo del gap topológico no es fiable; no dice que haya demostrado que no existan Majorana, sino que discute si hay gap. Ninguna operación de qubit se ha mostrado; faltan réplica independiente y una respuesta publicada.
  rubric:
  - Dice que el artículo reporta una medida de paridad y no una operación de qubit
  - Dice que los autores admiten que la medida sola no prueba la topología
  - Describe la crítica de Legg (TGP, gap) y que no está revisada por pares ni refuta la existencia de Majorana
  - Evita afirmar que el qubit topológico existe o que está refutado

- id: q-topological-qubits-006
  prompt: 'Un titular dice: «Microsoft ha creado el primer qubit topológico». Usa la escalera de evidencia (gap, modos de energía cero, lectura de paridad, coherencia, trenzado o fusión, puertas universales, corrección de errores) para situar el anuncio y redactar una respuesta.'
  model_answer: Según el texto leído, el artículo de Microsoft está en el escalón de la lectura de paridad de un solo disparo (SNR 4,9 en 90 µs, error de asignación del 1 %), con los escalones del gap y de los modos de energía cero en discusión. No muestra coherencia de un qubit de paridad, ni trenzado o fusión, ni puertas ni corrección de errores. Los propios autores hablan de «progreso hacia» un qubit topológico y de una medida «consistente con» Majoranas. Un crítico cuestiona el protocolo con el que se eligieron los puntos de operación. El titular exagera; tampoco debe decirse que esté refutado.
  rubric:
  - Sitúa el artículo en la lectura de paridad (escalón 3), con los escalones 1 y 2 en discusión
  - Dice que no se muestran coherencia, trenzado o fusión, puertas ni corrección de errores
  - Cita el lenguaje cauteloso de los autores («progreso hacia», «consistente con»)
  - No afirma que esté refutado y menciona la crítica como discusión abierta

- id: q-topological-qubits-007
  prompt: 'Lees el comentario de Legg (arXiv, marzo de 2025, v1) sobre los datos públicos de Microsoft. Un colega concluye: «Legg ha demostrado que los Majorana no existen». ¿Qué respondes y qué haría falta para cerrar la cuestión según cada parte?'
  model_answer: Legg dice explícitamente que no discute si la región es topológica, solo si tiene gap; sostiene que el resultado del protocolo del gap topológico cambia con la ventana de campo y con el «cutter», que el dispositivo B tiene otras regiones que pasan el protocolo sin comprobar reproducibilidad, y que los datos de conductancia no mostrados indican desorden. Es un comentario no revisado por pares, de una persona, sin confirmación independiente en las notas ni respuesta de Microsoft en esa versión. Legg pediría mostrar el gap en la conductancia local y no local sin antisimetrizar, probar la lectura en todas las regiones que pasan el protocolo y reportar completo su resultado. Microsoft aplaza la correlación entre capacidad y protocolo a un artículo en preparación. Falta una réplica independiente.
  rubric:
  - 'Corrige: Legg no dice que los Majorana no existan, sino que discute si hay gap'
  - Señala que es un comentario no revisado por pares, sin confirmación independiente
  - Resume lo que Legg pediría (gap en conductancia, otras regiones, resultado completo del protocolo)
  - Menciona que faltan la correlación pendiente de Microsoft y una réplica independiente

- id: q-topological-qubits-008
  prompt: Tu empresa decide si incluir hardware topológico en una hoja de ruta a cinco años. ¿Qué recomiendas y con qué condiciones lo revisarías?
  model_answer: 'Recomendaría tratarlo como un riesgo de investigación y no como una opción de ingeniería: hoy no hay una operación de qubit demostrada (solo una lectura de paridad en un prototipo, que sus autores dicen que no basta por sí sola), la evidencia de topología está discutida y no hay réplica independiente. Para programar no cambia nada hoy; de existir, aparecería como un qubit con muy bajo error físico, lo que reduciría la sobrecarga de corrección. Lo revisaría cuando haya operaciones de qubit demostradas (coherencia, puerta o fusión) con datos públicos y replicables, revisión por pares y réplica independiente.'
  rubric:
  - Recomienda tratarlo como riesgo de investigación, sin operación de qubit demostrada
  - Menciona que la evidencia de topología está discutida y falta réplica independiente
  - Dice que hoy no afecta a la programación y, de existir, reduciría la sobrecarga
  - Fija condiciones de revisión (operaciones de qubit, datos públicos, réplica)

- id: q-topological-qubits-009
  prompt: Te piden una lista breve de preguntas que aplicar a cualquier anuncio de «qubit topológico». Redáctala y justifica cada pregunta con lo que sabes.
  model_answer: (1) ¿Se muestra una operación de qubit (coherencia, puerta, fusión) o solo una lectura? En el artículo de Microsoft solo hay lectura de paridad. (2) ¿La evidencia de topología es independiente de la elección del punto de operación? Legg cuestiona el protocolo del gap topológico. (3) ¿Hay réplica independiente? No consta. (4) ¿Se ha hecho pública la conductancia completa? (5) ¿La publicación está revisada por pares y qué versión? Legg es un comentario no revisado por pares, y Legg cita el artículo de Microsoft como publicado en Nature en 2025. Además, ¿se menciona cómo se logrará la universalidad? Con anyones de Ising hace falta una puerta de fase π/8 no topológica.
  rubric:
  - Pregunta si hay operación de qubit o solo lectura
  - Pregunta si la evidencia de topología depende del punto de operación o del protocolo
  - Pregunta por réplica independiente o datos completos
  - Pregunta por el estado de revisión por pares o la versión

- id: q-quantum-advantage-experiments-001
  prompt: En el experimento de Sycamore (2019), ¿qué mide la fidelidad XEB y por qué se usa?
  options:
    a: 'Es un proxy: promedia D·p_s(q) − 1 sobre las cadenas medidas (0 si son uniformes, 1 si el muestreo es ideal) porque no se puede verificar la distribución completa de más de 2⁵⁰ salidas'
    b: Mide directamente la fidelidad de estado entre el estado de 53 qubits y el ideal
    c: Es el tiempo que tarda el supercomputador clásico en simular el circuito
    d: Es la fracción de puertas de dos qubits que no fallan en el chip
  explanation: XEB necesita simular clásicamente las probabilidades ideales de las cadenas medidas; por eso no se puede aplicar a los circuitos más difíciles y se estima desde circuitos más fáciles.

- id: q-quantum-advantage-experiments-002
  prompt: La cifra de «10 000 años» para simular el experimento de Sycamore con 20 ciclos, ¿qué es?
  options:
    a: El tiempo medido en que Summit completó la simulación
    b: Una cota inferior demostrada para todos los algoritmos clásicos posibles
    c: Una extrapolación de los autores a partir de un método de Schrödinger-Feynman, no una ejecución medida
    d: El tiempo que tarda Sycamore en obtener las muestras
  explanation: Los autores aclaran que es una extrapolación a 10⁶ núcleos desde 1000 caminos de ~246 s. Sycamore tardó unos 200 s en un millón de muestras.

- id: q-quantum-advantage-experiments-003
  prompt: ¿Cómo reduce el método de Pan y colaboradores (2022) el coste de la simulación clásica y cómo estiman la fidelidad?
  options:
    a: Simula todo el vector de estado en la RAM de Summit y mide la fidelidad por XEB
    b: Rompe aristas de una red tensorial para cambiar fidelidad por coste, y estima la fidelidad (~0,0037) analíticamente, validándola con circuitos más pequeños, no con XEB sobre las muestras de 53 qubits
    c: Usa un ordenador cuántico propio para generar las muestras de referencia
    d: Cambia el circuito por uno más fácil y mide la fidelidad XEB del nuevo circuito
  explanation: Romper K aristas elimina K/2 puertas de dos qubits y reduce la fidelidad en torno a 2⁻ᴷ. Verificar con XEB las muestras de 53 qubits costaría demasiado, por eso se valida en 30, 38 y 45 qubits.

- id: q-quantum-advantage-experiments-004
  prompt: Jiuzhang (USTC, 2020) es una máquina de muestreo de bosones gaussianos. ¿Qué la caracteriza?
  options:
    a: Es un ordenador fotónico universal programable de 76 qubits
    b: Resuelve el problema de factorización con luz comprimida
    c: Usa 76 qubits superconductores con detectores de umbral
    d: 'Es de propósito especial: ejecuta un único interferómetro fijo y no circuitos programables'
  explanation: Los autores la llaman plataforma fotónica de propósito especial. Los 76 son clics de detección, no qubits programables.

- id: q-quantum-advantage-experiments-005
  prompt: 'Alguien dice: «Los 10 000 años se refutaron, así que Google nunca logró ventaja cuántica». Explica con tus palabras por qué esa conclusión es demasiado fuerte y qué matiz se debe hacer.'
  model_answer: Pan y colaboradores resuelven clásicamente el problema de muestreo tal como estaba definido con una estimación analítica de fidelidad (0,0037) y una extrapolación del tiempo (15 h en 512 GPU medidas y la comparación con una máquina de exaflops no ejecutada), pero no presentan su trabajo como una refutación general de la ventaja cuántica. La cifra de 10 000 años era una extrapolación de los autores para un método concreto y no una cota para todos los algoritmos, y la referencia clásica es un objetivo móvil. Además, Eisert y Preskill (preprint) sostienen que el muestreo de circuitos aleatorios ha ido arguably más allá de la simulación clásica con circuitos mayores, aunque sin aplicación útil más allá de un benchmark.
  rubric:
  - Dice que Pan resuelve el problema tal como está definido y no es una refutación general
  - Dice que los 10 000 años eran una extrapolación para un método concreto
  - Menciona que la referencia clásica es un objetivo móvil
  - Menciona que Eisert y Preskill sitúan hoy el RCS más allá de la simulación clásica con circuitos mayores (y es un preprint)

- id: q-quantum-advantage-experiments-006
  prompt: Explica con tus palabras por qué los experimentos de ventaja cuántica usan tareas de muestreo y no, por ejemplo, el algoritmo de Shor.
  model_answer: Ejecutar Shor requiere una máquina tolerante a fallos, un objetivo a largo plazo. Las tareas de muestreo, como el muestreo de circuitos aleatorios o de bosones gaussianos, se pueden hacer con dispositivos ruidosos de la era NISQ. La dureza clásica del muestreo se apoya en suposiciones de complejidad ampliamente creídas, aunque los resultados son asintóticos y exigen una cercanía estricta de las distribuciones. El precio es que el muestreo tiene poca utilidad práctica fuera de servir como benchmark.
  rubric:
  - Dice que Shor requiere tolerancia a fallos y el muestreo se puede hacer con dispositivos ruidosos (NISQ)
  - Menciona que la dureza del muestreo se apoya en suposiciones de complejidad
  - Menciona que los resultados son asintóticos o que se exige cercanía estricta
  - Menciona la utilidad limitada del muestreo

- id: q-quantum-advantage-experiments-007
  prompt: 'Una nota de prensa afirma: «Nuestro ordenador es mil millones de veces más rápido que cualquier superordenador». Enumera las preguntas que harías para evaluar la afirmación de ventaja.'
  model_answer: 'Preguntaría: cuál es la tarea y si la salida se puede verificar (RCS por proxy, GBS grande es intratable de certificar); a qué fidelidad se hizo y si la referencia clásica se calcula a esa fidelidad (el coste escala ~1/F); si la cifra clásica es medida o extrapolada (10 000 años y 2500 millones de años son estimaciones de los autores); qué algoritmos clásicos y hardware se probaron (la referencia es una diana móvil); si la brecha depende del tamaño de la muestra; si crece con el tamaño del problema; si se explota la estructura del circuito; si se usa poselección; si la respuesta es útil; y quién firma y en qué estado está (fabricante, preprint, réplica independiente).'
  rubric:
  - Pregunta por la fidelidad y si la comparación clásica se hace a esa fidelidad
  - Pregunta si la cifra clásica es medida o extrapolada y quién la calculó
  - Pregunta qué algoritmos clásicos se probaron (objetivo móvil)
  - Pregunta por la verificación de la salida o el tamaño de muestra
  - Pregunta por la utilidad de la tarea o por quién firma y el estado de revisión

- id: q-quantum-advantage-experiments-008
  prompt: Una empresa ficticia anuncia un chip de 100 qubits que ejecuta un circuito con 1000 puertas de dos qubits de error del 1 % y dice que hay «ventaja cuántica». Usa la regla del producto solo con las puertas de dos qubits para estimar la fidelidad y comenta qué implica.
  model_answer: 0,99¹⁰⁰⁰ ≈ 4,3·10⁻⁵ (equivalente a exp(−ε·V_eff) con ε = 0,01 y V_eff ≈ 1000, unos 10 en el exponente). Es una fidelidad de orden 10⁻⁵, mucho menor que el ~2·10⁻³ de Sycamore (2019), de modo que casi toda la salida sería ruido y la señal sería una fracción mínima; habría que ver si esa fidelidad se puede medir y si la simulación clásica a esa fidelidad (cuyo coste baja ~1/F) sigue siendo difícil. Saffman concluye que lo que sube el coste de simulación clásica es la fidelidad, no el número de qubits. Ni el número de qubits ni las puertas bastan para justificar la ventaja.
  rubric:
  - Calcula ≈4·10⁻⁵ para 0,99¹⁰⁰⁰
  - Compara con la fidelidad ~2·10⁻³ de Sycamore y concluye que casi todo es ruido
  - Relaciona el coste clásico con la fidelidad (~1/F) o con exp(−ε·V_eff)
  - Concluye que el número de qubits o de puertas no basta para justificar ventaja

- id: q-quantum-advantage-experiments-009
  prompt: 'Para el experimento de Sycamore, calcula la brecha entre el tiempo clásico y los 200 s de muestreo de Sycamore en dos casos: los 10 000 años estimados por Google y las 15 horas de Pan y colaboradores. ¿Qué dicen estos números y qué no?'
  model_answer: '10 000 años ≈ 3,2·10¹¹ s; dividido por 200 s da una brecha de ~1,6·10⁹. 15 horas son 5,4·10⁴ s; dividido por 200 s da ~270. La brecha, tal como la presentaba cada parte, pasó de unas 10⁹ veces a unas 10² veces. Pero con salvedades: las 15 horas son tiempo medido en 512 GPU con una fidelidad estimada (no medida por XEB sobre las muestras) de 0,0037, la afirmación sobre exaflops es una extrapolación, las muestras y las fidelidades no son idénticas y los 10 000 años son una extrapolación de los autores de Google. Los autores de Pan no lo presentan como una refutación general.'
  rubric:
  - Calcula ≈1,6·10⁹ y ≈270
  - Concluye que la brecha pasó de ~10⁹ a ~10²
  - Dice que la fidelidad de Pan es estimada y la comparación tiene salvedades
  - Dice que no es una refutación general

- id: q-quantum-advantage-experiments-010
  prompt: 'Evalúa la afirmación de Jiuzhang (2020): hasta 76 clics, muestreo ~10¹⁴ veces más rápido y 2500 millones de años para Sunway TaihuLight. Di quién la hace, qué es medido y qué estimado, y qué limita la validación.'
  model_answer: 'La hacen los autores del propio experimento (USTC). Lo medido: 200 s de muestreo con hasta 76 clics. Estimado: el tiempo de simulación clásica (~8·10¹⁶ s para Sunway TaihuLight) a partir de benchmarks, no una ejecución. La validación completa de un GBS grande se conjetura intratable y los métodos viables llegan hasta ~30 clics (40 en la versión revisada), así que para el resto hay evidencia circunstancial que descarta hipótesis alternativas (estados térmicos, fotones distinguibles, muestreo uniforme). Es de propósito especial, y los autores señalan que la ventaja de Sycamore depende del tamaño de muestra. Las notas no incluyen refutaciones posteriores, de modo que no puedo decir cómo ha evolucionado la cifra de 10¹⁴.'
  rubric:
  - Dice que la hacen los autores del experimento y que la cifra clásica es una estimación
  - Dice que la validación completa es intratable (viable hasta ~30-40 clics)
  - Menciona la evidencia circunstancial (hipótesis alternativas descartadas)
  - Menciona propósito especial o que no hay refutaciones posteriores en las notas

- id: q-quantum-advantage-experiments-011
  prompt: Un blog cita a Eisert y Preskill (preprint, versión de mayo de 2026) para afirmar que «la ventaja cuántica ya es útil». Valora la cita y di qué dicen realmente las fuentes sobre el muestreo de circuitos aleatorios, y qué reclaman Quantinuum y Harvard/QuEra.
  model_answer: Eisert y Preskill resumen que el RCS ha ido arguably más allá de la simulación clásica (superconductores con más de 100 qubits y 40 capas, iones con más de 50 qubits y 10 capas, átomos neutros con circuitos lógicos poseleccionados), pero lo califican de hito científico importante de utilidad práctica limitada, salvo como benchmark. Piden tres criterios para una aplicación (algoritmo eficiente, dureza clásica convincente, respuesta útil) y dicen que el RCS solo cumple el segundo en un sentido estrecho. Es un preprint no revisado por pares, y las cifras vienen de los autores de cada experimento. Quantinuum (H2, 32 qubits) dice expresamente que no reclama ventaja (simulable clásicamente) y Harvard/QuEra describe sus circuitos como cercanos al límite de la simulación exacta.
  rubric:
  - Dice que Eisert y Preskill califican el RCS como hito pero de utilidad limitada (benchmark)
  - Menciona los tres criterios de una aplicación y que el RCS cumple solo el segundo
  - Señala que es un preprint y los resultados son de los autores de cada experimento
  - Dice que Quantinuum no reclama ventaja y que Harvard/QuEra habla de explorar el límite de simulación

- id: q-hardware-landscape-001
  prompt: 'Una ficha ficticia de un proveedor dice: «256 qubits, hasta 99,9 % de fidelidad, T1 medio 250 µs». Redacta la lista de lo que falta antes de poder comparar este dispositivo con otro, indicando cuál es la métrica ausente más importante para un circuito pequeño y por qué.'
  model_answer: 'Falta: a qué puerta se refiere el 99,9 % (un qubit, dos qubits o lectura); si «hasta» significa el mejor par en lugar de una mediana; si es aislada o en paralelo; la métrica (Pauli, RB, Clifford, efectiva); qué incluye (memoria, transporte); el error de lectura y de preparación; el tiempo de puerta frente a T1; la conectividad y su coste; cuántos qubits son utilizables; la fecha de calibración y el dispositivo. Para un circuito pequeño, la lectura puede dominar (2,83-3,50 % en Sycamore frente a 1,6·10⁻³ de SPAM en el H2), así que su ausencia es crítica. T1 «medio» sin gate time no dice cuántas puertas caben.'
  rubric:
  - Pregunta a qué puerta se refiere (1Q, 2Q o lectura) y si «hasta» es el mejor valor frente a la mediana
  - Pregunta si es aislada o en paralelo, o la métrica
  - Identifica el error de lectura/SPAM como métrica ausente importante y justifica con un dato
  - Pide el tiempo de puerta (para T1), la conectividad o la fecha

- id: q-hardware-landscape-002
  prompt: Debes elegir plataforma para un circuito de 20 qubits con 200 puertas de dos qubits entre pares arbitrarios y una lectura final. Con los datos de un chip superconductor de 2019 (error de dos qubits 0,60 %, lectura 3,5 %) y una máquina de iones de 2023 (1,84·10⁻³, SPAM 1,6·10⁻³), calcula la fidelidad de las puertas de dos qubits y comenta qué cambia la cuenta y qué decidirías.
  model_answer: 'Solo puertas de dos qubits: 0,994²⁰⁰ ≈ 0,30 para el chip de 2019 y 0,99816²⁰⁰ ≈ 0,69 para los iones de 2023; con la lectura de 20 qubits baja a ≈ 0,15 y ≈ 0,67. La comparación no es justa: los datos son de años y fabricantes distintos. La conectividad cambia la cuenta: en una rejilla de vecinos próximos el transpilador añade puertas (100 extra a 0,60 % multiplican por ≈0,55), mientras que en iones con transporte el coste es de tiempo y de error de memoria. La velocidad también decide: milisegundos frente a segundos por disparo. No hay respuesta única: depende de la fidelidad que necesites, del número de ejecuciones y de la disponibilidad; para decidir hay que consultar fichas actuales.'
  rubric:
  - Calcula ≈0,30 (superconductor 2019) y ≈0,69 (iones 2023) para las puertas
  - Advierte que la comparación es injusta por años y fabricantes distintos
  - Explica el efecto de la conectividad (SWAP extra frente a transporte)
  - Menciona el tiempo por disparo o la disponibilidad y concluye que no hay respuesta única

- id: q-hardware-landscape-003
  prompt: 'Tienes dos cargas: (A) un bucle variacional de cientos de miles de ejecuciones; (B) un circuito profundo de pocos qubits con alta fidelidad que se ejecuta pocas veces. Con lo que sabes del tiempo por disparo y de la fidelidad, ¿qué plataforma mirarías primero en cada caso y qué cautelas harías?'
  model_answer: 'Para A pesan las muestras: los superconductores tardan del orden de 0,2 ms por muestra (Sycamore, 2019) frente a 0,7-1,2 s por disparo en iones (H2, 2023), un factor de miles, y además la mitigación de errores cuesta más muestras. Miraría primero superconductores. Para B pesa la fidelidad y la conectividad total: iones (también átomos si hay que mover). Cautelas: las cifras son de máquinas, años y fabricantes distintos, es mi criterio y no una taxonomía de las fuentes, y la disponibilidad de las máquinas (nube y política de acceso) no consta y es parte de la decisión.'
  rubric:
  - Para A elige superconductores y justifica con el tiempo por muestra (~0,2 ms frente a ~1 s)
  - Para B elige iones por la fidelidad y la conectividad total
  - Menciona el coste de muestreo de la mitigación o el número de disparos
  - 'Pone cautelas: cifras de distintos años/fabricantes y disponibilidad'

- id: q-hardware-landscape-004
  prompt: 'Un blog compara las «mejores fidelidades de dos qubits»: iones 99,9 % (2019), átomos neutros 99,71 % en Sr (2025), espines 99,81 % en Si (2022). Concluye: «ganan los iones». Evalúa la conclusión.'
  model_answer: 'Las cifras son mejores valores de fuentes distintas, años distintos y condiciones distintas (la de espín sale de una compilación de valores «representativos»; la de átomos es la mejor entre cuatro elementos), no medianas de dispositivo ni del mismo tipo de dato (RB, Clifford, error efectivo). La tendencia importa más: los átomos y espines se acercan con el tiempo, y los iones en 2023 en el H2 dan 99,82 % por RB y 99,74 % de error efectivo, de otro tipo de dato. Ninguna fuente dice qué plataforma ganará; Bruzewicz (2019) ya decía que la modalidad ganadora seguía lejos de ser segura. Además, la fidelidad no es el único criterio: velocidad, escala y conectividad cuentan.'
  rubric:
  - Dice que son mejores valores, no medianas, y que son de años y métricas distintos
  - Dice que la tendencia importa más que el valor
  - Dice que ninguna fuente declara un ganador
  - Menciona otros criterios (velocidad, escala, conectividad)

- id: q-hardware-landscape-005
  prompt: 'Se te pide ordenar tres resultados de «qubits lógicos»: (a) superconductores, memoria de código de superficie de distancia 7 con Λ = 2,14 (preprint de Google, 2024); (b) átomos neutros, hasta 48 qubits lógicos en 280 átomos (Harvard/QuEra, 2023); (c) iones, 12 qubits lógicos en una trampa de 56 qubits. ¿Se pueden ordenar? ¿Qué letra pequeña debe acompañar a cada uno?'
  model_answer: 'No son directamente comparables. (a) Es una memoria por debajo del umbral: sin puertas lógicas, preprint y autores de Google, decodificador en tiempo real probado a distancia 5. (b) Se apoya en detección de errores con poselección, con una sola ronda de medida de estabilizadores en el resultado de código de superficie, y faltan rondas repetidas de corrección; los autores incluyen a QuEra. (c) Pocas rondas de síndrome y poselección, según Eisert y Preskill. Para cualquier «qubit lógico» hay que preguntar la distancia, el número de rondas, si es memoria o puertas, y si se descartan ejecuciones. Ninguno muestra todavía computación lógica universal repetida.'
  rubric:
  - Dice que no se pueden ordenar porque miden cosas distintas (memoria frente a detección con poselección)
  - 'Da la letra pequeña de (a): solo memoria, sin puertas lógicas, preprint de Google'
  - 'Da la letra pequeña de (b) o (c): poselección, pocas rondas de síndrome'
  - Enumera qué preguntar (distancia, rondas, memoria o puertas, poselección)

- id: q-hardware-landscape-006
  prompt: 'Lees esta nota de prensa ficticia: «Con 1000 qubits y fidelidades del 99,9 %, nuestro procesador logra una ventaja cuántica de millones de años y ya incluye un qubit topológico y qubits lógicos». Señala las señales de alarma que reconoces.'
  model_answer: 'Señales: un titular de número de qubits sin error ni conectividad; «99,9 %» sin decir si es de un qubit, dos qubits o lectura (ni si es el mejor valor presentado como mediana); una ventaja basada en una cifra de años sin el algoritmo clásico ni la fidelidad (estimación de los autores, objetivo móvil); un «qubit topológico» sin operación de qubit demostrada (solo se tiene una medida de paridad en un prototipo discutida); «qubits lógicos» sin distancia, rondas ni decir si se descartan ejecuciones (poselección presentada como corrección); y cifras del fabricante sin réplica independiente ni fecha de la medida.'
  rubric:
  - Señala el número de qubits sin error/conectividad y el «99,9 %» sin especificar 1Q/2Q/lectura
  - Señala la cifra de años de ventaja sin algoritmo clásico ni fidelidad
  - Señala el qubit topológico sin operación de qubit demostrada
  - Señala los qubits lógicos sin distancia, rondas ni poselección
  - Señala que son cifras del fabricante sin réplica independiente o fecha
