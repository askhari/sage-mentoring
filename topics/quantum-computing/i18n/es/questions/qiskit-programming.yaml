- id: q-qiskit-circuits-015
  prompt: Quieres usar un circuito dinámico (medir un qubit a mitad de circuito y reaccionar) en un circuito corto sobre un procesador tipo Heron, y también probarlo antes en un simulador de vector de estado. ¿Qué ventajas y qué límites tienes en cuenta?
  model_answer: 'Ventajas: los circuitos dinámicos permiten medir a mitad de circuito y reaccionar (reinicio de ancillas con una X condicionada, repetir pasos), y en experimentos reales sustituir muchos if por un switch hizo constante la duración del circuito. Límites: en el ISA de Heron el modelo de ejecución serializa el control de flujo y no da tiempos para las expresiones clásicas, lo que perjudica sobre todo a los circuitos dinámicos cortos; por tanto compararía con una versión sin dinámica antes de decidir. Además, estos circuitos se ejecutan en hardware real y no en el simulador de vector de estado, así que la prueba previa debe hacerse con un simulador o dispositivo falso que soporte control de flujo. Los detalles describen Heron en 2024 y habría que comprobar el estado actual.'
  rubric:
  - Cita una ventaja de los circuitos dinámicos (medir y reaccionar, o switch con duración constante)
  - Menciona que el modelo de ejecución de Heron serializa el control de flujo y no da tiempos a las expresiones clásicas
  - Concluye que esto perjudica especialmente a circuitos dinámicos cortos
  - Señala que no se ejecutan en el simulador de vector de estado y que la información es de 2024

- id: q-simulators-and-statevectors-001
  prompt: ¿Cuántas amplitudes guarda un simulador de vector de estado para un registro de n qubits?
  options:
    a: n amplitudes, una por qubit
    b: 2ⁿ amplitudes, la lista completa de amplitudes del estado
    c: 2n amplitudes, dos por qubit (parte real e imaginaria)
    d: n² amplitudes, una por cada par de qubits
  explanation: El estado de n qubits vive en un espacio de dimensión 2ⁿ y el simulador guarda todas sus amplitudes. Por eso añadir un qubit duplica la memoria necesaria.

