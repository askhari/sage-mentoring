- id: q-qiskit-circuits-001
  prompt: ¿Qué es un objeto QuantumCircuit en Qiskit?
  options:
    a: Una matriz unitaria ya calculada que se aplica de golpe al estado inicial
    b: Una conexión autenticada con un dispositivo cuántico al que se envían puertas
    c: Un conjunto de qubits más una lista ordenada de instrucciones que actúan sobre ellos
    d: Una lista de resultados de medida obtenidos tras ejecutar un algoritmo
  explanation: 'El circuito es la pieza central de Qiskit: qubits más instrucciones en orden. No es una matriz ya calculada (eso sería un Operator), ni un backend, ni un resultado; se ejecuta después, mediante primitivas.'

- id: q-qiskit-circuits-002
  prompt: |-
    Se ejecuta este código:

    ```python
    qc = QuantumCircuit(3)
    qc.x(0)
    qc.cx(0, 1)
    print(Statevector(qc).probabilities_dict())
    ```

    ¿Qué cadena de bits aparece con probabilidad 1?
  options:
    a: '''011'', porque Qiskit escribe el qubit 0 en el extremo derecho'
    b: '''110'', porque el qubit 0 se escribe a la izquierda y el 2 a la derecha'
    c: '''010'', porque el CNOT no cambia el qubit objetivo si el control vale 1'
    d: '''001'', porque solo la X ha cambiado un qubit y el CNOT no actúa sobre el estado'
  explanation: 'La X voltea el qubit 0 y el CNOT, con control en 0 valiendo 1, voltea el qubit 1: quedan a 1 los qubits 0 y 1 y a 0 el 2. Con la convención little-endian se escribe q2 q1 q0 = 011. Leer de izquierda a derecha como q0 q1 q2 daría 110, el error típico.'

- id: q-qiskit-circuits-003
  prompt: ¿Cómo se llama la convención de Qiskit por la que el qubit 0 es el bit situado más a la derecha de la cadena de resultado?
  accepted:
  - little-endian
  - little endian
  - endian pequeño
  - orden little-endian
  - litle-endian

- id: q-qiskit-circuits-004
  prompt: ¿Qué hace exactamente qc.measure_all()?
  options:
    a: Mide solo los qubits sobre los que ya se ha aplicado alguna puerta, reutilizando los bits clásicos del circuito
    b: Crea sus propios bits clásicos en un registro llamado meas, inserta antes una barrera y mide todos los qubits
    c: Mide todos los qubits y los devuelve a |0⟩, dejando el circuito listo para otra ejecución
    d: Añade una medida de cada qubit sobre los bits clásicos ya declarados y falla si no existen
  explanation: measure_all crea el registro clásico meas por sí mismo y añade una barrera. La variante que mide solo qubits con operaciones es measure_active, y la que asigna qubits concretos a bits concretos es measure(qubits, bits).

- id: q-qiskit-circuits-005
  prompt: |-
    Un compañero ejecuta este código y obtiene un error:

    ```python
    bell = QuantumCircuit(2); bell.h(0); bell.cx(0, 1); bell.measure_all()
    StatevectorEstimator().run([(bell, SparsePauliOp("ZZ"))])
    ```

    ¿Cuál es la causa?
  options:
    a: El Estimator solo acepta circuitos de un qubit, y el par de Bell tiene dos
    b: Falta transpilar el circuito a puertas nativas antes de pasarlo a un simulador de referencia
    c: 'El observable ZZ no es válido: el Estimator solo acepta observables de la forma X, Y o Z de un qubit'
    d: Los circuitos que se envían a un Estimator no deben tener medidas; las necesita el Sampler
  explanation: 'Regla básica: el Sampler necesita medidas y el Estimator no debe tenerlas, porque calcula valores esperados del estado antes de medir. Los simuladores de referencia no requieren transpilar, y SparsePauliOp acepta productos de Pauli de varios qubits.'

- id: q-qiskit-circuits-006
  prompt: ¿Para qué sirve un Parameter en un circuito de Qiskit y por qué es útil en algoritmos variacionales?
  options:
    a: Marca los qubits que el transpilador no debe tocar al optimizar el circuito
    b: 'Sustituye a las medidas: guarda el resultado de un qubit para usarlo después en una puerta'
    c: Reduce el número de qubits necesarios al comprimir varias rotaciones en una sola
    d: Deja un valor sin fijar para construir el circuito una vez y asignar ángulos distintos en cada evaluación
  explanation: Parameter, assign_parameters y ParameterVector permiten reutilizar la misma plantilla miles de veces con valores distintos, que es justo lo que hace un bucle variacional. No tiene nada que ver con proteger qubits ni con ahorrar qubits.

- id: q-qiskit-circuits-007
  prompt: En Qiskit se habla de varios niveles de circuito. ¿Qué es un circuito ISA?
  options:
    a: Un circuito que usa solo las puertas nativas y las conexiones del dispositivo, resultado de transpilar
    b: Un circuito con operaciones de alto nivel (QFT, unitarias) que se sintetizarán más tarde
    c: Un circuito sin medidas que describe únicamente el estado final que se quiere preparar
    d: Un circuito dinámico, con control de flujo sobre resultados de medidas intermedias
  explanation: 'ISA es la arquitectura del conjunto de instrucciones del dispositivo: el circuito solo contiene instrucciones de su Target. Los operadores de alto nivel pertenecen a niveles superiores y se bajan a ISA durante la transpilación.'

- id: q-qiskit-circuits-008
  prompt: Un tutorial antiguo llama a execute(circuito, backend). ¿Qué debes saber al usarlo con Qiskit actual?
  options:
    a: Sigue funcionando, pero solo con simuladores de Aer y no con dispositivos reales
    b: Sigue funcionando si se instala qiskit-terra en lugar de qiskit
    c: 'execute se eliminó en Qiskit 1.0: se transpila el circuito y se ejecuta con una primitiva'
    d: Está obsoleto pero se mantiene en 2.x con un aviso, igual que las primitivas V2 de Runtime
  explanation: execute se eliminó en 1.0 y qiskit-terra quedó retirado como distribución. El flujo actual es transpilar a un circuito ISA y ejecutar con Sampler o Estimator.

- id: q-qiskit-circuits-009
  prompt: En Qiskit 2.x, ¿cómo se aplica una puerta X al qubit 1 solo si el bit clásico medido c[0] vale 1?
  options:
    a: Con qc.x(1).c_if(c[0], 1), la condición clásica de siempre
    b: 'Con un bloque de control de flujo: with qc.if_test((c[0], 1)): qc.x(1)'
    c: Con un if de Python sobre el resultado de measure al construir el circuito
    d: Midiendo c[0] dos veces y repitiendo la puerta X mientras el valor sea 1
  explanation: Los circuitos dinámicos usan if_test, for_loop y switch. c_if se eliminó en 2.0, y un if de Python se evalúa al construir el circuito, antes de que exista ningún resultado de medida.

- id: q-qiskit-circuits-010
  prompt: Explica con tus palabras la diferencia entre measure_all(), measure(qubits, bits) y measure_active(), y di cuándo usarías cada una.
  model_answer: 'measure_all() crea por sí mismo un registro clásico llamado meas con un bit por qubit, inserta una barrera antes y mide todos los qubits: es cómodo para circuitos pequeños. measure(qubits, bits) asigna qubits concretos a bits clásicos concretos, de modo que se controla qué se mide y en qué registro queda: se usa cuando el circuito ya tiene registros propios o solo interesan algunos qubits. measure_active mide solo los qubits sobre los que hay operaciones. Un error frecuente es creer que las tres son lo mismo.'
  rubric:
  - Dice que measure_all crea sus propios bits clásicos (registro meas) y añade una barrera
  - Dice que measure(qubits, bits) asigna qubits concretos a bits concretos
  - Indica que measure_active mide solo qubits con operaciones
  - Da un criterio de uso para al menos dos de ellas

- id: q-qiskit-circuits-011
  prompt: Un circuito de Qiskit puede contener más que puertas básicas. Explica qué otras cosas puede contener y cómo se relaciona esto con el circuito ISA que acaba en el hardware.
  model_answer: 'En Qiskit un circuito es cualquier operación sobre datos cuánticos o clásicos: reinicios, medidas, control de flujo y también operadores de alto nivel como unitarias, Cliffords o transformadas de Fourier. Los niveles de abstracción se pueden mezclar y los circuitos se componen como bloques. Por eso hay varios niveles (problema, circuito abstracto, puertas de la biblioteca estándar y, al final, circuito ISA con las puertas nativas del dispositivo), y pasar de uno a otro es el trabajo de la transpilación.'
  rubric:
  - Menciona operaciones de alto nivel (unitarias, QFT, Cliffords) además de puertas
  - Menciona medidas, reinicios o control de flujo
  - Dice que los niveles de abstracción pueden mezclarse y componerse
  - Identifica el circuito ISA como el nivel final con puertas nativas y a la transpilación como el paso que lo produce

- id: q-qiskit-circuits-012
  prompt: Vas a implementar la estimación de fase (con una QFT y potencias controladas) para un dispositivo concreto. Un compañero propone escribir a mano todas las puertas nativas desde el principio para controlar el resultado. ¿Qué le aconsejas?
  model_answer: Conviene expresar el circuito al nivel más alto que tenga sentido (bloques abstractos como la QFT o las potencias controladas) y dejar la síntesis al transpilador. Qiskit retrasa deliberadamente la síntesis de operaciones de alto nivel hasta la transpilación, de modo que puede sintetizarlas directamente para el dispositivo sin pasos intermedios que alarguen la profundidad. Solo bajaría a puertas concretas donde necesite control sobre el resultado. Al final se inspecciona el circuito transpilado con las mismas herramientas (profundidad, recuento de puertas) para comprobar que el resultado es razonable.
  rubric:
  - Recomienda usar bloques de alto nivel y diferir la síntesis al transpilador
  - Explica que así se evitan pasos intermedios que alargan la profundidad
  - Reserva el bajar a puertas concretas para cuando se necesita control sobre el resultado
  - Menciona que el circuito transpilado se puede inspeccionar y medir como cualquier otro

- id: q-qiskit-circuits-013
  prompt: Tu bucle variacional reconstruye el circuito con ángulos nuevos y lo transpila a optimization_level=3 en cada una de las 500 iteraciones, y la mayor parte del tiempo se va en compilar. ¿Cómo lo rediseñas?
  model_answer: Construiría el ansatz una sola vez con Parameter o ParameterVector, lo transpilaría una vez a optimization_level=3 y en cada iteración solo asignaría valores (assign_parameters o pasando los valores al PUB de la primitiva). El observable se lleva al layout con apply_layout una sola vez. Así el coste de compilación se paga una vez y no 500, y la interfaz de primitivas ya contempla varias asignaciones de parámetros para una misma plantilla.
  rubric:
  - Propone parametrizar el circuito con Parameter/ParameterVector
  - Propone transpilar una sola vez y solo asignar valores en cada iteración
  - Menciona aplicar apply_layout al observable tras transpilar
  - Justifica que el coste de compilar se paga una vez y no en cada iteración

