  qubits-and-circuits: "Qubits, puertas y circuitos"
  quantum-algorithms: "Algoritmos cuánticos"
  qiskit-programming: "Programación con Qiskit"
  quantum-hardware: "Cómo se construyen los ordenadores cuánticos"
  error-correction: "Corrección de errores y tolerancia a fallos"
