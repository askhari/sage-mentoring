- id: complex-plane-unit-circle
  alt: "Plano complejo con el eje real horizontal y el imaginario vertical. Una flecha azul va del origen al punto z = a + bi; su longitud es el módulo r y forma un ángulo φ con el eje real. Líneas discontinuas marcan a y b en los ejes. Una circunferencia unidad discontinua pasa por 1, i, −1 y −i, y corta la flecha en un punto naranja rotulado e^(iφ) = cos φ + i sen φ."
  caption: "Un número complejo en forma cartesiana (a + bi) y polar (r, φ). Con el mismo ángulo y módulo 1 se obtiene e^(iφ), un punto de la circunferencia unidad. Diagrama propio."

- id: orthonormal-projection
  alt: "Plano con los ejes estándar en gris y una base ortonormal verde, e₁ y e₂, girada respecto a ellos. Un vector azul v sale del origen. Dos flechas naranjas discontinuas, ⟨e₁, v⟩ e₁ a lo largo de e₁ y después ⟨e₂, v⟩ e₂ a lo largo de e₂, llegan a la punta de v y forman un ángulo recto. Arriba aparecen las fórmulas v = ⟨e₁, v⟩ e₁ + ⟨e₂, v⟩ e₂ y ‖v‖² = |⟨e₁, v⟩|² + |⟨e₂, v⟩|²."
  caption: "En una base ortonormal, las coordenadas de un vector son sus productos interiores con los vectores de la base, y el cuadrado de su norma es la suma de los cuadrados de esas coordenadas (Pitágoras). Diagrama propio, en el plano real para que se pueda dibujar."

- id: kronecker-layout
  alt: "Izquierda: una matriz de 4×4 dividida en cuatro bloques de colores de 2×2; el bloque de la fila i y la columna j contiene a_ij multiplicado por cada entrada de B. Derecha: un vector de cuatro entradas en dos bloques; el primero contiene α₁·β₁ y α₁·β₂, y el segundo α₂·β₁ y α₂·β₂, rotulados a la derecha como |00⟩, |01⟩, |10⟩ y |11⟩."
  caption: "El producto de Kronecker coloca una copia de B (o de β) por cada entrada de A (o de α). En los vectores, las entradas quedan en el orden 00, 01, 10, 11, que es el de los estados de base de dos qubits. Diagrama propio."

- id: mach-zehnder-amplitudes
  alt: "Esquema de un interferómetro de Mach-Zehnder. Un fotón entra por la izquierda con amplitudes (1, 0) en el divisor 1, que lo reparte en una rama superior y una inferior con amplitudes (1/√2, 1/√2). Dos espejos llevan las ramas al divisor 2; en la rama inferior hay un desfasador δ. Con δ = 0 la salida es (1, 0): el detector D0 recibe el fotón con probabilidad 1 y D1 con probabilidad 0. Al pie: con desfase δ, P(D0) = cos²(δ/2) y P(D1) = sen²(δ/2)."
  caption: "Un fotón que interfiere consigo mismo. Los divisores se modelan como la matriz de Hadamard y el desfasador como diag(1, e^(iδ)); las amplitudes y las probabilidades están calculadas, no dibujadas a ojo. Diagrama propio."

- id: stern-gerlach-zxz
  alt: "Tres cajas de Stern-Gerlach en serie, z, x y z. De la primera sale un 50 % con + y un 50 % con −, que se bloquea. La segunda, orientada en x, separa el haz en 50 % + (bloqueado) y 50 % −. La tercera, otra vez en z, vuelve a separar 50 % + y 50 % −. Una nota indica que los porcentajes son del haz que entra en cada caja."
  caption: "Medir x borra el resultado de la medida z anterior: los átomos que salen de la caja x vuelven a repartirse a partes iguales en z. Diagrama propio; los porcentajes salen de la regla de Born con |z;+⟩ = (|x;+⟩ + |x;−⟩)/√2."

- id: dephasing-bloch-density
  alt: "Izquierda: la matriz densidad de |+⟩ para Γt = 0, 1 y 3. Las entradas diagonales valen siempre 0,50 (en azul) y las de fuera de la diagonal bajan de 0,50 a 0,18 y a 0,02 (en naranja, cada vez más claro). Derecha: corte x–z de la bola de Bloch. El círculo exterior se convierte en elipses cada vez más estrechas alrededor del eje z, y el punto del estado se desplaza desde el borde del eje x hacia el centro."
  caption: "Con el desfase (dephasing), las poblaciones no cambian y las coherencias decaen como e^(−Γt). En la esfera de Bloch, las componentes x e y se encogen y la bola se aplasta hacia el eje z. Diagrama propio, valores calculados."

- id: bloch-sphere
  alt: "Esfera de Bloch con los ejes x, y, z y el ecuador. |0⟩ está en el polo norte, |1⟩ en el polo sur, |+⟩ y |−⟩ en los extremos del eje x, y |+i⟩ y |−i⟩ en los del eje y; los puntos de la cara oculta se dibujan huecos. Una flecha azul marca un estado general |ψ⟩, con el ángulo polar θ medido desde el eje z y el ángulo acimutal φ medido en el ecuador desde el eje x. Al pie: |ψ⟩ = cos(θ/2)|0⟩ + e^(iφ) sen(θ/2)|1⟩."
  caption: "Cada estado puro de un qubit es un punto de la esfera de Bloch, fijado por dos ángulos. Los estados ortogonales quedan en puntos opuestos. Diagrama propio; las posiciones están calculadas con r = (sen θ cos φ, sen θ sen φ, cos θ)."

- id: bell-circuit
  alt: "Circuito de dos cables, q₀ arriba y q₁ abajo, ambos empezando en |0⟩. Primero una puerta H sobre q₀ y después una CNOT con control en q₀ y objetivo en q₁. Tres líneas discontinuas marcan el estado en cada momento: |00⟩ al inicio, (|00⟩ + |10⟩)/√2 tras H y (|00⟩ + |11⟩)/√2 tras la CNOT."
  caption: "Dos puertas bastan para crear un estado de Bell. Los kets se escriben con q₀ a la izquierda; Qiskit usa el orden contrario. Diagrama propio; los estados están calculados aplicando las matrices."

- id: teleportation-circuit
  alt: "Circuito de tres cables: Q con el estado |ψ⟩ que se quiere enviar, y A y B, que comparten el par |φ⁺⟩. En la zona de Alice hay una CNOT de Q a A, una H sobre Q y dos medidas: la de A da el bit a y la de Q da el bit b. Dos líneas clásicas dobles llevan a y b a la zona de Bob, donde controlan una puerta X y una puerta Z sobre B; a la salida, B tiene |ψ⟩. Debajo, una tabla con el estado de B antes de corregir para cada par de resultados: α|0⟩ + β|1⟩ (sin corrección), α|0⟩ − β|1⟩ (Z), β|0⟩ + α|1⟩ (X) y −β|0⟩ + α|1⟩ (X y después Z)."
  caption: "Teleportación: Alice mide y envía dos bits clásicos, y Bob aplica X^a y después Z^b. Sin esos dos bits, el qubit de Bob no contiene información. Diagrama propio; la tabla está calculada aplicando X^a Z^b a α|0⟩ + β|1⟩."

- id: chsh-game
  alt: "Un árbitro envía el bit x a Alice y el bit y a Bob, y cada uno devuelve una respuesta, a y b. Una pared discontinua entre Alice y Bob indica que no se comunican; una línea punteada verde indica que pueden compartir un par entrelazado. Abajo: ganan si a ⊕ b = x ∧ y; la mejor estrategia clásica gana el 75 % de las veces y la cuántica, cos²(π/8) ≈ 85,4 %."
  caption: "El juego CHSH. Diagrama propio; el 75 % se obtiene probando todas las estrategias clásicas deterministas y el 85,4 % es cos²(π/8)."

- id: deutsch-jozsa-circuit
  alt: "Circuito de dos cables. Arriba, un registro de n qubits en |0ⁿ⟩; abajo, un qubit auxiliar en |1⟩. Ambos pasan por puertas de Hadamard (H⊗ⁿ arriba, H abajo), luego por una caja U_f que abarca los dos y que se marca como una sola consulta; después, otra capa H⊗ⁿ en el registro superior y una medida. Debajo: si el resultado es 0ⁿ la función es constante; en otro caso, equilibrada."
  caption: "Deutsch-Jozsa: una sola consulta al oráculo distingue constante de equilibrada. Diagrama propio."

- id: simon-circuit
  alt: "Registro superior de n qubits en |0ⁿ⟩ con H⊗ⁿ, una caja U_f, otra H⊗ⁿ y una medida que da un y con y · s = 0 (mod 2). El registro inferior de m qubits en |0ᵐ⟩ solo entra en U_f. Una línea clásica lleva y a un recuadro verde, «Paso clásico»: repetir unas n veces (n + 10 en Watrous) y resolver el sistema lineal módulo 2 para obtener s."
  caption: "Algoritmo de Simon: cada ejecución cuántica da una ecuación lineal sobre s; el resto es álgebra lineal clásica módulo 2. Diagrama propio."

- id: qft-circuit
  alt: "Cuatro cables con entradas |k₁⟩ a |k₄⟩. En el primero, una H y tres puertas de fase R₂, R₃ y R₄, controladas por los qubits 2, 3 y 4; en el segundo, H, R₂ y R₃, controladas por los qubits 3 y 4; en el tercero, H y R₂, controlada por el 4; en el cuarto, solo H. Al final, dos swaps intercambian los qubits 1 y 4 y los qubits 2 y 3. A la derecha, el estado de salida de cada cable, de arriba abajo: |0⟩ + e^(2πi·0.k₄)|1⟩, |0⟩ + e^(2πi·0.k₃k₄)|1⟩, |0⟩ + e^(2πi·0.k₂k₃k₄)|1⟩ y |0⟩ + e^(2πi·0.k₁k₂k₃k₄)|1⟩, sin normalizar. Nota: 10 puertas y 2 swaps para n = 4."
  caption: "QFT de 4 qubits en escalera, con R_s = diag(1, e^(2πi/2^s)). Diagrama propio; las fases de salida se calculan a partir de la forma producto con fracciones binarias, y el número de puertas, n(n+1)/2, es cálculo propio (las fuentes dan la cota de como mucho n²)."

- id: phase-estimation-circuit
  alt: "Varios qubits de control en |0⟩, cada uno con una Hadamard (se dibujan tres, con puntos suspensivos para el resto), y un registro inferior de n qubits en |ψ⟩. El primer control activa una U, el segundo una U², y el último una U^(2^(m−1)), todas sobre |ψ⟩. Una línea discontinua marca el estado intermedio de los controles, 2^(−m/2) Σₓ e^(2πixθ)|x⟩. Luego una caja QFT⁻¹ sobre los controles y medidas que dan y, con θ ≈ y/2ᵐ. El registro |ψ⟩ no cambia. Debajo: U|ψ⟩ = e^(2πiθ)|ψ⟩."
  caption: "Estimación de fase: el retroceso de fase escribe θ en las fases de los controles y la QFT inversa lo convierte en un número medible. Diagrama propio."

- id: shor-pipeline
  alt: "Cuatro bloques de izquierda a derecha. Clásico: elegir a al azar en {2, …, N − 1} y comprobar si mcd(a, N) > 1 (si es así, ya es un factor). Cuántico: estimación de fase de M_a: |x⟩ → |ax mod N⟩ sobre |1⟩, que da y/2ᵐ ≈ k/r. Clásico: fracciones continuas → k/r irreducible; el mcm de varias ejecuciones da r. Clásico: si r es par, d = mcd(a^(r/2) − 1, N); si 1 < d < N, es un factor. Una flecha de vuelta indica que, si falla (r impar o d trivial), se prueba otro a; el éxito es al menos 1/2 por intento."
  caption: "Shor como tubería: solo el cálculo del orden es cuántico. Diagrama propio."

- id: grover-rotation
  alt: "Plano con eje horizontal |A₀⟩ (no soluciones) y eje vertical |A₁⟩ (soluciones). El estado inicial |u⟩ forma un ángulo θ con |A₀⟩; su reflejo respecto a |A₀⟩, Z_f|u⟩, aparece discontinuo por debajo del eje. Un arco marca el giro de 2θ hasta el estado tras una iteración. Hay flechas para t = 1, 2, 3 y 4; la de t = 4 queda casi sobre |A₁⟩. Arriba: N = 40, s = 1, θ = arcsin √(s/N) ≈ 9,1°. Abajo: con t = 4 la probabilidad de éxito es sin²(9θ) ≈ 0,980."
  caption: "Cada iteración de Grover son dos reflexiones, que equivalen a girar 2θ; tras t iteraciones el ángulo es (2t+1)θ. Diagrama propio; ángulos y probabilidad calculados para N = 40 y una solución."

- id: grover-amplitudes
  alt: "Tres gráficos de barras con las 8 amplitudes, una por elemento del 0 al 7; el elemento 5 está marcado. 1: tras H⊗ⁿ todas valen +0,35. 2: tras el oráculo la marcada vale −0,35, y una línea discontinua marca la media. 3: tras la difusión, la marcada sube a +0,88 y las demás bajan a +0,18. Nota: la probabilidad de la marcada pasa de 0,125 a 0,781."
  caption: "La difusión invierte cada amplitud respecto a la media: v → 2·media − v. Diagrama propio; amplitudes calculadas exactamente para N = 8."

- id: trotter-steps
  alt: "Arriba, una barra única «A + B» representa la evolución exacta e^(−i(A+B)t). Debajo, la misma duración partida en r = 4 pasos, cada uno con un tramo A seguido de un tramo B, que representa (e^(−iAt/r) e^(−iBt/r))^r; una flecha marca la duración de un paso, t/r. Nota: si A y B no conmutan, cada paso comete un error de orden (t/r)² debido a [A, B], y al aumentar r el error total disminuye."
  caption: "Fórmula de producto de Trotter: se alternan evoluciones cortas con cada término. Diagrama propio."

- id: complexity-classes
  alt: "Una elipse grande, PSPACE, contiene dos elipses que se solapan: BQP a la izquierda y NP a la derecha. Dentro de BQP está BPP, que corta el borde de NP, y dentro de BPP está P, en la zona común con NP. Un punto, «factorización», está en la zona común de BQP y NP, fuera de BPP. En la parte de NP fuera de BQP: NP-completos (SAT, viajante…). Notas: demostrado P ⊆ BPP ⊆ BQP ⊆ PSPACE; creencia no demostrada: BQP y NP son incomparables y los NP-completos quedan fuera de BQP; la factorización está en BQP y no se sabe si está en BPP."
  caption: "Inclusiones conocidas y creídas entre clases. Diagrama propio, según el diagrama de Venn de Shor (MIT, L17) y De Wolf §13.2. Que la factorización (como problema de decisión) está en NP se deduce de la definición de NP: un factor sirve de testigo comprobable."

- id: kem-flow
  alt: "Dos columnas, Alicia y Bernardo. Alicia ejecuta KeyGen(), que da ek (pública) y dk (privada), y envía ek por un canal público. Bernardo ejecuta Encaps(ek), que da una clave K y un texto cifrado c, y envía c. Alicia ejecuta Decaps(dk, c) y obtiene K. Abajo: ambos tienen la misma clave K para cifrado simétrico (p. ej. AES)."
  caption: "Mecanismo de encapsulación de claves (KEM), como ML-KEM de FIPS 203. Diagrama propio."

- id: transpiler-stages
  alt: "Cadena horizontal: circuito abstracto, seis etapas (init: puertas de 3 o más qubits a puertas de 1 y 2; layout: qubits virtuales a físicos; routing: inserta SWAP donde no hay acoplamiento; translation: a las puertas nativas; optimization: simplifica y repite hasta una condición; scheduling: temporiza, opcional, por ejemplo desacoplo dinámico) y circuito ISA ejecutable. Debajo, el Target del backend (puertas nativas, conectividad, duraciones) alimenta las etapas de layout a scheduling."
  caption: "Etapas de los gestores de pases predefinidos de Qiskit, según la guía de transpilación de la documentación de Qiskit. Diagrama propio."

- id: layout-routing-swap
  alt: "Izquierda: anillo de 12 qubits físicos (0 a 4 arriba, 5 y 6 como puentes laterales, 7 a 11 abajo). Los qubits virtuales a y b están en los físicos 0 y 2, que no están acoplados; el camino 0-1-2 está resaltado. Derecha arriba: el circuito lógico, un CX de 0 a 2, una puerta de dos qubits. Derecha abajo: tras el routing, un SWAP entre 0 y 1 y después un CX de 1 a 2; como un SWAP son tres CX, quedan cuatro puertas de dos qubits."
  caption: "Routing: un CX entre qubits no acoplados se resuelve con un SWAP, que cuesta tres CX. El mapa es un fragmento al estilo de la red heavy-hex de IBM. Diagrama propio."

- id: variational-loop
  alt: "Arriba, una vez: ansatz U(θ) y observable H (SparsePauliOp), transpilados a ISA. Debajo, el bucle de cada iteración: el Estimator (QPU o simulador) prepara |ψ(θ)⟩ y estima ⟨ψ(θ)|H|ψ(θ)⟩; devuelve C(θ) al optimizador clásico (COBYLA, SPSA…), que propone un θ nuevo y lo devuelve al Estimator. Cuando converge, sale θ* con C(θ*), una cota superior de la energía mínima."
  caption: "Bucle híbrido cuántico-clásico de un algoritmo variacional (VQE, QAOA). Diagrama propio."

- id: zne-extrapolation
  alt: "Gráfico de ⟨ZZZZ⟩ frente al factor de ruido λ (cada CX repetido λ veces). Tres puntos medidos: 0,940 en λ = 1, 0,834 en λ = 3 y 0,739 en λ = 5. Un ajuste lineal extrapola a 0,988 en λ = 0 y un ajuste exponencial a 0,998; la línea del valor ideal está en 1."
  caption: "Extrapolación a ruido cero del caso trabajado: GHZ de 4 qubits con ruido despolarizante del 2 % por CX, simulado con Qiskit Aer (una ejecución). Diagrama propio."

- id: t1-t2-decay
  alt: "Dos gráficas frente al tiempo de 0 a 300 µs. Izquierda: la población de |1⟩ cae como una exponencial con T1 = 85 µs. Derecha: una señal de Ramsey que oscila con una envolvente que decae con T2* ≈ 95 µs, y la señal con eco de Hahn, que decae más despacio, con T2E = 120 µs; una línea vertical discontinua en 170 µs marca la cota 2·T1."
  caption: "Relajación (T1) y desfase (T2*, T2E) de un mismo transmon, con las cifras de Krantz et al. 2019; la frecuencia de las franjas de Ramsey es ilustrativa. Diagrama propio."

- id: transmon-levels
  alt: "Izquierda: potencial parabólico de un oscilador armónico con cuatro niveles equiespaciados, todas las transiciones a 5,0 GHz. Derecha: potencial coseno de un transmon con cuatro niveles cuyas transiciones bajan: f01 ≈ 5,0 GHz, f12 ≈ 4,8 GHz y f23 ≈ 4,6 GHz; la anarmonicidad es α ≈ −200 MHz, y los niveles |0⟩ y |1⟩ forman el qubit."
  caption: "Por qué el transmon es un qubit: su anarmonicidad permite excitar solo la transición 0–1. Niveles con la aproximación habitual para EJ ≫ EC, ajustada a f01 = 5 GHz y α = −200 MHz (Kjaergaard et al. 2020). Diagrama propio."

- id: rydberg-blockade
  alt: "Panel A: dos átomos en pinzas ópticas, con niveles |1⟩, |0⟩ y el de Rydberg |r⟩. El átomo de control está en |r⟩ y desplaza el nivel de Rydberg del objetivo, de modo que el láser ya no es resonante y el objetivo no puede excitarse. Panel B: la puerta CZ en tres pulsos sobre dos líneas: π en el control, 2π en el objetivo y π en el control. Texto: el láser acopla |0⟩ con |r⟩; |11⟩ no cambia y |00⟩, |01⟩ y |10⟩ toman fase −1, que es una CZ salvo una fase global."
  caption: "Bloqueo de Rydberg y puerta CZ, según el recuadro de Henriet et al. 2020 (autores de Pasqal). Esquema propio, sin escala."

- id: advantage-timeline
  alt: "Línea temporal con dos carriles. Arriba, reclamaciones cuánticas: Sycamore 2019 (53 qubits, 20 ciclos, 200 s frente a 10 000 años, extrapolación de los autores); Jiuzhang 2020 (muestreo de bosones, 76 clics, 200 s frente a 2500 millones de años, estimación de los autores); más tarde, el RCS de Google con 103 qubits y 40 capas, y el experimento de IBM de Ising con patada de 127 qubits. Abajo, respuestas clásicas: IBM propone guardar el estado en Summit (2019); Pan, Chen y Zhang 2022, unas 15 h en 512 GPU con fidelidad estimada de 0,0037 frente a 0,002; y el experimento de IBM reproducido con redes tensoriales y dinámica de Pauli."
  caption: "El ida y vuelta entre reclamaciones de ventaja cuántica y simulaciones clásicas, según Arute et al. 2019, Zhong et al. 2020, Pan et al. 2022 y Eisert y Preskill (2025-26). Diagrama propio."

- id: platform-gate-time-vs-error
  alt: "Dispersión en escala logarítmica del tiempo de la puerta de dos qubits (de 1 ns a 1 ms) frente a su error (de 0,05 % a 10 %). Superconductores: Sycamore 2019, 12 ns con 0,30 % aislada y 0,60 % en paralelo; CZ 2020, 60 ns y 0,3 %. Iones (2019): 30 µs y 0,09 %, 100 µs y 0,1 %, y 1,6 µs y 0,2 %. Átomos neutros: 1 µs y 5,9 % (2018), y una barra para 2024-25 con 0,29 % y puertas de menos de 1 µs. Espines en silicio 2022: 40 ns y 0,19 %. Una banda gris entre 0,1 % y 0,5 % marca el estado de 2025 según Eisert y Preskill."
  caption: "Tiempo frente a error de las puertas de dos qubits por plataforma, con cifras de años y dispositivos distintos: no es un ranking. Datos de Arute et al. 2019, Kjaergaard et al. 2020, Bruzewicz et al. 2019, Henriet et al. 2020, Saffman 2025, Stano y Loss 2022 y Eisert y Preskill 2025-26. Diagrama propio."
