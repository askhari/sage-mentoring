<text x='1025.0' y='102.0' font-size='15' fill='#1f6fb2' text-anchor='middle' font-weight='bold'>π</text>
<text x='580.0' y='260.0' font-size='13' fill='#222222' text-anchor='start' font-weight='normal'>El láser acopla |0⟩ con |r⟩ (convención de Henriet et al.).</text>
<text x='580.0' y='286.0' font-size='13' fill='#222222' text-anchor='start' font-weight='normal'>1. π en el control: |0⟩ → |r⟩</text>
<text x='580.0' y='312.0' font-size='13' fill='#222222' text-anchor='start' font-weight='normal'>2. 2π en el objetivo: vuelta completa |0⟩ → |r⟩ → |0⟩ (fase −1),</text>
<text x='580.0' y='338.0' font-size='13' fill='#222222' text-anchor='start' font-weight='normal'>    salvo si el control está en |r⟩: bloqueado, no hace nada</text>
<text x='580.0' y='364.0' font-size='13' fill='#222222' text-anchor='start' font-weight='normal'>3. π en el control: |r⟩ → |0⟩</text>
<text x='580.0' y='400.0' font-size='13' fill='#2e8b57' text-anchor='start' font-weight='normal'>|11⟩ no cambia; |00⟩, |01⟩ y |10⟩ toman fase −1: diag(−1, −1, −1, 1) = CZ salvo una fase global</text>
<text x='590.0' y='446.0' font-size='12' fill='#888888' text-anchor='middle' font-weight='normal'>Esquema según Henriet et al. 2020 (Pasqal). El estado de Rydberg tiene un momento dipolar ~1000 veces mayor que el fundamental.</text>
