<rect x='30.0' y='90.0' width='230.0' height='120.0' rx='10' stroke='#2e8b57' fill='#e3f2e8' stroke-width='1.8'/><text x='145.0' y='124.9' font-size='13' fill='#2e8b57' text-anchor='middle' font-weight='bold'>clásico</text><text x='145.0' y='145.1' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>Elegir a al azar</text><text x='145.0' y='165.4' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>en {2, …, N − 1}</text><text x='145.0' y='185.6' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>¿mcd(a, N) &gt; 1?</text>
<rect x='320.0' y='90.0' width='230.0' height='120.0' rx='10' stroke='#c2571a' fill='#fde3d3' stroke-width='1.8'/><text x='435.0' y='124.9' font-size='13' fill='#c2571a' text-anchor='middle' font-weight='bold'>cuántico</text><text x='435.0' y='145.1' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>Estimación de fase</text><text x='435.0' y='165.4' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>de M_a: |x⟩ → |ax mod N⟩</text><text x='435.0' y='185.6' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>sobre |1⟩ → y/2ᵐ ≈ k/r</text>
<rect x='610.0' y='90.0' width='230.0' height='120.0' rx='10' stroke='#2e8b57' fill='#e3f2e8' stroke-width='1.8'/><text x='725.0' y='124.9' font-size='13' fill='#2e8b57' text-anchor='middle' font-weight='bold'>clásico</text><text x='725.0' y='145.1' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>Fracciones continuas</text><text x='725.0' y='165.4' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>→ k/r irreducible;</text><text x='725.0' y='185.6' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>mcm de varias → r</text>
<rect x='900.0' y='90.0' width='230.0' height='120.0' rx='10' stroke='#2e8b57' fill='#e3f2e8' stroke-width='1.8'/><text x='1015.0' y='124.9' font-size='13' fill='#2e8b57' text-anchor='middle' font-weight='bold'>clásico</text><text x='1015.0' y='145.1' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>Si r es par:</text><text x='1015.0' y='165.4' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>d = mcd(a^(r/2) − 1, N)</text><text x='1015.0' y='185.6' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>¿1 &lt; d &lt; N?</text>
