<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 800' width='1000' height='800' font-family='Helvetica, Arial, sans-serif'>
<rect width='100%' height='100%' fill='white'/>
<defs><marker id='arrow-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222222'/></marker><marker id='arrow-a1' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f6fb2'/></marker><marker id='arrow-a2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c2571a'/></marker><marker id='arrow-a3' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e8b57'/></marker><marker id='arrow-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#888888'/></marker></defs>
<line x1='280.0' y1='600.0' x2='810.0' y2='600.0' stroke='#222222' stroke-width='1.5' marker-end='url(#arrow-ink)'/>
<line x1='300.0' y1='640.0' x2='300.0' y2='90.0' stroke='#222222' stroke-width='1.5' marker-end='url(#arrow-ink)'/>
<text x='800.0' y='628.0' font-size='16' fill='#222222' text-anchor='end' font-weight='normal'>|A₀⟩ (no soluciones)</text>
<text x='286.0' y='100.0' font-size='16' fill='#222222' text-anchor='end' font-weight='normal'>|A₁⟩ (soluciones)</text>
<path d='M760.6,693.4 A470,470 0 0 0 276.5,130.6' stroke='#888888' fill='none' stroke-width='1' stroke-dasharray='3 5'/>
<line x1='300.0' y1='600.0' x2='764.1' y2='525.7' stroke='#1f6fb2' stroke-width='3' marker-end='url(#arrow-a1)'/>
<text x='778.1' y='531.7' font-size='17' fill='#1f6fb2' text-anchor='start' font-weight='bold'>|u⟩</text>
<line x1='300.0' y1='600.0' x2='764.1' y2='674.3' stroke='#c2571a' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#arrow-a2)'/>
<text x='778.1' y='684.3' font-size='15' fill='#c2571a' text-anchor='start' font-weight='normal'>Z_f|u⟩</text>
<path d='M410.0,600.0 A110,110 0 0 0 408.6,582.6' stroke='#222222' fill='none' stroke-width='1.4'/>
<text x='427.6' y='589.8' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>θ</text>
<line x1='300.0' y1='600.0' x2='717.7' y2='384.5' stroke='#1f6fb2' stroke-width='1.8' marker-end='url(#arrow-a1)'/>
<text x='747.9' y='368.9' font-size='15' fill='#1f6fb2' text-anchor='middle' font-weight='normal'>t = 1</text>
<line x1='300.0' y1='600.0' x2='629.5' y2='264.8' stroke='#1f6fb2' stroke-width='1.8' marker-end='url(#arrow-a1)'/>
<text x='653.3' y='240.6' font-size='15' fill='#1f6fb2' text-anchor='middle' font-weight='normal'>t = 2</text>
<line x1='300.0' y1='600.0' x2='508.4' y2='178.7' stroke='#1f6fb2' stroke-width='1.8' marker-end='url(#arrow-a1)'/>
<text x='523.4' y='148.2' font-size='15' fill='#1f6fb2' text-anchor='middle' font-weight='normal'>t = 3</text>
<line x1='300.0' y1='600.0' x2='366.4' y2='134.7' stroke='#2e8b57' stroke-width='2.4' marker-end='url(#arrow-a3)'/>
<text x='371.2' y='101.1' font-size='15' fill='#2e8b57' text-anchor='middle' font-weight='bold'>t = 4</text>
<path d='M596.2,552.6 A300,300 0 0 0 566.6,462.4' stroke='#c2571a' fill='none' stroke-width='2' marker-end='url(#arrow-a2)'/>
<text x='613.5' y='497.0' font-size='16' fill='#c2571a' text-anchor='middle' font-weight='bold'>2θ</text>
<text x='500.0' y='40.0' font-size='15' fill='#222222' text-anchor='middle' font-weight='normal'>N = 40, s = 1: θ = arcsin √(s/N) ≈ 9,1°</text>
<text x='500.0' y='750.0' font-size='14' fill='#888888' text-anchor='middle' font-weight='normal'>Una iteración = reflexión respecto a |A₀⟩ (Z_f) y luego respecto a |u⟩ → giro de 2θ</text>
<text x='500.0' y='775.0' font-size='14' fill='#888888' text-anchor='middle' font-weight='normal'>Tras t iteraciones: ángulo (2t+1)θ; con t = 4 la probabilidad de éxito es sin²((2t+1)θ) ≈ 0,980</text>
</svg>
