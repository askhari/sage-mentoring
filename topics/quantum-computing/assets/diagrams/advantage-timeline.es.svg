<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1220 500' width='1220' height='500' font-family='Helvetica, Arial, sans-serif'>
<rect width='100%' height='100%' fill='white'/>
<defs><marker id='arrow-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222222'/></marker><marker id='arrow-a1' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f6fb2'/></marker><marker id='arrow-a2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c2571a'/></marker><marker id='arrow-a3' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e8b57'/></marker><marker id='arrow-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#888888'/></marker></defs>
<line x1='60.0' y1='285.0' x2='1180.0' y2='285.0' stroke='#222222' stroke-width='2' marker-end='url(#arrow-ink)'/>
<line x1='150.0' y1='279.0' x2='150.0' y2='291.0' stroke='#222222' stroke-width='2'/>
<text x='150.0' y='311.0' font-size='14' fill='#222222' text-anchor='middle' font-weight='bold'>2019</text>
<line x1='410.0' y1='279.0' x2='410.0' y2='291.0' stroke='#222222' stroke-width='2'/>
<text x='410.0' y='311.0' font-size='14' fill='#222222' text-anchor='middle' font-weight='bold'>2020</text>
<line x1='570.0' y1='279.0' x2='570.0' y2='291.0' stroke='#222222' stroke-width='2'/>
<text x='570.0' y='311.0' font-size='14' fill='#222222' text-anchor='middle' font-weight='bold'>2021</text>
<line x1='720.0' y1='279.0' x2='720.0' y2='291.0' stroke='#222222' stroke-width='2'/>
<text x='720.0' y='311.0' font-size='14' fill='#222222' text-anchor='middle' font-weight='bold'>2022</text>
<line x1='980.0' y1='279.0' x2='980.0' y2='291.0' stroke='#222222' stroke-width='2'/>
<text x='980.0' y='311.0' font-size='14' fill='#222222' text-anchor='middle' font-weight='bold'>más tarde</text>
<text x='70.0' y='60.0' font-size='15' fill='#1f6fb2' text-anchor='start' font-weight='bold'>Reclamaciones cuánticas</text>
<text x='70.0' y='445.0' font-size='15' fill='#c2571a' text-anchor='start' font-weight='bold'>Respuestas clásicas</text>
<rect x='35.0' y='100.0' width='230.0' height='80.0' rx='10' stroke='#1f6fb2' fill='#dbe9f6' stroke-width='1.8'/><text x='150.0' y='127.0' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>Sycamore (Google)</text><text x='150.0' y='144.6' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>53 qubits, 20 ciclos</text><text x='150.0' y='162.1' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>200 s frente a 10 000 años*</text>
<line x1='150.0' y1='180.0' x2='150.0' y2='277.0' stroke='#1f6fb2' stroke-width='1.4' stroke-dasharray='4 3'/>
<rect x='295.0' y='100.0' width='230.0' height='80.0' rx='10' stroke='#1f6fb2' fill='#dbe9f6' stroke-width='1.8'/><text x='410.0' y='127.0' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>Jiuzhang (USTC)</text><text x='410.0' y='144.6' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>muestreo de bosones, 76 clics</text><text x='410.0' y='162.1' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>200 s frente a 2500 millones de años*</text>
<line x1='410.0' y1='180.0' x2='410.0' y2='277.0' stroke='#1f6fb2' stroke-width='1.4' stroke-dasharray='4 3'/>
<rect x='730.0' y='80.0' width='230.0' height='64.0' rx='10' stroke='#1f6fb2' fill='#dbe9f6' stroke-width='1.8'/><text x='845.0' y='107.8' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>Google: RCS con 103 qubits</text><text x='845.0' y='125.3' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>y 40 capas de puertas de 2 qubits</text>
<rect x='990.0' y='80.0' width='200.0' height='64.0' rx='10' stroke='#1f6fb2' fill='#dbe9f6' stroke-width='1.8'/><text x='1090.0' y='107.8' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>IBM: Ising con patada,</text><text x='1090.0' y='125.3' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>127 qubits («utilidad»)</text>
<line x1='980.0' y1='150.0' x2='980.0' y2='277.0' stroke='#1f6fb2' stroke-width='1.4' stroke-dasharray='4 3'/>
<rect x='35.0' y='340.0' width='230.0' height='80.0' rx='10' stroke='#c2571a' fill='#fde3d3' stroke-width='1.8'/><text x='150.0' y='367.0' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>IBM: guardar el estado</text><text x='150.0' y='384.6' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>en RAM y disco de Summit</text><text x='150.0' y='402.1' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>(sin cifra en Pan et al.)</text>
<line x1='150.0' y1='319.0' x2='150.0' y2='340.0' stroke='#c2571a' stroke-width='1.4' stroke-dasharray='4 3'/>
<rect x='605.0' y='340.0' width='230.0' height='80.0' rx='10' stroke='#c2571a' fill='#fde3d3' stroke-width='1.8'/><text x='720.0' y='367.0' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>Pan, Chen y Zhang</text><text x='720.0' y='384.6' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>~15 h en 512 GPU; fidelidad</text><text x='720.0' y='402.1' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>estimada 0,0037 frente a 0,002</text>
<line x1='720.0' y1='319.0' x2='720.0' y2='340.0' stroke='#c2571a' stroke-width='1.4' stroke-dasharray='4 3'/>
<line x1='250.0' y1='180.0' x2='700.0' y2='338.0' stroke='#c2571a' stroke-width='1.6' marker-end='url(#arrow-a2)'/>
<rect x='990.0' y='340.0' width='200.0' height='64.0' rx='10' stroke='#c2571a' fill='#fde3d3' stroke-width='1.8'/><text x='1090.0' y='367.8' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>reproducido pronto con redes</text><text x='1090.0' y='385.3' font-size='13' fill='#222222' text-anchor='middle' font-weight='normal'>tensoriales y dinámica de Pauli</text>
<line x1='1090.0' y1='146.0' x2='1090.0' y2='338.0' stroke='#c2571a' stroke-width='1.6' marker-end='url(#arrow-a2)'/>
<text x='1070.0' y='398.0' font-size='12' fill='#888888' text-anchor='middle' font-weight='normal'>recogido por Eisert y Preskill (preprint 2025-26), sin fecha exacta</text>
<text x='610.0' y='490.0' font-size='13' fill='#888888' text-anchor='middle' font-weight='normal'>* extrapolación o estimación de los propios autores. La frontera se mueve: cada reclamación invita a mejores algoritmos clásicos.</text>
</svg>
