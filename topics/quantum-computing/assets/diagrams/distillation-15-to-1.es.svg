<text x='20.0' y='350.0' font-size='13' fill='#c2571a' text-anchor='start' font-weight='normal'>15 estados T ruidosos, error ε</text>
<text x='70.0' y='40.0' font-size='14' fill='#222222' text-anchor='middle' font-weight='bold'>ronda 1</text>
<rect x='300.0' y='120.0' width='260.0' height='120.0' rx='10' stroke='#1f6fb2' fill='#dbe9f6' stroke-width='1.8'/><text x='430.0' y='166.0' font-size='14' fill='#222222' text-anchor='middle' font-weight='normal'>código de 15 qubits:</text><text x='430.0' y='184.9' font-size='14' fill='#222222' text-anchor='middle' font-weight='normal'>solo puertas Clifford</text><text x='430.0' y='203.8' font-size='14' fill='#222222' text-anchor='middle' font-weight='normal'>y medidas de estabilizadores</text>
<line x1='562.0' y1='160.0' x2='700.0' y2='120.0' stroke='#2e8b57' stroke-width='2' marker-end='url(#arrow-a3)'/>
<text x='640.0' y='110.0' font-size='12' fill='#2e8b57' text-anchor='middle' font-weight='normal'>síndrome trivial → se conserva</text>
<line x1='562.0' y1='210.0' x2='700.0' y2='260.0' stroke='#888888' stroke-width='1.6' stroke-dasharray='4 3' marker-end='url(#arrow-muted)'/>
<text x='640.0' y='285.0' font-size='12' fill='#888888' text-anchor='middle' font-weight='normal'>otro síndrome → se descarta</text>
<circle cx='720.0' cy='120.0' r='9.0' stroke='#2e8b57' fill='#e3f2e8' stroke-width='2'/>
<text x='740.0' y='116.0' font-size='14' fill='#2e8b57' text-anchor='start' font-weight='bold'>1 estado T, error ≈ 35ε³</text>
<text x='740.0' y='136.0' font-size='12' fill='#888888' text-anchor='start' font-weight='normal'>éxito ≈ 1 − 15ε</text>
<text x='740.0' y='190.0' font-size='13' fill='#222222' text-anchor='start' font-weight='normal'>ronda 2 (15 salidas de la ronda 1)</text>
<text x='740.0' y='214.0' font-size='14' fill='#1f6fb2' text-anchor='start' font-weight='bold'>ε = 1 %  →  3,5·10⁻⁵  →  ≈ 1,5·10⁻¹²</text>
<text x='560.0' y='416.0' font-size='12' fill='#888888' text-anchor='middle' font-weight='normal'>Según Bravyi y Kitaev (2005; su «tipo H» es el estado T actual) y Fowler et al. (2012). Cada ronda consume 15 estados por cada uno que sale.</text>
